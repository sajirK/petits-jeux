<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Le Dessin</title>
  <link rel="stylesheet" href="../../css/common.css?v=2.1.0" />
  <link rel="stylesheet" href="../../css/tokens.css?v=2.1.0" />
  <link rel="stylesheet" href="../../css/kit.css?v=2.1.0" />
  <style>
    .k-stage { padding: 0; }
    .paint { flex: 1; min-height: 0; width: 100%; display: flex; flex-direction: column; }
    .paint canvas { flex: 1; min-height: 0; width: 100%; touch-action: none; display: block; background: #fff; }
    .tools { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; padding: 8px 8px max(8px, env(safe-area-inset-bottom)); background: #ffe0f0; box-shadow: 0 -4px 0 rgba(0,0,0,0.06); }
    .tool { width: var(--tap-min); height: var(--tap-min); border-radius: 50%; font-size: 32px; background: #fff; box-shadow: 0 4px 0 rgba(0,0,0,0.12); display: grid; place-items: center; transition: transform 0.1s; }
    .tool.active { transform: scale(1.15); outline: 4px solid #3b2a4d; }
  </style>
</head>
<body>
  <script src="../../js/common.js?v=2.1.0"></script>
  <script src="../../js/kit/levels.js?v=2.1.0"></script>
  <script src="../../js/kit/kit.js?v=2.1.0"></script>
  <script src="logic.js?v=2.1.0"></script>
  <script>
    const DL = DessinLogic;
    function start(round) {
      const el = Kit.ui.el;
      const paint = el("div", "paint"), canvas = document.createElement("canvas"), tools = el("div", "tools");
      paint.append(canvas, tools);
      round.stage.appendChild(paint);
      const ctx = canvas.getContext("2d");
      let mode = { type: "color", value: DL.COLORS[0][0] }, rainbow = 0;
      function resize() {
        const dpr = devicePixelRatio || 1, r = canvas.getBoundingClientRect();
        if (!r.width || !r.height) return;
        const old = document.createElement("canvas"); old.width = canvas.width; old.height = canvas.height;
        if (canvas.width) old.getContext("2d").drawImage(canvas, 0, 0);
        canvas.width = r.width * dpr; canvas.height = r.height * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        if (old.width) ctx.drawImage(old, 0, 0, old.width / dpr, old.height / dpr);
      }
      function addTool(html, m, bg, name) {
        const b = el("button", "tool");
        b.innerHTML = html; b.setAttribute("aria-label", name);
        if (bg) b.style.background = bg;
        b.onclick = () => {
          Jeux.sounds.click();
          if (m.type === "clear") { ctx.clearRect(0, 0, canvas.width, canvas.height); round.say("Tout propre !"); return; }
          mode = m;
          tools.querySelectorAll(".tool").forEach((t) => t.classList.remove("active"));
          b.classList.add("active");
          round.say(name);
        };
        tools.appendChild(b);
        return b;
      }
      DL.COLORS.forEach(([c, n], i) => { const b = addTool("", { type: "color", value: c }, c, n); if (!i) b.classList.add("active"); });
      addTool("🌈", { type: "rainbow" }, null, "arc-en-ciel");
      DL.STAMPS.forEach(([s, n]) => addTool(s, { type: "stamp", value: s }, null, n));
      addTool("🧽", { type: "eraser" }, null, "la gomme");
      addTool("🗑️", { type: "clear" }, null, "tout effacer");
      const pointers = new Map();
      const pos = (e) => { const r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
      const size = () => Math.max(10, Math.min(canvas.clientWidth, canvas.clientHeight) / 40);
      function style() {
        ctx.globalCompositeOperation = mode.type === "eraser" ? "destination-out" : "source-over";
        let c = mode.value;
        if (mode.type === "rainbow") { rainbow = (rainbow + 4) % 360; c = `hsl(${rainbow},90%,55%)`; }
        ctx.strokeStyle = ctx.fillStyle = c || "#000";
        ctx.lineWidth = mode.type === "eraser" ? size() * 3 : size();
        ctx.lineCap = ctx.lineJoin = "round";
      }
      canvas.addEventListener("pointerdown", (e) => {
        try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
        const p = pos(e);
        if (mode.type === "stamp") { ctx.globalCompositeOperation = "source-over"; ctx.font = `${size() * 4}px serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(mode.value, p.x, p.y); Jeux.sounds.pop(); return; }
        pointers.set(e.pointerId, p);
        style(); ctx.beginPath(); ctx.arc(p.x, p.y, ctx.lineWidth / 2, 0, Math.PI * 2); ctx.fill();
      });
      canvas.addEventListener("pointermove", (e) => {
        const last = pointers.get(e.pointerId);
        if (!last) return;
        const p = pos(e);
        style(); ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke();
        pointers.set(e.pointerId, p);
      });
      const end = (e) => pointers.delete(e.pointerId);
      canvas.addEventListener("pointerup", end); canvas.addEventListener("pointercancel", end);
      const ro = new ResizeObserver(resize); ro.observe(canvas); round.onCleanup(() => ro.disconnect());
      requestAnimationFrame(resize);
    }
    Kit.game({
      id: "dessin", title: "Le Dessin", icon: "🎨", mode: "free",
      bg: "#fff7fb",
      instruction: () => "Choisis une couleur ou un autocollant, puis dessine avec ton doigt ! Quand tu as fini, appuie sur le bouton vert.",
      doneText: "Quel beau dessin ! Bravo, artiste !",
      start,
    });
  </script>
</body>
</html>
