<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Le Petit Robot</title>
  <link rel="stylesheet" href="../../css/common.css?v=2.1.0" />
  <link rel="stylesheet" href="../../css/tokens.css?v=2.1.0" />
  <link rel="stylesheet" href="../../css/kit.css?v=2.1.0" />
  <style>
    .main { flex: 1; min-height: 0; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
    @media (orientation: landscape) { .main { flex-direction: row; } }
    .boardWrap { position: relative; }
    .board { display: grid; gap: 4px; padding: 8px; background: #8ac926; border-radius: 20px; box-shadow: 0 8px 0 #6a994e; }
    .tile { width: var(--t); height: var(--t); border-radius: 10px; background: #b5e48c; display: grid; place-items: center; font-size: calc(var(--t) * 0.68); }
    .tile.path { background: #fff3b0; }
    .tile.bump { animation: bump 0.4s; background: #ffadad; }
    @keyframes bump { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
    .bot { position: absolute; z-index: 3; font-size: calc(var(--t) * 0.75); transition: left 0.35s ease, top 0.35s ease; transform: translate(-50%, -50%); pointer-events: none; }
    .bot.happy { animation: hop 0.5s 3; }
    @keyframes hop { 50% { transform: translate(-50%, -80%); } }
    .side { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .program { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; background: #fff; border-radius: 18px; padding: 8px; min-height: 58px; box-shadow: var(--sh-1); max-width: min(96vw, 560px); }
    .slot { width: clamp(40px, 8.5vmin, 52px); height: clamp(40px, 8.5vmin, 52px); border-radius: 12px; background: #f1f3f5; display: grid; place-items: center; font-size: clamp(22px, 5vmin, 32px); border: 3px dashed #dee2e6; }
    .slot.full { background: #e0f4ff; border: 3px solid #4cc9f0; }
    .slot.now { background: #ffd166; border-color: #f77f00; transform: scale(1.1); }
    .slot.err { background: #ffadad; border-color: #e63946; }
    .slot.hint { background: #fff; border: 3px dashed #7b2cbf; opacity: 0.6; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .arrow { width: clamp(64px, 13vmin, 84px); height: clamp(64px, 13vmin, 84px); border-radius: 18px; background: #fff; box-shadow: var(--sh-2); font-size: clamp(30px, 7vmin, 46px); }
    .arrow:active { transform: scale(0.9) translateY(4px); }
    .act { min-width: var(--tap-min); height: clamp(64px, 13vmin, 84px); padding: 0 16px; border-radius: 18px; font-size: clamp(24px, 5.4vmin, 34px); box-shadow: var(--sh-2); color: #fff; }
    .act.go { background: #06d6a0; } .act.undo { background: #adb5bd; } .act.bulb { background: #7b2cbf; }
    .act:disabled, .arrow:disabled { opacity: 0.45; }
  </style>
</head>
<body>
  <script src="../../js/common.js?v=2.1.0"></script>
  <script src="../../js/kit/levels.js?v=2.1.0"></script>
  <script src="../../js/kit/kit.js?v=2.1.0"></script>
  <script src="logic.js?v=2.1.0"></script>
  <script>
    const RL = RobotLogic;
    const ARROW = { up: "⬆️", down: "⬇️", left: "⬅️", right: "➡️" };
    const NAME_DIR = { up: "en haut", down: "en bas", left: "à gauche", right: "à droite" };
    const pick = (a) => a[Math.floor(Math.random() * a.length)];

    function start(round) {
      const el = Kit.ui.el;
      const grid = RL.generate(RL.gridFor(round.level, round.index));
      let program = [], running = false, hintShown = 0;
      const wait = (ms) => new Promise((r) => round.timeout(r, ms));
      const main = el("div", "main"), boardWrap = el("div", "boardWrap"), board = el("div", "board"), bot = el("div", "bot", "🤖");
      boardWrap.append(board, bot);
      const side = el("div", "side"), programEl = el("div", "program"), arrows = el("div", "row"), acts = el("div", "row");
      side.append(programEl, arrows, acts);
      main.append(boardWrap, side);
      round.stage.appendChild(main);
      const arrowBtns = {};
      for (const d of ["left", "up", "down", "right"]) {
        const b = el("button", "arrow", ARROW[d]); b.setAttribute("aria-label", NAME_DIR[d]);
        b.onclick = () => { if (running || program.length >= grid.maxSteps) return; program.push(d); Jeux.sounds.click(); round.say(NAME_DIR[d]); drawProgram(); };
        arrows.appendChild(b); arrowBtns[d] = b;
      }
      const undo = el("button", "act undo", "⌫"), bulb = el("button", "act bulb", "💡"), go = el("button", "act go", "▶️");
      undo.setAttribute("aria-label", "Effacer la dernière flèche"); bulb.setAttribute("aria-label", "Indice"); go.setAttribute("aria-label", "Go !");
      acts.append(undo, bulb, go);

      const fit = () => {
        const r = round.stage.getBoundingClientRect(), land = r.width > r.height;
        const availW = land ? r.width * 0.5 : r.width - 20, availH = land ? r.height - 20 : r.height - 260;
        const t = Math.floor(Math.max(34, Math.min(84, (availW - 16) / grid.w - 4, (availH - 16) / grid.h - 4)));
        round.stage.style.setProperty("--t", t + "px");
        if (!running) placeBot(...grid.start);
      };
      const cellCenter = (x, y) => { const tile = board.children[y * grid.w + x]; return [tile.offsetLeft + tile.offsetWidth / 2, tile.offsetTop + tile.offsetHeight / 2]; };
      const placeBot = (x, y) => { const [cx, cy] = cellCenter(x, y); bot.style.left = cx + "px"; bot.style.top = cy + "px"; };
      board.style.gridTemplateColumns = `repeat(${grid.w}, var(--t))`;
      const walls = new Set(grid.walls.map(([x, y]) => x + "," + y));
      for (let y = 0; y < grid.h; y++) for (let x = 0; x < grid.w; x++) {
        const t = el("div", "tile");
        if (walls.has(x + "," + y)) t.textContent = pick(["🌳", "🌲"]);
        if (x === grid.goal[0] && y === grid.goal[1]) t.textContent = "🔋";
        board.appendChild(t);
      }
      function drawProgram(active = -1, error = -1) {
        programEl.innerHTML = "";
        for (let i = 0; i < grid.maxSteps; i++) {
          const s = el("div", "slot");
          if (i < program.length) { s.classList.add("full"); s.textContent = ARROW[program[i]]; if (i === active) s.classList.add("now"); if (i === error) s.classList.add("err"); }
          else if (hintShown && i < hintShown) { s.classList.add("hint"); s.textContent = ARROW[grid.solution[i]]; }
          programEl.appendChild(s);
        }
        Object.values(arrowBtns).forEach((b) => (b.disabled = running || program.length >= grid.maxSteps));
        [undo, bulb, go].forEach((b) => (b.disabled = running));
      }
      undo.onclick = () => { if (!running && program.length) { program.pop(); Jeux.sounds.pop(); drawProgram(); } };
      bulb.onclick = () => {
        if (running) return;
        let ok = 0;
        while (ok < program.length && program[ok] === grid.solution[ok]) ok++;
        program = program.slice(0, ok);
        hintShown = Math.min(grid.solution.length, Math.max(hintShown, ok) + 1);
        Jeux.sounds.coin();
        round.say(`Essaie ${NAME_DIR[grid.solution[hintShown - 1]]} !`);
        drawProgram();
      };
      go.onclick = async () => {
        if (running) return;
        if (!program.length) { round.say("Choisis d'abord des flèches !"); round.hint(arrowBtns[grid.solution[0]]); return; }
        running = true; drawProgram();
        const res = RL.run(grid, program);
        placeBot(...grid.start);
        await wait(350);
        for (let i = 1; i < res.trace.length; i++) {
          drawProgram(i - 1);
          placeBot(...res.trace[i]);
          board.children[res.trace[i][1] * grid.w + res.trace[i][0]].classList.add("path");
          Jeux.sounds.tone(400 + i * 40, 0.08, "triangle", 0.15);
          await wait(450);
        }
        if (res.result === "win") {
          drawProgram(res.at); bot.classList.add("happy");
          round.win(bot, "Le robot a trouvé la pile !", { delay: 2400 });
          return;
        }
        if (res.result === "wall" || res.result === "edge") {
          drawProgram(-1, res.at);
          const [x, y] = res.trace[res.trace.length - 1];
          board.children[y * grid.w + x].classList.add("bump");
          round.miss(programEl.children[res.at], res.result === "wall" ? "Bong ! Il y a un arbre ! Change la flèche rouge." : "Oups, le robot ne peut pas sortir du jardin ! Change la flèche rouge.");
        } else round.miss(programEl, "Le robot n'est pas encore arrivé ! Ajoute des flèches.");
        await wait(1600);
        board.querySelectorAll(".path, .bump").forEach((t) => t.classList.remove("path", "bump"));
        placeBot(...grid.start);
        running = false;
        drawProgram(-1, res.result === "short" ? -1 : res.at);
      };
      round.setHintTarget(() => { if (running) return null; const m = RL.nextMove(grid, program); return m === "go" ? go : m === "undo" ? undo : arrowBtns[m]; });
      drawProgram();
      requestAnimationFrame(fit);
      const ro = new ResizeObserver(fit); ro.observe(round.stage); round.onCleanup(() => ro.disconnect());
      round.timeout(() => round.say(round.index === 0 ? "Aide le robot à aller jusqu'à la pile ! Choisis les flèches, puis appuie sur le bouton vert." : "Un nouveau jardin ! Où est la pile ?"), round.index === 0 ? 3000 : 400);
    }

    Kit.game({
      id: "robot", title: "Le Petit Robot", icon: "🤖",
      bg: "linear-gradient(160deg, #cfe8ff, #b8f2e6)",
      instruction: () => "Programme le robot avec les flèches pour qu'il aille jusqu'à la pile, sans toucher les arbres !",
      levels: RL.LEVELS,
      start,
    });
  </script>
</body>
</html>
