<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Le Petit Robot</title>
  <link rel="stylesheet" href="../../css/common.css" />
  <style>
    html, body { height: 100%; }
    body { background: linear-gradient(160deg, #cfe8ff, #b8f2e6); }
    .brain { height: 100%; }
    #mission { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    #main { flex: 1; min-height: 0; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 10px; }
    #board {
      display: grid; gap: 4px; padding: 8px;
      background: #8ac926; border-radius: 20px; box-shadow: 0 8px 0 #6a994e;
    }
    .tile {
      width: var(--t); height: var(--t); border-radius: 10px;
      background: #b5e48c; display: grid; place-items: center;
      font-size: calc(var(--t) * 0.68); position: relative;
    }
    .tile.path { background: #fff3b0; }
    .tile.bump { animation: shake 0.4s; background: #ffadad; }
    #robot { position: absolute; z-index: 3; font-size: calc(var(--t) * 0.75); transition: left 0.35s ease, top 0.35s ease; transform: translate(-50%, -50%); pointer-events: none; }
    #robot.happy { animation: bounce-in 0.5s 3; }
    #program {
      display: flex; flex-wrap: wrap; gap: 5px; justify-content: center;
      background: #fff; border-radius: 18px; padding: 8px; min-height: 58px; box-shadow: var(--shadow);
      max-width: min(96vw, 640px);
    }
    .slot {
      width: clamp(38px, 8.5vmin, 52px); height: clamp(38px, 8.5vmin, 52px); border-radius: 12px;
      background: #f1f3f5; display: grid; place-items: center; font-size: clamp(22px, 5vmin, 32px);
      border: 3px dashed #dee2e6;
    }
    .slot.full { background: #e0f4ff; border: 3px solid #4cc9f0; }
    .slot.now { background: #ffd166; border-color: #f77f00; transform: scale(1.1); }
    .slot.err { background: #ffadad; border-color: #e63946; }
    .slot.hint { background: #fff; border: 3px dashed #7b2cbf; opacity: 0.6; }
    #controls { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; }
    .arrow {
      width: clamp(58px, 13vmin, 84px); height: clamp(58px, 13vmin, 84px); border-radius: 18px;
      background: #fff; box-shadow: 0 6px 0 rgba(0,0,0,0.15); font-size: clamp(30px, 7vmin, 46px);
    }
    .arrow:active { transform: scale(0.9) translateY(4px); }
    .act { height: clamp(58px, 13vmin, 84px); padding: 0 16px; border-radius: 18px; font-size: clamp(20px, 4.6vmin, 30px); box-shadow: 0 6px 0 rgba(0,0,0,0.18); color: #fff; }
    #go { background: #06d6a0; }
    #undo { background: #adb5bd; }
    #clear { background: #ef476f; }
    #hintBtn { background: #7b2cbf; }
    .act:disabled, .arrow:disabled { opacity: 0.45; }
    @media (orientation: landscape) and (max-height: 600px) {
      #main { flex-direction: row; justify-content: center; align-items: center; padding-left: 70px; }
      #side { display: flex; flex-direction: column; gap: 10px; align-items: center; max-width: 50vw; }
      .game-title { display: none; }
    }
    #side { display: contents; }
    @media (orientation: landscape) and (max-height: 600px) { #side { display: flex; } }
  </style>
</head>
<body>
  <div class="brain">
    <h1 class="game-title">Le Petit Robot</h1>
    <div class="brain-bar" id="bar"><div class="brain-pill" id="wins">🔋 0</div></div>
    <div id="mission">Programme le robot 🤖 pour aller jusqu'à la pile 🔋 sans toucher les arbres 🌳</div>
    <div id="main">
      <div id="boardWrap" style="position: relative;"><div id="board"></div><div id="robot">🤖</div></div>
      <div id="side">
        <div id="program"></div>
        <div id="controls">
          <button class="arrow" data-dir="left" aria-label="Gauche">⬅️</button>
          <button class="arrow" data-dir="up" aria-label="Haut">⬆️</button>
          <button class="arrow" data-dir="down" aria-label="Bas">⬇️</button>
          <button class="arrow" data-dir="right" aria-label="Droite">➡️</button>
        </div>
        <div id="controls2" style="display:flex; gap:8px; flex-wrap:wrap; justify-content:center;">
          <button class="act" id="undo" aria-label="Effacer le dernier">⌫</button>
          <button class="act" id="clear" aria-label="Tout effacer">🗑️</button>
          <button class="act" id="hintBtn" aria-label="Indice">💡</button>
          <button class="act" id="go">▶️ Go !</button>
        </div>
      </div>
    </div>
  </div>

  <script src="../../js/common.js"></script>
  <script src="logic.js"></script>
  <script>
    Jeux.addHomeButton();
    const { sounds, say, confetti, pick } = Jeux;
    const prog = Jeux.progress("robot", RobotLogic.MAX_LEVEL, { upAfter: 2, downAfter: 4 });
    const badge = Jeux.levelBadge(prog, () => newLevel());
    document.getElementById("bar").prepend(badge);
    const ARROW = { up: "⬆️", down: "⬇️", left: "⬅️", right: "➡️" };
    const NAME_DIR = { up: "en haut", down: "en bas", left: "à gauche", right: "à droite" };
    const board = document.getElementById("board");
    const robotEl = document.getElementById("robot");
    const programEl = document.getElementById("program");
    let grid, program = [], running = false, wins = parseInt(localStorage.getItem("jeux.robot.wins") || "0", 10), hintShown = 0, fails = 0;
    document.getElementById("wins").textContent = "🔋 " + wins;

    function tileSize() {
      const main = document.getElementById("main").getBoundingClientRect();
      const landscape = matchMedia("(orientation: landscape) and (max-height: 600px)").matches;
      const availW = landscape ? (main.width - 70) * 0.48 : main.width - 20;
      const availH = landscape ? main.height - 20 : main.height - 250;
      const t = Math.floor(Math.max(34, Math.min(84, (availW - 16) / grid.w - 4, (availH - 16) / grid.h - 4)));
      document.documentElement.style.setProperty("--t", t + "px");
      return t;
    }

    function cellCenter(x, y) {
      const tile = board.children[y * grid.w + x];
      return [tile.offsetLeft + tile.offsetWidth / 2, tile.offsetTop + tile.offsetHeight / 2];
    }
    function placeRobot(x, y) {
      const [cx, cy] = cellCenter(x, y);
      robotEl.style.left = cx + "px";
      robotEl.style.top = cy + "px";
    }

    function drawBoard() {
      tileSize();
      board.style.gridTemplateColumns = `repeat(${grid.w}, var(--t))`;
      board.innerHTML = "";
      const walls = new Set(grid.walls.map(([x, y]) => x + "," + y));
      for (let y = 0; y < grid.h; y++) for (let x = 0; x < grid.w; x++) {
        const t = document.createElement("div");
        t.className = "tile";
        if (walls.has(x + "," + y)) t.textContent = pick(["🌳", "🌲"]);
        if (x === grid.goal[0] && y === grid.goal[1]) t.textContent = "🔋";
        board.appendChild(t);
      }
      requestAnimationFrame(() => placeRobot(...grid.start));
    }

    function drawProgram(active = -1, error = -1) {
      programEl.innerHTML = "";
      for (let i = 0; i < grid.maxSteps; i++) {
        const s = document.createElement("div");
        s.className = "slot";
        if (i < program.length) {
          s.classList.add("full");
          s.textContent = ARROW[program[i]];
          if (i === active) s.classList.add("now");
          if (i === error) s.classList.add("err");
        } else if (hintShown && i < hintShown && i >= program.length) {
          s.classList.add("hint");
          s.textContent = ARROW[grid.solution[i]];
        }
        programEl.appendChild(s);
      }
      document.querySelectorAll(".arrow").forEach((b) => (b.disabled = running || program.length >= grid.maxSteps));
      ["undo", "clear", "go", "hintBtn"].forEach((id) => (document.getElementById(id).disabled = running));
    }

    function newLevel() {
      grid = RobotLogic.generate(prog.level);
      program = []; hintShown = 0; fails = 0;
      badge.update();
      drawBoard();
      drawProgram();
      robotEl.classList.remove("happy");
      setTimeout(() => say("Aide le robot à aller jusqu'à la pile ! Choisis les flèches, puis appuie sur Go."), 400);
    }

    document.querySelectorAll(".arrow").forEach((b) => {
      b.onclick = () => {
        if (running || program.length >= grid.maxSteps) return;
        program.push(b.dataset.dir);
        sounds.click();
        say(NAME_DIR[b.dataset.dir]);
        drawProgram();
      };
    });
    document.getElementById("undo").onclick = () => { if (!running && program.length) { program.pop(); sounds.pop(); drawProgram(); } };
    document.getElementById("clear").onclick = () => { if (!running) { program = []; sounds.wrong(); drawProgram(); placeRobot(...grid.start); } };
    document.getElementById("hintBtn").onclick = () => {
      if (running) return;
      // l'indice montre la bonne suite, une flèche de plus à chaque appui,
      // à partir de ce qui est déjà juste dans le programme
      let ok = 0;
      while (ok < program.length && program[ok] === grid.solution[ok]) ok++;
      program = program.slice(0, ok);
      hintShown = Math.min(grid.solution.length, Math.max(hintShown, ok) + 1);
      sounds.coin();
      say(`Essaie ${NAME_DIR[grid.solution[hintShown - 1]]} !`);
      drawProgram();
    };

    document.getElementById("go").onclick = async () => {
      if (running) return;
      if (!program.length) { say("Choisis d'abord des flèches !"); sounds.wrong(); return; }
      running = true;
      drawProgram();
      const res = RobotLogic.run(grid, program);
      placeRobot(...grid.start);
      await wait(350);
      // on rejoue les pas un par un
      for (let i = 1; i < res.trace.length; i++) {
        drawProgram(i - 1);
        placeRobot(...res.trace[i]);
        board.children[res.trace[i][1] * grid.w + res.trace[i][0]].classList.add("path");
        sounds.tone(400 + i * 40, 0.08, "triangle", 0.15);
        await wait(450);
      }
      if (res.result === "win") {
        drawProgram(res.at);
        robotEl.classList.add("happy");
        sounds.win();
        confetti(50, ["🔋", "⚡", "⭐", "🤖"]);
        wins++;
        localStorage.setItem("jeux.robot.wins", wins);
        document.getElementById("wins").textContent = "🔋 " + wins;
        Jeux.addStars(1);
        const extra = program.length > res.at + 1 ? " Il restait des flèches en trop, mais c'est gagné !" : "";
        const lv = hintShown ? null : prog.success();
        badge.update();
        say(`Bravo ${Jeux.NAME} ! Le robot a trouvé la pile !${extra}${lv === "up" ? ` Niveau ${prog.level} !` : ""}`);
        await wait(lv === "up" ? 4500 : 3200);
        running = false;
        newLevel();
        return;
      }
      fails++;
      prog.fail();
      if (res.result === "wall" || res.result === "edge") {
        drawProgram(-1, res.at);
        const [x, y] = res.trace[res.trace.length - 1];
        sounds.wrong();
        board.children[y * grid.w + x].classList.add("bump");
        say(res.result === "wall" ? "Bong ! Il y a un arbre ! Change la flèche en rouge." : "Oups, le robot ne peut pas sortir du jardin ! Change la flèche en rouge.");
      } else {
        sounds.wrong();
        say("Le robot n'est pas encore arrivé ! Ajoute des flèches.");
      }
      if (fails >= 2 && !hintShown) setTimeout(() => say("Tu peux appuyer sur l'ampoule pour avoir un indice."), 3500);
      await wait(1600);
      board.querySelectorAll(".path, .bump").forEach((t) => t.classList.remove("path", "bump"));
      placeRobot(...grid.start);
      running = false;
      drawProgram(-1, res.result === "short" ? -1 : res.at);
    };

    const wait = (ms) => new Promise((r) => setTimeout(r, ms));
    addEventListener("resize", () => { if (grid && !running) { tileSize(); placeRobot(...grid.start); } });
    grid = RobotLogic.generate(prog.level);
    newLevel();
  </script>
</body>
</html>
