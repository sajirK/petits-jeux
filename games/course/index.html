<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Course de Bulles</title>
  <link rel="stylesheet" href="../../css/common.css?v=2.1.0" />
  <link rel="stylesheet" href="../../css/tokens.css?v=2.1.0" />
  <link rel="stylesheet" href="../../css/kit.css?v=2.1.0" />
  <style>
    .k-stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  </style>
</head>
<body>
  <script src="../../js/common.js?v=2.1.0"></script>
  <script src="../../js/kit/levels.js?v=2.1.0"></script>
  <script src="../../js/kit/kit.js?v=2.1.0"></script>
  <script src="logic.js?v=2.1.0"></script>
  <script>
    const CL = CourseLogic;
    const pick = (a) => a[Math.floor(Math.random() * a.length)];

    function start(round) {
      const cfg = round.cfg;
      const meter = round.meter("🦀", cfg.dist);
      const canvas = document.createElement("canvas");
      round.stage.appendChild(canvas);
      const ctx = canvas.getContext("2d");
      let W = 300, H = 300, U = 30;
      const resize = () => { const dpr = devicePixelRatio || 1; W = round.stage.clientWidth; H = round.stage.clientHeight; canvas.width = W * dpr; canvas.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); U = H / 10; };
      resize();
      const ro = new ResizeObserver(resize); ro.observe(round.stage); round.onCleanup(() => ro.disconnect());

      const player = { y: 5, target: 5, r: 0.55 };
      let obstacles = [], stars = [], bubbles = [], dist = 0, inv = 0, nextObs = 3, t = 0, shownMeter = -1;
      let boss = false, bossHp = 0, finished = false, started = false, caught = 0;
      const PX = 2.5;
      const setTarget = (e) => { const r = canvas.getBoundingClientRect(); player.target = Math.max(CL.MIN_Y, Math.min(CL.MAX_Y, (e.clientY - r.top) / U)); };
      canvas.addEventListener("pointerdown", setTarget);
      canvas.addEventListener("pointermove", setTarget);
      const keys = {};
      const kd = (e) => { keys[e.key] = true; if (e.key.startsWith("Arrow")) e.preventDefault(); }, ku = (e) => { keys[e.key] = false; };
      addEventListener("keydown", kd); addEventListener("keyup", ku);
      round.onCleanup(() => { removeEventListener("keydown", kd); removeEventListener("keyup", ku); });

      function spawn() {
        const vis = W / U, o = CL.obstacle(cfg, dist);
        obstacles.push({ x: vis + 1, w: 1.3, top: o.top, bottom: o.bottom, center: o.center, hit: false, kind: pick(["coral", "rock", "weed"]) });
        const n = 1 + Math.floor(Math.random() * 3);
        for (let i = 0; i < n; i++) stars.push({ x: vis + 1.65 + i * 1.2, y: o.center + (Math.random() - 0.5) * (o.bottom - o.top - 1.4) });
        if (Math.random() < 0.6) stars.push({ x: vis + 4, y: 1.2 + Math.random() * 7.6 });
      }
      function update(dt) {
        if (!started || finished) return;
        const speed = CL.speedAt(cfg, dist);
        if (!boss) {
          dist += speed * dt;
          const m = Math.min(cfg.dist, Math.floor(dist));
          if (m !== shownMeter) { shownMeter = m; meter.set(m); }
          if (dist >= cfg.dist) {
            boss = true; bossHp = cfg.boss; obstacles = [];
            round.say(`Voilà le gros crabe ! Attrape les ${cfg.boss} étoiles pour le faire danser !`);
            for (let i = 0; i < cfg.boss; i++) stars.push({ x: W / U - 2.4 - (cfg.boss - 1 - i) * 0.9, y: 2 + ((i * 6) / Math.max(1, cfg.boss - 1)), boss: true });
          }
        }
        if (keys.ArrowUp) player.target = Math.max(CL.MIN_Y, player.target - 8 * dt);
        if (keys.ArrowDown) player.target = Math.min(CL.MAX_Y, player.target + 8 * dt);
        player.y += (player.target - player.y) * Math.min(1, dt * 9);
        inv = Math.max(0, inv - dt);
        nextObs -= speed * dt;
        if (!boss && nextObs <= 0 && dist < cfg.dist - 6) { spawn(); nextObs = cfg.spacing + Math.random() * 2; }
        for (const o of obstacles) {
          o.x -= speed * dt;
          if (!o.hit && inv <= 0 && PX + player.r * 0.8 > o.x && PX - player.r * 0.8 < o.x + o.w && (player.y - player.r * 0.8 < o.top || player.y + player.r * 0.8 > o.bottom)) {
            o.hit = true; inv = 1.5; round.oops(); Jeux.sounds.wrong();
            round.say(pick(["Aïe ! Passe par le trou !", "Attention au corail !", "Oups !"]));
          }
        }
        obstacles = obstacles.filter((o) => o.x > -3);
        for (let i = stars.length - 1; i >= 0; i--) {
          const s = stars[i];
          if (!s.boss) s.x -= speed * dt;
          if (Math.hypot(s.x - PX, s.y - player.y) < player.r + 0.4 || (s.boss && Math.abs(s.y - player.y) < player.r + 0.4)) {
            stars.splice(i, 1); caught++; Jeux.sounds.coin();
            if (s.boss && --bossHp <= 0) { finished = true; Jeux.sounds.win(); round.timeout(() => round.end({ text: `Le crabe danse ! Bravo ! Tu as attrapé ${caught} étoiles !` }), 1500); }
          } else if (s.x < -2) stars.splice(i, 1);
        }
        if (Math.random() < dt * 6) bubbles.push({ x: W / U + 0.5, y: Math.random() * 10, r: 0.08 + Math.random() * 0.2 });
        for (const b of bubbles) { b.x -= speed * dt * 0.6; b.y -= dt * 0.4; }
        bubbles = bubbles.filter((b) => b.x > -1);
      }
      // les étoiles du crabe viennent vers le poisson une par une
      function bossPull(dt) { if (!boss || finished) return; for (const s of stars) if (s.boss) s.x = Math.max(PX, s.x - dt * 1.6); }
      function em(ch, x, y, size, alpha = 1) { ctx.globalAlpha = alpha; ctx.font = `${size}px serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(ch, x, y); ctx.globalAlpha = 1; }
      function column(x, y, w, h, [c1, c2], top) {
        if (h <= 0) return;
        ctx.fillStyle = c1; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, w * 0.4) : ctx.rect(x, y, w, h); ctx.fill();
        ctx.fillStyle = c2; ctx.fillRect(x + w * 0.65, y, w * 0.2, h);
        ctx.fillStyle = "rgba(255,255,255,0.25)";
        for (let i = 0.6; i < h / U; i += 1.1) { ctx.beginPath(); ctx.arc(x + w * 0.35, y + (top ? h - i * U : i * U), w * 0.12, 0, Math.PI * 2); ctx.fill(); }
      }
      function draw() {
        const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, "#48cae4"); g.addColorStop(1, "#023e8a");
        ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = "rgba(255,255,255,0.06)";
        for (let i = 0; i < 5; i++) { const x = ((((i * 300 - dist * 8) % (W + 300)) + W + 300) % (W + 300)) - 150; ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + 80, 0); ctx.lineTo(x - 120, H); ctx.lineTo(x - 220, H); ctx.fill(); }
        ctx.fillStyle = "#f4d58d"; ctx.fillRect(0, H - U * 0.35, W, U * 0.35);
        ctx.strokeStyle = "rgba(255,255,255,0.5)"; ctx.lineWidth = 2;
        for (const b of bubbles) { ctx.beginPath(); ctx.arc(b.x * U, b.y * U, b.r * U, 0, Math.PI * 2); ctx.stroke(); }
        for (const o of obstacles) { const col = o.kind === "coral" ? ["#ff6b6b", "#c9184a"] : o.kind === "rock" ? ["#8d99ae", "#4a4e69"] : ["#52b788", "#1b4332"]; column(o.x * U, 0, o.w * U, o.top * U, col, true); column(o.x * U, o.bottom * U, o.w * U, H - o.bottom * U, col, false); }
        for (const s of stars) em("⭐", s.x * U, s.y * U, U * 0.8 * (1 + Math.sin(t * 6 + s.x) * 0.08));
        if (boss) { em(finished ? "💃" : "🦀", W - U * 1.4, H / 2, U * 1.8 * (finished ? 1 + Math.sin(t * 10) * 0.1 : 1)); if (!finished) em("⭐".repeat(bossHp), W - U * 1.4, H / 2 - U * 1.2, U * 0.35); }
        const px = PX * U, py = player.y * U, blink = inv > 0 && Math.floor(t * 10) % 2 === 0;
        ctx.fillStyle = "rgba(255,255,255,0.2)"; ctx.strokeStyle = "rgba(255,255,255,0.85)"; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(px, py, U * 0.72, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.save(); ctx.translate(px, py); ctx.scale(-1, 1); em("🐠", 0, Math.sin(t * 5) * U * 0.05, U * 0.95, blink ? 0.3 : 1); ctx.restore();
      }
      round.loop((dt) => { t += dt; update(dt); bossPull(dt); draw(); });
      // Pilote automatique (robot de test) : vise le milieu du prochain passage, sinon l'étoile la plus proche
      round.setHintTarget(() => ({
        auto() {
          const next = obstacles.find((o) => o.x + o.w > PX - 0.6);
          if (next && next.x < PX + 6) { player.target = next.center; return; }
          const s = stars.filter((x) => x.x > PX - 0.3).sort((a, b) => a.x - b.x)[0];
          if (s) player.target = Math.max(CL.MIN_Y, Math.min(CL.MAX_Y, s.y));
        },
      }));
      round.timeout(() => { started = true; round.say("Glisse ton doigt en haut et en bas, et passe par les trous !"); }, 2600);
    }

    Kit.game({
      id: "course", title: "Course de Bulles", icon: "🐠", mode: "arcade",
      bg: "#48cae4",
      instruction: () => "Nage jusqu'au gros crabe ! Passe par les trous et attrape les étoiles.",
      levels: CL.LEVELS,
      start,
    });
  </script>
</body>
</html>
