<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Tranche les Fruits</title>
  <link rel="stylesheet" href="../../css/common.css?v=2.0.0" />
  <link rel="stylesheet" href="../../css/tokens.css?v=2.0.0" />
  <link rel="stylesheet" href="../../css/kit.css?v=2.0.0" />
  <style>
    .k-stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  </style>
</head>
<body>
  <script src="../../js/common.js?v=2.0.0"></script>
  <script src="../../js/kit/levels.js?v=2.0.0"></script>
  <script src="../../js/kit/kit.js?v=2.0.0"></script>
  <script src="logic.js?v=2.0.0"></script>
  <script>
    const FL = FruitsLogic;
    const pick = (a) => a[Math.floor(Math.random() * a.length)];

    function start(round) {
      const cfg = round.cfg;
      const meter = round.meter("🍉", cfg.goal);
      const canvas = document.createElement("canvas");
      round.stage.appendChild(canvas);
      const ctx = canvas.getContext("2d");
      let W = 300, H = 300, R = 40, gravity = 300, bg = null;
      function resize() {
        const dpr = devicePixelRatio || 1;
        W = round.stage.clientWidth; H = round.stage.clientHeight;
        canvas.width = W * dpr; canvas.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        R = Math.max(36, Math.min(W, H) * (round.level === 1 ? 0.09 : 0.075));
        gravity = H * cfg.gravity;
        bg = document.createElement("canvas"); bg.width = W; bg.height = H;
        const b = bg.getContext("2d"), plank = Math.max(60, H / 7);
        for (let y = 0, i = 0; y < H; y += plank, i++) {
          b.fillStyle = i % 2 ? "#c68b59" : "#b97a4b"; b.fillRect(0, y, W, plank);
          b.fillStyle = "rgba(0,0,0,0.12)"; b.fillRect(0, y + plank - 4, W, 4);
          b.strokeStyle = "rgba(90, 50, 20, 0.18)"; b.lineWidth = 2;
          for (let k = 0; k < 4; k++) { const yy = y + 10 + Math.random() * (plank - 20); b.beginPath(); b.moveTo(0, yy); b.bezierCurveTo(W * 0.3, yy + 10, W * 0.6, yy - 10, W, yy + 4); b.stroke(); }
        }
      }
      resize();
      const ro = new ResizeObserver(resize); ro.observe(round.stage); round.onCleanup(() => ro.disconnect());

      let objects = [], halves = [], drops = [], stains = [], texts = [];
      let count = 0, spawnT = 2.2, trail = [], down = false, cuts = 0, lastSwoosh = 0, done = false;
      function spawnWave() {
        const n = 1 + Math.floor(Math.random() * cfg.wave);
        for (let i = 0; i < n; i++) {
          const kind = FL.nextKind(cfg);
          const [emoji, juice] = kind === "sock" ? ["🧦", "#9aa"] : kind === "bomb" ? ["💣", "#343a40"] : kind === "rainbow" ? ["🌈", "#ff70a6"] : kind === "golden" ? ["⭐", "#ffd60a"] : pick(FL.FRUITS);
          const x = W * (0.15 + Math.random() * 0.7);
          const apex = H * (0.45 + Math.random() * 0.35);
          const vy = -Math.sqrt(2 * gravity * apex);
          const vx = ((W / 2 - x) * (0.3 + Math.random() * 0.5)) / (Math.abs(vy) / gravity);
          objects.push({ kind, emoji, juice, x, y: H + R, vx, vy, rot: 0, vr: (Math.random() - 0.5) * 4, delay: i * 0.25 });
        }
      }
      const local = (e) => { const r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top, t: performance.now() }; };
      canvas.addEventListener("pointerdown", (e) => { down = true; trail = [local(e)]; cuts = 0; });
      canvas.addEventListener("pointermove", (e) => {
        if (!down && e.pointerType !== "mouse") return;
        const p = local(e), last = trail[trail.length - 1];
        trail.push(p);
        if (last) {
          const dist = Math.hypot(p.x - last.x, p.y - last.y);
          if (dist > 3) cutAlong(last, p);
          if (dist > 25 && p.t - lastSwoosh > 180) { Jeux.sounds.swoosh(); lastSwoosh = p.t; }
        }
      });
      const up = () => { down = false; if (cuts >= 3) { texts.push({ x: W / 2, y: H / 3, s: `Combo x${cuts} !`, c: "#fff", life: 1.4, big: true }); Jeux.sounds.success(); round.say(`Combo ${cuts} !`); } cuts = 0; };
      canvas.addEventListener("pointerup", up);
      canvas.addEventListener("pointercancel", up);
      function cutAlong(a, b) {
        if (done) return;
        const angle = Math.atan2(b.y - a.y, b.x - a.x);
        for (let i = objects.length - 1; i >= 0; i--) {
          const o = objects[i];
          if (o.delay > 0) continue;
          if (FL.segDist(o.x, o.y, a, b) < R * 0.95) { objects.splice(i, 1); slice(o, angle); }
        }
      }
      function slice(o, angle) {
        const nx = Math.cos(angle + Math.PI / 2), ny = Math.sin(angle + Math.PI / 2);
        for (const side of [1, -1]) halves.push({ emoji: o.emoji, x: o.x, y: o.y, cut: angle - o.rot, side, vx: o.vx * 0.5 + nx * side * 90, vy: Math.min(o.vy, 0) * 0.3 + ny * side * 90 - 60, rot: o.rot, vr: side * 3, life: 1.6 });
        for (let k = 0; k < 16; k++) { const a = Math.random() * Math.PI * 2, v = 80 + Math.random() * 260; drops.push({ x: o.x, y: o.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 80, r: 3 + Math.random() * 5, c: o.juice, life: 0.7 + Math.random() * 0.4 }); }
        if (o.kind !== "sock") stains.push({ x: o.x, y: o.y, r: R * (0.9 + Math.random() * 0.5), c: o.juice, life: 3, seed: Math.random() * 10 });
        Jeux.sounds.splat();
        if (FL.isMistake(o.kind)) {
          round.oops(); Jeux.sounds.wrong();
          texts.push({ x: o.x, y: o.y, s: o.kind === "bomb" ? "BOUM !" : "Beurk !", c: "#343a40", life: 1.2, big: true });
          round.say(o.kind === "bomb" ? "Oups, la bombe ! Évite-la !" : pick(["Beurk ! Une chaussette !", "Oh non, pas la chaussette !"]));
          return;
        }
        const v = FL.VALUE[o.kind];
        cuts++; count += v; meter.set(count);
        if (v > 1) { texts.push({ x: o.x, y: o.y, s: `+${v} ${o.emoji}`, c: "#ffd60a", life: 1.3, big: true }); Jeux.sounds.coin(); }
        if (count >= cfg.goal && !done) { done = true; round.timeout(() => round.end({ text: "Bravo, chef ! Tous les fruits sont coupés !" }), 900); }
      }
      function drawEmoji(ch, x, y, size, rot = 0) { ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.font = `${size}px serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(ch, 0, 0); ctx.restore(); }
      round.loop((dt) => {
        if (!done) { spawnT -= dt; if (spawnT <= 0 && objects.length < 6) { spawnWave(); spawnT = cfg.spawn[0] + Math.random() * cfg.spawn[1]; } }
        for (let i = objects.length - 1; i >= 0; i--) { const o = objects[i]; if (o.delay > 0) { o.delay -= dt; continue; } o.vy += gravity * dt; o.x += o.vx * dt; o.y += o.vy * dt; o.rot += o.vr * dt; if (o.y > H + R * 2 && o.vy > 0) objects.splice(i, 1); }
        for (let i = halves.length - 1; i >= 0; i--) { const h = halves[i]; h.vy += gravity * dt; h.x += h.vx * dt; h.y += h.vy * dt; h.rot += h.vr * dt; h.life -= dt; if (h.life <= 0 || h.y > H + R * 2) halves.splice(i, 1); }
        for (let i = drops.length - 1; i >= 0; i--) { const d = drops[i]; d.vy += gravity * 0.8 * dt; d.x += d.vx * dt; d.y += d.vy * dt; d.life -= dt; if (d.life <= 0) drops.splice(i, 1); }
        for (let i = stains.length - 1; i >= 0; i--) { stains[i].life -= dt; if (stains[i].life <= 0) stains.splice(i, 1); }
        for (let i = texts.length - 1; i >= 0; i--) { texts[i].life -= dt; texts[i].y -= 40 * dt; if (texts[i].life <= 0) texts.splice(i, 1); }
        const now = performance.now(); trail = trail.filter((p) => now - p.t < 140);
        // dessin
        if (bg) ctx.drawImage(bg, 0, 0, W, H);
        for (const s of stains) { ctx.globalAlpha = Math.min(0.55, s.life / 3); ctx.fillStyle = s.c; ctx.beginPath(); for (let k = 0; k <= 12; k++) { const a = (k / 12) * Math.PI * 2, rr = s.r * (0.7 + 0.3 * Math.sin(a * 3 + s.seed)); ctx[k ? "lineTo" : "moveTo"](s.x + Math.cos(a) * rr, s.y + Math.sin(a) * rr); } ctx.fill(); }
        ctx.globalAlpha = 1;
        for (const o of objects) { if (o.delay > 0) continue; if (o.kind === "golden") { ctx.shadowColor = "#ffd60a"; ctx.shadowBlur = 25; } drawEmoji(o.emoji, o.x, o.y, R * 2, o.rot); ctx.shadowBlur = 0; }
        for (const h of halves) { ctx.save(); ctx.globalAlpha = Math.min(1, h.life * 2); ctx.translate(h.x, h.y); ctx.rotate(h.rot + h.cut); ctx.beginPath(); if (h.side > 0) ctx.rect(-R * 2, 0, R * 4, R * 2); else ctx.rect(-R * 2, -R * 2, R * 4, R * 2); ctx.clip(); ctx.rotate(-h.cut); ctx.font = `${R * 2}px serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(h.emoji, 0, 0); ctx.restore(); }
        for (const d of drops) { ctx.globalAlpha = Math.min(1, d.life * 2); ctx.fillStyle = d.c; ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2); ctx.fill(); }
        ctx.globalAlpha = 1;
        if (trail.length > 1) { for (let i = 1; i < trail.length; i++) { const a = trail[i - 1], b = trail[i], k = i / trail.length; ctx.strokeStyle = `rgba(255,255,255,${0.3 + k * 0.7})`; ctx.shadowColor = "#bde0fe"; ctx.shadowBlur = 12; ctx.lineWidth = 2 + k * 9; ctx.lineCap = "round"; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); } ctx.shadowBlur = 0; }
        for (const t of texts) { ctx.globalAlpha = Math.min(1, t.life * 1.5); ctx.font = `bold ${t.big ? 40 : 30}px "Comic Sans MS", "Chalkboard SE", sans-serif`; ctx.textAlign = "center"; ctx.lineWidth = 6; ctx.strokeStyle = "rgba(0,0,0,0.35)"; ctx.strokeText(t.s, t.x, t.y); ctx.fillStyle = t.c; ctx.fillText(t.s, t.x, t.y); }
        ctx.globalAlpha = 1;
      });
      // pour le robot de test : un coup de doigt à travers un fruit visible
      round.setHintTarget(() => {
        const o = objects.find((x) => x.delay <= 0 && !FL.isMistake(x.kind) && x.y > R && x.y < H - R && x.x > R && x.x < W - R && !objects.some((y) => FL.isMistake(y.kind) && Math.hypot(y.x - x.x, y.y - x.y) < R * 2.5));
        if (!o) return null;
        const r = canvas.getBoundingClientRect();
        return { swipe: [r.left + o.x - R * 0.6, r.top + o.y, r.left + o.x + R * 0.6, r.top + o.y], el: canvas };
      });
    }

    Kit.game({
      id: "fruits", title: "Tranche les Fruits", icon: "🍉", mode: "arcade",
      bg: "#b97a4b",
      instruction: (cfg) => cfg.sock ? "Glisse ton doigt pour couper les fruits ! Mais pas les chaussettes, ni les bombes !" : "Glisse ton doigt pour couper les fruits !",
      levels: FL.LEVELS,
      start,
    });
  </script>
</body>
</html>
