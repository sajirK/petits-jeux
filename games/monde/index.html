<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Le tour du monde des animaux</title>
  <link rel="stylesheet" href="../../css/common.css?v=2.0.0" />
  <link rel="stylesheet" href="../../css/tokens.css?v=2.0.0" />
  <link rel="stylesheet" href="../../css/kit.css?v=2.0.0" />
  <style>
    .wrap { flex: 1; min-height: 0; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 6px; }
    @media (orientation: landscape) { .wrap { flex-direction: row; justify-content: center; } }
    .k-prompt { touch-action: none; cursor: grab; }
    .k-prompt-visual { font-size: clamp(56px, 13vmin, 100px); }
    .wrap { justify-content: center; }
    .mapWrap { flex: 0 1 auto; min-height: 0; min-width: 0; width: 100%; display: grid; place-items: center; }
    @media (orientation: landscape) { .mapWrap { flex: 1; height: 100%; } }
    svg.map { width: 100%; height: auto; max-height: 100%; max-width: 1000px; }
    .land { stroke: #fff; stroke-width: 6; stroke-linejoin: round; cursor: pointer; transition: filter 0.2s, opacity 0.3s; }
    .land.off { fill: #dee2e6 !important; opacity: 0.55; pointer-events: none; }
    .land.k-good { animation: flash 0.7s; }
    @keyframes flash { 50% { filter: brightness(1.25) drop-shadow(0 0 12px #fff); } }
    .land.k-miss { animation: nope 0.45s; }
    @keyframes nope { 25%, 75% { filter: brightness(0.75); } }
    .land.hot { filter: brightness(1.15) drop-shadow(0 0 12px #fff); }
    .lbl { font-size: 22px; font-weight: bold; fill: #343a40; pointer-events: none; text-anchor: middle; }
    .placed { font-size: 40px; pointer-events: none; text-anchor: middle; dominant-baseline: middle; animation: k-in 0.4s var(--ease-bounce); }
    .deco { pointer-events: none; }
  </style>
</head>
<body>
  <script src="../../js/common.js?v=2.0.0"></script>
  <script src="../../js/kit/levels.js?v=2.0.0"></script>
  <script src="../../js/kit/kit.js?v=2.0.0"></script>
  <script src="logic.js?v=2.0.0"></script>
  <script>
    const ML = MondeLogic;
    const NS = "http://www.w3.org/2000/svg";
    const SHAPES = {
      amnord: "M70,80 Q120,40 230,45 L340,60 Q360,90 330,120 L300,170 Q280,210 250,250 L235,265 Q205,250 190,225 L150,190 Q100,160 85,130 Z",
      amsud: "M240,275 Q290,265 320,285 L350,320 Q345,360 320,390 L290,440 Q275,470 262,455 L250,400 Q235,350 232,310 Z",
      europe: "M440,70 Q490,45 560,55 L565,95 Q560,130 530,140 L490,150 Q455,145 445,120 Z",
      afrique: "M455,170 Q520,155 580,170 L610,220 Q615,270 580,320 L545,385 Q525,410 510,390 L495,330 Q470,290 455,250 Q440,210 455,170 Z",
      asie: "M575,55 Q700,30 860,45 L915,80 Q930,130 900,170 L850,215 Q800,240 760,235 L700,215 Q650,200 620,175 L580,140 Q570,100 575,55 Z",
      oceanie: "M775,325 Q820,300 880,315 L905,355 Q895,395 850,405 L800,395 Q770,375 775,325 Z",
      antarctique: "M140,478 Q500,455 860,478 L870,505 Q500,515 130,505 Z",
    };
    // où écrire le nom et poser les animaux sur chaque continent
    const SPOTS = {
      amnord: { label: [200, 105], places: [[170, 165], [250, 160], [215, 210]] },
      amsud: { label: [292, 330], places: [[285, 380], [300, 300], [270, 420]] },
      europe: { label: [505, 75], places: [[530, 115], [505, 135], [550, 85]] },
      afrique: { label: [530, 200], places: [[490, 245], [555, 245], [520, 300], [580, 205], [525, 350]] },
      asie: { label: [740, 85], places: [[660, 150], [740, 160], [820, 140], [790, 200], [700, 200]] },
      oceanie: { label: [840, 345], places: [[805, 375], [865, 375]] },
      antarctique: { label: [500, 496], places: [[330, 490], [680, 490]] },
    };
    const CALLS = { "🦘": "Hop hop !", "🐨": "Groin groin !", "🦒": "Miam !", "🦓": "Hiiii !", "🦛": "Humpf !", "🦍": "Ouh ouh !", "🐼": "Miam miam !", "🐯": "Grrr !", "🦧": "Ouh ouh !", "🦙": "Bêê !", "🦝": "Grrr !", "🐧": "Coin coin !" };
    let session = null; // la partie en cours : les animaux, et ceux déjà posés sur la carte

    function start(round) {
      const cfg = round.cfg;
      if (round.index === 0 || !session) session = { deck: ML.deck(round.level), placed: [], used: {} };
      const a = session.deck[round.index];
      const el = Kit.ui.el;
      const wrap = el("div", "wrap");
      round.stage.appendChild(wrap);
      const ask = () => round.say(`${CALLS[a.e] || ""} D'où vient ${a.name} ? Glisse-moi sur mon continent !`);
      const card = Kit.ui.prompt(wrap, { visual: a.e, onTap: null });
      const mapWrap = el("div", "mapWrap");
      wrap.appendChild(mapWrap);
      const svg = document.createElementNS(NS, "svg");
      svg.setAttribute("viewBox", "0 0 1000 520"); svg.setAttribute("class", "map");
      svg.innerHTML = `<rect x="0" y="0" width="1000" height="520" rx="30" fill="#74c0fc" />`;
      const lands = {};
      for (const [id, d] of Object.entries(SHAPES)) {
        const p = document.createElementNS(NS, "path");
        p.setAttribute("d", d); p.setAttribute("class", "land" + (cfg.continents.includes(id) ? "" : " off"));
        p.style.fill = ML.CONTINENTS[id].color; p.dataset.c = id;
        p.addEventListener("click", () => choose(id));
        svg.appendChild(p); lands[id] = p;
      }
      const deco = document.createElementNS(NS, "g"); deco.setAttribute("class", "deco");
      if (cfg.labels) for (const id of cfg.continents) deco.innerHTML += `<text class="lbl" x="${SPOTS[id].label[0]}" y="${SPOTS[id].label[1]}">${ML.CONTINENTS[id].label}</text>`;
      deco.innerHTML += `<text x="478" y="118" font-size="26" text-anchor="middle">⭐</text><text x="478" y="88" font-size="15" text-anchor="middle" fill="#343a40" font-weight="bold">Chez nous</text>`;
      for (const p of session.placed) deco.innerHTML += `<text class="placed" style="animation:none" x="${p.x}" y="${p.y}">${p.e}</text>`;
      svg.appendChild(deco);
      mapWrap.appendChild(svg);

      const landAt = (pt) => { const t = document.elementFromPoint(pt.x, pt.y); return t && t.closest && t.closest(".land:not(.off)"); };
      let hot = null;
      Kit.drag(card, {
        ghost: a.e,
        onMove: (pt) => { const l = landAt(pt); if (hot && hot !== l) hot.classList.remove("hot"); hot = l; if (l) l.classList.add("hot"); },
        onDrop: (pt) => { if (hot) hot.classList.remove("hot"); const l = landAt(pt); if (!l) return false; return choose(l.dataset.c); },
        onTap: ask,
      });
      let done = false;
      function choose(c) {
        if (done || round.ended) return false;
        if (c !== a.c) { round.miss(lands[c], ML.wrongText(a, c)); return false; }
        done = true;
        const n = session.used[c] || 0; session.used[c] = n + 1;
        const [x, y] = SPOTS[c].places[n % SPOTS[c].places.length];
        session.placed.push({ e: a.e, x, y });
        deco.innerHTML += `<text class="placed" x="${x}" y="${y}">${a.e}</text>`;
        card.style.visibility = "hidden";
        round.win(lands[c], ML.rightText(a), { praise: false, delay: 5200 });
        return true;
      }
      round.setHintTarget(() => ({ from: card, to: lands[a.c] }));
      round.timeout(ask, round.index === 0 ? 2600 : 400);
    }

    Kit.game({
      id: "monde", title: "Le tour du monde", icon: "🌍",
      bg: "linear-gradient(160deg, #e3fafc, #d3f9d8)",
      instruction: () => "Chaque animal vient d'un continent. Glisse-le sur la carte, là où il vit !",
      levels: ML.LEVELS,
      start,
    });
  </script>
</body>
</html>
