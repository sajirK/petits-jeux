<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Le Dino</title>
  <link rel="stylesheet" href="../../css/common.css?v=2.0.0" />
  <link rel="stylesheet" href="../../css/tokens.css?v=2.0.0" />
  <link rel="stylesheet" href="../../css/kit.css?v=2.0.0" />
  <style>
    .k-stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    .ctrl { position: absolute; bottom: max(14px, env(safe-area-inset-bottom)); width: clamp(80px, 18vmin, 120px); height: clamp(80px, 18vmin, 120px); border-radius: 50%; background: rgba(255,255,255,0.85); box-shadow: 0 6px 0 rgba(0,0,0,0.2); font-size: clamp(38px, 9vmin, 60px); display: grid; place-items: center; z-index: 10; touch-action: none; }
    .ctrl.on { transform: translateY(4px) scale(0.95); background: #ffd166; }
    .ctrl.left { left: max(14px, env(safe-area-inset-left)); }
    .ctrl.right { left: calc(max(14px, env(safe-area-inset-left)) + clamp(94px, 21vmin, 140px)); }
    .ctrl.jump { right: max(14px, env(safe-area-inset-right)); width: clamp(100px, 22vmin, 150px); height: clamp(100px, 22vmin, 150px); background: rgba(255, 209, 102, 0.95); }
    .skin { position: absolute; top: 6px; right: max(10px, env(safe-area-inset-right)); width: var(--tap-min); height: var(--tap-min); border-radius: 50%; background: rgba(255,255,255,0.9); box-shadow: var(--sh-1); font-size: 34px; z-index: 10; }
  </style>
</head>
<body>
  <script src="../../js/common.js?v=2.0.0"></script>
  <script src="../../js/kit/levels.js?v=2.0.0"></script>
  <script src="../../js/kit/kit.js?v=2.0.0"></script>
  <script src="logic.js?v=2.0.0"></script>
  <script>
    const DL = DinoLogic;
    const SKINS = ["🦕", "🦖", "🐉"];
    const { GRAV, JUMP, SPEED } = DL.PHYS;

    function start(round) {
      const cfg = round.cfg, el = Kit.ui.el;
      const course = DL.buildCourse(round.level);
      const { platforms, apples, enemies, flag } = course;
      const meter = round.meter("🍎", course.appleCount);
      const canvas = document.createElement("canvas");
      round.stage.appendChild(canvas);
      const ctx = canvas.getContext("2d");
      let W = 300, H = 300, T = 30;
      const resize = () => { const dpr = devicePixelRatio || 1; W = round.stage.clientWidth; H = round.stage.clientHeight; canvas.width = W * dpr; canvas.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); T = H / 10; };
      resize();
      const ro = new ResizeObserver(resize); ro.observe(round.stage); round.onCleanup(() => ro.disconnect());

      let skin = localStorage.getItem("jeux.dino.skin");
      if (!SKINS.includes(skin)) skin = SKINS[0];
      const skinBtn = el("button", "skin", skin);
      skinBtn.setAttribute("aria-label", "Changer de dinosaure");
      skinBtn.onclick = () => { skin = SKINS[(SKINS.indexOf(skin) + 1) % SKINS.length]; skinBtn.textContent = skin; localStorage.setItem("jeux.dino.skin", skin); Jeux.sounds.click(); };
      round.stage.appendChild(skinBtn);

      const keys = { left: false, right: false, jump: false };
      let jumpBuffered = 0, coyote = 0, won = false, t = 0, got = 0, hurt = 0;
      const player = { x: 0, y: DL.GROUND_Y - 1, vx: 0, vy: 0, w: 0.9, h: 0.9, onGround: false, face: 1, squash: 0 };
      let safe = { x: 0, y: DL.GROUND_Y - 1 };
      const ctrls = {};
      for (const [k, sym, label] of [["left", "⬅️", "Gauche"], ["right", "➡️", "Droite"], ["jump", "⬆️", "Sauter"]]) {
        const b = el("button", "ctrl " + k, sym);
        b.setAttribute("aria-label", label);
        const on = (e) => { e.preventDefault(); keys[k] = true; b.classList.add("on"); if (k === "jump") jumpBuffered = 0.15; };
        const off = () => { keys[k] = false; b.classList.remove("on"); };
        b.addEventListener("pointerdown", on); b.addEventListener("pointerup", off); b.addEventListener("pointercancel", off); b.addEventListener("pointerleave", off);
        round.stage.appendChild(b); ctrls[k] = b;
      }
      const KEYMAP = { ArrowLeft: "left", ArrowRight: "right", ArrowUp: "jump", " ": "jump" };
      const kd = (e) => { const k = KEYMAP[e.key]; if (k) { keys[k] = true; if (k === "jump" && !e.repeat) jumpBuffered = 0.15; e.preventDefault(); } };
      const ku = (e) => { const k = KEYMAP[e.key]; if (k) keys[k] = false; };
      addEventListener("keydown", kd); addEventListener("keyup", ku);
      round.onCleanup(() => { removeEventListener("keydown", kd); removeEventListener("keyup", ku); });

      const overlaps = (a, p) => a.x < p.x + p.w && a.x + a.w > p.x && a.y < p.y + p.h && a.y + a.h > p.y;
      function update(dt) {
        if (won) return;
        const dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
        if (hurt <= 0.8) player.vx += (dir * SPEED - player.vx) * Math.min(1, dt * 12);
        if (dir) player.face = dir;
        jumpBuffered -= dt; coyote -= dt; hurt -= dt;
        if (player.onGround) coyote = 0.12;
        if (jumpBuffered > 0 && coyote > 0) { player.vy = -JUMP; jumpBuffered = 0; coyote = 0; Jeux.sounds.jump(); }
        if (!keys.jump && player.vy < -6) player.vy += GRAV * dt * 1.5;
        player.vy = Math.min(player.vy + GRAV * dt, 22);
        player.x += player.vx * dt;
        if (player.x < -5) player.x = -5;
        for (const p of platforms) {
          if (p.kind === "float" || !overlaps(player, p)) continue;
          if (player.vx > 0) player.x = p.x - player.w; else if (player.vx < 0) player.x = p.x + p.w;
          player.vx = 0;
        }
        const prevBottom = player.y + player.h;
        player.y += player.vy * dt;
        const was = player.onGround;
        player.onGround = false;
        for (const p of platforms) {
          if (!overlaps(player, p)) continue;
          if (player.vy > 0 && prevBottom <= p.y + 0.05) {
            player.y = p.y - player.h; player.vy = 0; player.onGround = true;
            if (p.kind === "ground") safe = { x: Math.max(p.x + 0.2, Math.min(player.x, p.x + p.w - 1.2)), y: p.y - 1 };
          } else if (p.kind !== "float" && player.vy < 0) { player.y = p.y + p.h; player.vy = 0; }
        }
        if (player.onGround && !was) player.squash = 1;
        player.squash = Math.max(0, player.squash - dt * 5);
        // tombé dans un trou → on revient juste avant, et ça compte pour les étoiles
        if (player.y > 11) {
          round.oops(); Jeux.sounds.wrong();
          round.say(["Oups !", "Plouf !", "On réessaie !"][Math.floor(Math.random() * 3)]);
          player.x = safe.x; player.y = safe.y - 1; player.vx = player.vy = 0;
        }
        // escargots
        for (const e of enemies) {
          if (!e.alive) continue;
          e.x += e.dir * e.speed * dt;
          if (e.x < e.min || e.x > e.max) e.dir *= -1;
          const box = { x: e.x - 0.45, y: e.y, w: 0.9, h: 0.8 };
          if (!overlaps(player, box)) continue;
          if (DL.stomps(player.vy, prevBottom, box.y)) {
            e.alive = false; player.vy = -10; Jeux.sounds.pop(); round.say("Dans ta coquille, l'escargot !");
          } else if (hurt <= 0) {
            hurt = 1.2; round.oops(); Jeux.sounds.bonk();
            player.vx = (player.x < e.x ? -1 : 1) * 7; player.vy = -7;
            round.say("Aïe ! Saute par-dessus l'escargot !");
          }
        }
        for (let i = apples.length - 1; i >= 0; i--) {
          const a = apples[i];
          if (Math.abs(a.x - (player.x + player.w / 2)) < 0.7 && Math.abs(a.y - (player.y + player.h / 2)) < 0.8) {
            apples.splice(i, 1); got++; meter.set(got); Jeux.sounds.coin();
          }
        }
        if (player.x + player.w > flag.x) {
          won = true; keys.right = false;
          Jeux.sounds.win();
          round.timeout(() => round.end({ text: `Tu es arrivé au château ! Et tu as ramassé ${got} pomme${got > 1 ? "s" : ""} !` }), 1200);
        }
      }
      function emoji(ch, x, y, size, flip = false, sx = 1, sy = 1) { ctx.save(); ctx.translate(x, y); ctx.scale(flip ? -sx : sx, sy); ctx.font = `${size}px serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(ch, 0, 0); ctx.restore(); }
      function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.fill(); }
      const clouds = Array.from({ length: 12 }, (_, i) => ({ x: i * 9 + Math.random() * 6, y: 0.5 + Math.random() * 3, s: 0.8 + Math.random() }));
      function draw() {
        const camX = player.x - (W / T) * 0.35;
        const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, "#6ec6ff"); g.addColorStop(1, "#d6f5ff");
        ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
        emoji("☀️", T * 1.6, T * 1.4, T * 1.3);
        ctx.fillStyle = "#a7e3a1";
        for (let i = -1; i < W / (T * 6) + 2; i++) { const base = Math.floor((camX * 0.3) / 6) + i, hx = base * 6 * T - camX * 0.3 * T; ctx.beginPath(); ctx.arc(hx, H * 0.85, T * 3.5, Math.PI, 0); ctx.fill(); }
        const span = W + T * 6;
        for (const c of clouds) emoji("☁️", (((((c.x - camX * 0.5) * T) % span) + span) % span) - T * 3, c.y * T, T * c.s * 1.2);
        ctx.save(); ctx.translate(-camX * T, 0);
        for (const p of platforms) {
          if ((p.x + p.w - camX) * T < 0 || (p.x - camX) * T > W) continue;
          if (p.kind === "ground") {
            ctx.fillStyle = "#9c6b3f"; ctx.fillRect(p.x * T, p.y * T, p.w * T, p.h * T);
            ctx.fillStyle = "#5cc85c"; ctx.fillRect(p.x * T, p.y * T, p.w * T, T * 0.35);
          } else { ctx.fillStyle = "#ffb703"; roundRect(p.x * T, p.y * T, p.w * T, p.h * T, T * 0.25); ctx.fillStyle = "#fb8500"; roundRect(p.x * T, (p.y + p.h * 0.6) * T, p.w * T, p.h * 0.4 * T, T * 0.2); }
        }
        for (const a of apples) emoji("🍎", a.x * T, (a.y + Math.sin(t * 3 + a.x) * 0.08) * T, T * 0.7);
        for (const e of enemies) emoji(e.alive ? "🐌" : "🐚", e.x * T, (e.y + 0.4) * T, T * 0.95, e.dir > 0);
        emoji("🏁", flag.x * T, flag.y * T, T * 1.6);
        emoji("🏰", (flag.x + 4) * T, (DL.GROUND_Y - 1.4) * T, T * 3);
        const sq = player.squash * 0.25, run = player.onGround && Math.abs(player.vx) > 0.5 ? Math.sin(t * 18) * 0.06 : 0;
        if (!(hurt > 0 && Math.floor(t * 12) % 2)) emoji(skin, (player.x + player.w / 2) * T, (player.y + player.h / 2 - 0.1 + run) * T, T * 1.25, player.face > 0, 1 + sq, 1 - sq);
        ctx.restore();
      }
      round.loop((dt) => { t += dt; update(dt); draw(); });

      // Pilote automatique (pour le robot de test) : court à droite, saute devant un trou, une marche ou un escargot
      const groundAt = (x) => platforms.find((p) => p.kind === "ground" && x >= p.x && x <= p.x + p.w);
      round.setHintTarget(() => ({
        auto() {
          keys.right = true; keys.left = false;
          const front = player.x + player.w, cur = groundAt(player.x + player.w / 2), ahead = groundAt(front + 0.5);
          const danger = !groundAt(front + 0.6) || (ahead && cur && ahead.y < cur.y) || enemies.some((e) => e.alive && e.x - front > -0.2 && e.x - front < 2.4 && Math.abs(e.y - player.y) < 1.5);
          if (player.onGround && danger) { jumpBuffered = 0.15; keys.jump = true; }
          else if (player.onGround) keys.jump = false;
        },
      }));
      round.timeout(() => round.say("Cours jusqu'au drapeau, et attrape les pommes !"), 2600);
    }

    Kit.game({
      id: "dino", title: "Le Dino", icon: "🦕", mode: "arcade",
      bg: "#6ec6ff",
      instruction: (cfg) => "Appuie sur les flèches pour courir, et sur la grosse flèche pour sauter !" + (cfg.enemies ? " Saute sur les escargots, ou par-dessus !" : cfg.gapChance ? " Attention aux trous !" : ""),
      levels: DL.LEVELS,
      start,
    });
  </script>
</body>
</html>
