<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>La Première Lettre</title>
  <link rel="stylesheet" href="../../css/common.css?v=2.0.0" />
  <link rel="stylesheet" href="../../css/tokens.css?v=2.0.0" />
  <link rel="stylesheet" href="../../css/kit.css?v=2.0.0" />
  <style>
    .word { display: flex; font-size: clamp(36px, 9vmin, 64px); font-weight: bold; letter-spacing: 3px; background: #fff; border-radius: var(--r-md); padding: 4px 18px; box-shadow: var(--sh-1); margin: -8px 0 var(--s-4); }
    .word .first { color: var(--c-primary); border-bottom: 5px solid var(--c-primary); min-width: 0.8em; text-align: center; }
    .word .first.found { color: var(--c-success); border-color: var(--c-success); animation: k-good var(--t-slow) var(--ease-bounce); }
  </style>
</head>
<body>
  <script src="../../js/common.js?v=2.0.0"></script>
  <script src="../../js/kit/levels.js?v=2.0.0"></script>
  <script src="../../js/kit/kit.js?v=2.0.0"></script>
  <script src="logic.js?v=2.0.0"></script>
  <script>
    const LL = LettreLogic;
    const NAMES = { A: "a", B: "bé", C: "cé", D: "dé", E: "e", F: "effe", G: "gé", H: "hache", I: "i", J: "ji", K: "ka", L: "elle", M: "emme", N: "enne", O: "o", P: "pé", Q: "ku", R: "erre", S: "esse", T: "té", U: "u", V: "vé", W: "double vé", X: "ixe", Y: "i grec", Z: "zède" };
    let last = null;
    Kit.game({
      id: "premiere-lettre", title: "La Première Lettre", icon: "🅰️",
      bg: "linear-gradient(160deg, #ffe8cc, #ffdeeb)",
      instruction: () => "Écoute le mot. Par quelle lettre commence-t-il ?",
      levels: LL.LEVELS,
      start(round) {
        const q = LL.generate(round.cfg.internal[0], Math.random, last);
        last = q.word;
        Kit.ui.prompt(round.stage, { visual: q.emoji, onTap: () => round.say(q.word) });
        const w = Kit.ui.el("div", "word");
        w.innerHTML = `<span class="first">_</span><span></span>`;
        w.lastChild.textContent = q.word.toUpperCase().slice(1);
        round.stage.appendChild(w);
        const buttons = Kit.ui.choices(round.stage, q.options, {
          onPick(l, b) {
            if (l === q.answer) {
              const f = w.querySelector(".first"); f.textContent = q.word.charAt(0).toUpperCase(); f.classList.add("found");
              round.win(b, `${q.word} commence par la lettre ${NAMES[q.answer]} !`, { delay: 2600 });
            } else round.miss(b, `Ça, c'est la lettre ${NAMES[l]}. Écoute bien : ${q.word}.`);
          },
        });
        round.setHintTarget(() => buttons[q.options.indexOf(q.answer)]);
        round.timeout(() => round.say(`${q.word}. Par quelle lettre commence ${q.word} ?`), round.index === 0 ? 2800 : 350);
      },
    });
  </script>
</body>
</html>
