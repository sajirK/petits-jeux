<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>La Tour des Nombres</title>
  <link rel="stylesheet" href="../../css/common.css?v=2.0.0-dev" />
  <link rel="stylesheet" href="../../css/tokens.css?v=2.0.0-dev" />
  <link rel="stylesheet" href="../../css/kit.css?v=2.0.0-dev" />
  <style>
    .layout { display: flex; align-items: flex-end; justify-content: center; gap: clamp(16px, 5vmin, 56px); width: 100%; flex: 1; min-height: 0; }
    @media (orientation: portrait) { .layout { flex-direction: column; align-items: center; justify-content: space-between; } }
    .goal { display: flex; flex-direction: column; align-items: center; background: #fff; border-radius: var(--r-lg); padding: 10px 22px; box-shadow: var(--sh-2); cursor: pointer; align-self: center; }
    .goal b { font-size: clamp(54px, 13vmin, 104px); line-height: 1; }
    .dots { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; max-width: 200px; margin-top: 6px; }
    .dot { width: 18px; height: 18px; border-radius: 50%; background: #3b2a4d; opacity: 0.18; transition: all var(--t-med); }
    .dot.on { opacity: 1; background: #ef476f; transform: scale(1.15); }
    .towerZone { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; min-width: calc(var(--b) * 2.6); min-height: calc(var(--b) * 3); padding: 8px; border-radius: var(--r-lg); transition: background var(--t-med); }
    .towerZone.k-zone-hot { background: rgba(81, 207, 102, 0.15); }
    .tower { display: flex; flex-direction: column-reverse; align-items: center; }
    .base { width: calc(var(--b) * 2.2); height: 14px; border-radius: 8px; background: #8d5524; box-shadow: 0 4px 0 rgba(0,0,0,0.15); }
    .block { width: var(--b); height: var(--b); border-radius: 12px; position: relative; display: grid; place-items: center; font-size: calc(var(--b) * 0.5); box-shadow: inset -5px -6px 0 rgba(0,0,0,0.18), inset 4px 4px 0 rgba(255,255,255,0.35); }
    .tower .block { animation: drop 0.28s var(--ease-bounce); cursor: pointer; }
    .tower .block.fixed { cursor: default; }
    .tower .block.fixed::after { content: "🔒"; position: absolute; right: -6px; top: -8px; font-size: calc(var(--b) * 0.3); }
    @keyframes drop { from { transform: translateY(-50px); } }
    .tower.wobble { animation: wobble 0.45s ease-in-out 3; }
    @keyframes wobble { 25% { transform: rotate(-4deg); } 75% { transform: rotate(4deg); } }
    .pile { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; background: rgba(255,255,255,0.6); border-radius: var(--r-lg); padding: 14px; max-width: 320px; align-self: center; }
    .pile .block { cursor: grab; width: clamp(64px, 13vmin, 84px); height: clamp(64px, 13vmin, 84px); }
  </style>
</head>
<body>
  <script src="../../js/common.js?v=2.0.0-dev"></script>
  <script src="../../js/kit/levels.js?v=2.0.0-dev"></script>
  <script src="../../js/kit/kit.js?v=2.0.0-dev"></script>
  <script src="logic.js?v=2.0.0-dev"></script>
  <script>
    const TL = ToursLogic;
    const COLORS = ["#ef476f", "#ff9f1c", "#ffd166", "#06d6a0", "#118ab2", "#7b2cbf", "#f15bb5", "#00bbf9"];
    let last = null;
    Kit.game({
      id: "tours", title: "La Tour des Nombres", icon: "🧱",
      bg: "linear-gradient(180deg, #bde0fe 0%, #e0f2ff 70%, #c7f0bd 70%)",
      instruction: (cfg) => cfg.add ? "Une partie de la tour est déjà construite. Ajoute des blocs pour faire le calcul !" : "Glisse des blocs sur la tour pour faire le bon nombre !",
      levels: TL.LEVELS,
      start(round) {
        const q = TL.question(round.level, Math.random, last);
        last = q.target;
        const stage = round.stage;
        const layout = Kit.ui.el("div", "layout");
        // l'objectif : le chiffre + des points (pour ceux qui ne connaissent pas encore les chiffres)
        const goal = Kit.ui.el("button", "goal");
        goal.innerHTML = `<b>${q.fixed ? `${q.fixed} + ${q.toAdd}` : q.target}</b><div class="dots"></div>`;
        const dots = goal.querySelector(".dots");
        for (let i = 0; i < q.target; i++) dots.appendChild(Kit.ui.el("span", "dot"));
        goal.onclick = () => round.say(TL.say(q));
        const zone = Kit.ui.el("div", "towerZone");
        const tower = Kit.ui.el("div", "tower");
        zone.append(tower, Kit.ui.el("div", "base"));
        const pile = Kit.ui.el("div", "pile");
        layout.append(goal, zone, pile);
        stage.appendChild(layout);
        // taille des blocs : 10 blocs doivent tenir en hauteur
        const fit = () => { const h = stage.getBoundingClientRect().height; stage.style.setProperty("--b", Math.round(Math.max(26, Math.min(64, (h - 60) / 11))) + "px"); };
        fit(); window.addEventListener("resize", fit); round.onCleanup(() => window.removeEventListener("resize", fit));

        const fixedColor = COLORS[0];
        for (let i = 0; i < q.fixed; i++) tower.appendChild(block(fixedColor, true));
        const count = () => tower.children.length;
        const update = () => [...dots.children].forEach((d, i) => d.classList.toggle("on", i < count()));
        update();

        function block(color, fixed = false) {
          const b = Kit.ui.el("div", "block" + (fixed ? " fixed" : ""));
          b.style.background = color;
          if (!fixed) b.onclick = () => { if (b === tower.lastElementChild) { b.remove(); Jeux.sounds.pop(); update(); if (count()) round.say(TL.NUMBERS[count()]); } };
          return b;
        }
        function add(color) {
          if (count() >= 10) { round.say("La tour est trop haute !"); return; }
          tower.appendChild(block(color));
          Jeux.sounds.step(count() - 1);
          round.say(TL.NUMBERS[count()]);
          update();
          if (count() === q.target) { tower.classList.add("wobble"); round.win(tower, TL.done(q), { praise: false, delay: 2600 }); }
          else if (count() > q.target) round.miss(tower, `Oups, trop haut ! Il en faut ${TL.NUMBERS[q.target]}. Touche le bloc du haut pour l'enlever.`);
        }
        const pileColors = q.fixed ? [COLORS[3], COLORS[3], COLORS[3], COLORS[3]] : COLORS.slice(1, 7);
        pileColors.forEach((c) => {
          const b = block(c);
          b.onclick = null;
          pile.appendChild(b);
          Kit.drag(b, {
            ghost: () => { const g = Kit.ui.el("div", "block"); g.style.background = c; g.style.width = g.style.height = "var(--b)"; return g; },
            onMove: (pt) => zone.classList.toggle("k-zone-hot", Kit.over(zone, pt, 30)),
            onDrop: (pt) => { zone.classList.remove("k-zone-hot"); if (!Kit.over(zone, pt, 30)) return false; add(c); return true; },
            onTap: () => add(c),
          });
        });
        round.setHintTarget(() => (count() > q.target ? tower.lastElementChild : pile.firstElementChild));
        round.timeout(() => round.say(TL.say(q)), round.index === 0 ? 3000 : 350);
      },
    });
  </script>
</body>
</html>
