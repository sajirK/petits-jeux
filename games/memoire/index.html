<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Memory des animaux</title>
  <link rel="stylesheet" href="../../css/common.css?v=2.0.0" />
  <link rel="stylesheet" href="../../css/tokens.css?v=2.0.0" />
  <link rel="stylesheet" href="../../css/kit.css?v=2.0.0" />
  <style>
    .board { display: grid; gap: clamp(8px, 2vmin, 14px); perspective: 900px; }
    .card { aspect-ratio: 1; position: relative; transform-style: preserve-3d; transition: transform 0.4s var(--ease-out); cursor: pointer; }
    .card.flipped, .card.found { transform: rotateY(180deg); }
    .face { position: absolute; inset: 0; border-radius: var(--r-md); backface-visibility: hidden; -webkit-backface-visibility: hidden; display: grid; place-items: center; box-shadow: var(--sh-1); }
    .back { background: repeating-linear-gradient(45deg, #52b788 0 14px, #74c69d 14px 28px); font-size: clamp(28px, 6vmin, 48px); color: #fff; }
    .front { background: #fff; transform: rotateY(180deg); font-size: clamp(36px, 9vmin, 72px); }
    .card.found .front { background: #fff3b0; }
  </style>
</head>
<body>
  <script src="../../js/common.js?v=2.0.0"></script>
  <script src="../../js/kit/levels.js?v=2.0.0"></script>
  <script src="../../js/kit/kit.js?v=2.0.0"></script>
  <script src="logic.js?v=2.0.0"></script>
  <script>
    const ML = MemoireLogic;
    Kit.game({
      id: "memoire", title: "Memory des animaux", icon: "🐶",
      bg: "linear-gradient(160deg, #d8f3dc, #b5e48c)",
      instruction: () => "Retourne les cartes et trouve les paires d'animaux !",
      levels: ML.LEVELS,
      start(round) {
        const cfg = round.cfg;
        const cards = ML.deck(round.level);
        const board = Kit.ui.el("div", "board");
        const rows = Math.ceil(cards.length / cfg.cols);
        board.style.gridTemplateColumns = `repeat(${cfg.cols}, 1fr)`;
        const fit = () => { const r = round.stage.getBoundingClientRect(); board.style.width = Math.min(r.width - 20, 720, ((r.height - 20) * cfg.cols) / rows) + "px"; };
        round.stage.appendChild(board);
        fit(); window.addEventListener("resize", fit); round.onCleanup(() => window.removeEventListener("resize", fit));
        const seen = new Set();
        let first = null, lock = false, found = 0;
        const els = cards.map((c) => {
          const el = Kit.ui.el("div", "card");
          el.innerHTML = `<div class="face back">?</div><div class="face front">${c.e}</div>`;
          el.onclick = () => {
            if (lock || el.classList.contains("flipped") || el.classList.contains("found")) return;
            Jeux.sounds.click();
            el.classList.add("flipped");
            round.say(c.name);
            if (!first) { first = c; return; }
            const a = first; first = null;
            lock = true;
            if (a.e === c.e) {
              round.timeout(() => {
                els[a.id].classList.add("found"); el.classList.add("found");
                Jeux.sounds.success(); round.burst(el, { count: 14 });
                found++; lock = false;
                if (found === cfg.pairs) round.win(null, "Tu as trouvé toutes les paires !", { delay: 1600 });
              }, 450);
            } else {
              if (ML.isMemoryMistake(cards, seen, a, c)) round.oops(); // on avait déjà vu la bonne carte
              round.timeout(() => { els[a.id].classList.remove("flipped"); el.classList.remove("flipped"); lock = false; }, 1100);
            }
            seen.add(a.id); seen.add(c.id);
          };
          board.appendChild(el);
          return el;
        });
        // aide : la prochaine carte utile (la paire d'une carte déjà vue, sinon une carte jamais vue)
        round.setHintTarget(() => {
          const open = first;
          const hidden = cards.filter((c) => !els[c.id].classList.contains("found") && !els[c.id].classList.contains("flipped"));
          if (open) { const p = hidden.find((c) => c.e === open.e); return p ? els[p.id] : null; }
          const known = hidden.find((c) => seen.has(c.id) && hidden.some((d) => d.id !== c.id && d.e === c.e && seen.has(d.id)));
          return els[(known || hidden.find((c) => !seen.has(c.id)) || hidden[0] || {}).id];
        });
        if (round.index > 0) round.say("Encore une partie ! Trouve les paires !");
      },
    });
  </script>
</body>
</html>
