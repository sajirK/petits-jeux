<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Les Couleurs</title>
  <link rel="stylesheet" href="../../css/common.css?v=2.0.0" />
  <link rel="stylesheet" href="../../css/tokens.css?v=2.0.0" />
  <link rel="stylesheet" href="../../css/kit.css?v=2.0.0" />
  <style>
    /* la couleur à trouver : une grosse tache de peinture (pas besoin de lire) */
    .target {
      display: flex; align-items: center; gap: var(--s-3);
      background: var(--c-paper); border-radius: var(--r-pill); padding: 8px 22px 8px 10px;
      box-shadow: var(--sh-2); margin-bottom: var(--s-4); cursor: pointer;
      animation: k-in var(--t-slow) var(--ease-bounce);
    }
    .splash {
      width: clamp(58px, 13vmin, 84px); aspect-ratio: 1;
      border-radius: 46% 54% 42% 58% / 52% 44% 56% 48%;
      background: var(--c); box-shadow: inset -6px -8px 0 rgba(0,0,0,0.15), 0 0 0 3px rgba(0,0,0,0.06);
      animation: blob 2.4s ease-in-out infinite;
    }
    @keyframes blob { 50% { border-radius: 56% 44% 52% 48% / 44% 56% 44% 56%; transform: rotate(8deg); } }
    .target .ear { font-size: 30px; }
    .target .word { font-size: var(--fs-lg); font-weight: bold; color: var(--c-ink-soft); }

    .sky { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: clamp(14px, 4vmin, 40px); max-width: 900px; }
    .balloon {
      width: var(--bw); aspect-ratio: 0.82; position: relative;
      border-radius: 50% 50% 47% 47% / 56% 56% 44% 44%;
      background: radial-gradient(circle at 32% 28%, rgba(255,255,255,0.65) 0 9%, transparent 10%), var(--c);
      box-shadow: inset -12px -16px 0 rgba(0,0,0,0.14), var(--sh-1);
      animation: float var(--float, 3s) ease-in-out infinite, k-in var(--t-slow) var(--ease-bounce) both;
      animation-delay: var(--d, 0s), var(--d2, 0s);
    }
    .balloon::after { content: ""; position: absolute; left: 50%; bottom: -46px; width: 2px; height: 46px; background: rgba(47,37,69,0.35); }
    .balloon::before { content: ""; position: absolute; left: 50%; bottom: -8px; transform: translateX(-50%); border: 8px solid transparent; border-top: 10px solid var(--c); }
    .balloon.white { box-shadow: inset -12px -16px 0 rgba(0,0,0,0.08), 0 0 0 3px #dee2e6, var(--sh-1); }
    @keyframes float { 0%, 100% { translate: 0 0; } 50% { translate: 0 -16px; } }
    .balloon.popped { animation: pop 260ms ease-out forwards; }
    @keyframes pop { 60% { transform: scale(1.35); opacity: 0.6; } 100% { transform: scale(0.2); opacity: 0; } }
    /* Difficile : les ballons se promènent doucement */
    .sky.drift .balloon { animation: drift var(--float, 6s) ease-in-out infinite alternate, k-in var(--t-slow) var(--ease-bounce) both; }
    @keyframes drift { from { translate: -26px 10px; } to { translate: 26px -14px; } }
  </style>
</head>
<body>
  <script src="../../js/common.js?v=2.0.0"></script>
  <script src="../../js/kit/levels.js?v=2.0.0"></script>
  <script src="../../js/kit/kit.js?v=2.0.0"></script>
  <script src="logic.js?v=2.0.0"></script>
  <script>
    const { COLORS, le } = CouleursLogic;
    const SIZES = { 1: "clamp(110px, 26vmin, 190px)", 2: "clamp(96px, 22vmin, 160px)", 3: "clamp(80px, 18vmin, 130px)" };
    let lastGoal = null;

    Kit.game({
      id: "couleurs",
      title: "Les Couleurs",
      icon: "🌈",
      bg: "linear-gradient(180deg, #d0ebff 0%, #fff0f6 100%)",
      instruction: () => "Écoute bien, et touche le ballon de la bonne couleur !",
      levels: CouleursLogic.LEVELS,
      start(round) {
        const { cfg, stage } = round;
        const { set, goal } = CouleursLogic.question(round.level, Math.random, lastGoal);
        lastGoal = goal;

        // la consigne : une tache de la couleur + la voix (le mot est écrit en petit pour les parents)
        const target = document.createElement("button");
        target.className = "target";
        target.setAttribute("aria-label", `Réécouter : ${le(goal)}`);
        target.innerHTML = `<span class="splash" style="--c:${COLORS[goal]}"></span><span class="ear">👂</span><span class="word">${goal}</span>`;
        target.onclick = () => round.say(`Touche ${le(goal)} !`);
        stage.appendChild(target);

        const sky = document.createElement("div");
        sky.className = "sky" + (cfg.drift ? " drift" : "");
        sky.style.setProperty("--bw", SIZES[round.level]);
        let goalEl = null;
        set.forEach((name, i) => {
          const b = document.createElement("button");
          b.className = "balloon" + (name === "blanc" ? " white" : "");
          b.style.setProperty("--c", COLORS[name]);
          b.style.setProperty("--d", `${i * 0.35}s`);
          b.style.setProperty("--d2", `${i * 0.07}s`);
          b.style.setProperty("--float", `${2.6 + (i % 3) * 0.5 + (cfg.drift ? 3 : 0)}s`);
          b.setAttribute("aria-label", `Ballon ${name}`);
          if (name === goal) goalEl = b;
          b.onclick = () => {
            if (name === goal) {
              b.classList.add("popped");
              Jeux.sounds.pop();
              round.burst(b, { colors: [COLORS[name], "#ffffff", "#ffd43b"], count: 34 });
              round.win(null, `C'est ${le(name)} !`);
            } else {
              round.miss(b, `Ça, c'est ${le(name)}. Cherche ${le(goal)} !`);
            }
          };
          sky.appendChild(b);
        });
        stage.appendChild(sky);
        // si l'enfant hésite longtemps (ou se trompe 2 fois), la main montre le bon ballon
        round.setHintTarget(() => goalEl);
        setTimeout(() => round.say(`Touche ${le(goal)} !`), round.index === 0 ? 2600 : 350);
      },
    });
  </script>
</body>
</html>
