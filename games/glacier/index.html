<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Le Glacier</title>
  <link rel="stylesheet" href="../../css/common.css?v=2.0.0-dev" />
  <link rel="stylesheet" href="../../css/tokens.css?v=2.0.0-dev" />
  <link rel="stylesheet" href="../../css/kit.css?v=2.0.0-dev" />
  <style>
    .shop { flex: 1; min-height: 0; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 8px; }
    @media (orientation: landscape) { .shop { flex-direction: row; justify-content: center; } }
    .client { display: flex; align-items: center; gap: 10px; }
    @media (orientation: landscape) { .client { flex-direction: column; max-width: 28vw; } }
    .face { font-size: clamp(50px, 12vmin, 86px); line-height: 1; }
    .face.eat { animation: lick 0.3s ease-in-out 6; }
    @keyframes lick { 50% { transform: translateY(-6px) rotate(6deg); } }
    .bubble { background: #fff; border-radius: var(--r-md); padding: 8px 10px; box-shadow: var(--sh-1); display: flex; flex-wrap: wrap; gap: 6px; cursor: pointer; max-width: 70vw; }
    .chip { display: flex; align-items: center; gap: 4px; background: #fff0f6; border-radius: 14px; padding: 3px 8px; font-size: clamp(16px, 3.8vmin, 24px); border: 3px solid transparent; }
    .chip.ok { border-color: var(--c-success); background: var(--c-success-soft); }
    .ball { width: 1.1em; height: 1.1em; border-radius: 50%; display: inline-block; border: 1px solid rgba(0,0,0,0.1); }
    .stackZone { flex: 1; min-height: 0; align-self: stretch; display: flex; align-items: flex-end; justify-content: center; border-radius: var(--r-lg); transition: background var(--t-med); }
    .stackZone.k-zone-hot { background: rgba(81, 207, 102, 0.15); }
    .stack { display: flex; flex-direction: column-reverse; align-items: center; transform-origin: 50% 100%; transition: transform 0.4s, opacity 0.4s; }
    .stack.wobble { animation: wob 2.2s ease-in-out infinite; }
    @keyframes wob { 0%, 100% { transform: rotate(-2.5deg); } 50% { transform: rotate(2.5deg); } }
    .scoop { width: var(--s); height: var(--s); margin-bottom: calc(var(--s) * -0.28); border-radius: 50% 50% 46% 46%; position: relative; box-shadow: inset calc(var(--s) * -0.1) calc(var(--s) * -0.1) 0 rgba(0,0,0,0.1), inset calc(var(--s) * 0.06) calc(var(--s) * 0.06) 0 rgba(255,255,255,0.45); animation: drop 0.45s cubic-bezier(.3,1.6,.6,1); cursor: pointer; }
    @keyframes drop { from { transform: translateY(-40vh); } }
    .scoop i { position: absolute; width: 8%; height: 8%; border-radius: 30%; background: #4a2511; }
    .sauce { position: absolute; left: -2%; right: -2%; top: -2%; height: 75%; pointer-events: none; }
    .deco { position: absolute; left: 50%; top: calc(var(--s) * -0.32); font-size: calc(var(--s) * 0.5); line-height: 1; transform: translateX(-50%); pointer-events: none; animation: k-in 0.35s var(--ease-bounce); }
    .sprinkles { position: absolute; inset: 0; pointer-events: none; }
    .sprinkles i { position: absolute; width: 9%; height: 3%; border-radius: 3px; }
    .side { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .choices { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; max-width: 520px; }
    .opt { min-width: clamp(64px, 13vmin, 88px); height: clamp(64px, 13vmin, 88px); border-radius: 18px; background: #fff; box-shadow: var(--sh-2); font-size: clamp(30px, 6.5vmin, 44px); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 6px; }
    .opt small { font-size: 11px; }
    .opt.sel { background: #ffe5ec; outline: 4px solid #ff4d8d; }
    .tub { width: 0.95em; height: 0.8em; border-radius: 0 0 0.25em 0.25em; background: #e9ecef; position: relative; margin-top: 0.15em; }
    .tub::before { content: ""; position: absolute; left: -6%; right: -6%; top: -32%; height: 60%; border-radius: 50%; background: var(--c); }
    .steps { display: flex; gap: 6px; }
    .steps i { width: 14px; height: 14px; border-radius: 50%; background: rgba(0,0,0,0.15); }
    .steps i.on { background: #ff4d8d; }
    .nav { display: flex; gap: 8px; }
  </style>
</head>
<body>
  <script src="../../js/common.js?v=2.0.0-dev"></script>
  <script src="../../js/kit/levels.js?v=2.0.0-dev"></script>
  <script src="../../js/kit/kit.js?v=2.0.0-dev"></script>
  <script src="logic.js?v=2.0.0-dev"></script>
  <script>
    const GL = GlacierLogic;
    const STEPS = ["holder", "scoops", "sauce", "decos"];
    const STEP_SAY = { holder: "Un cornet ou un pot ?", scoops: "Glisse les boules de glace !", sauce: "Un peu de nappage ?", decos: "Et la décoration !" };

    function start(round) {
      const el = Kit.ui.el, lv = round.level;
      const o = GL.order(lv);
      const client = GL.CLIENTS[Math.floor(Math.random() * GL.CLIENTS.length)];
      const ice = { holder: null, scoops: [], sauce: null, decos: [] };
      let step = 0, served = false;
      const shop = el("div", "shop");
      const cl = el("div", "client");
      const face = el("div", "face", client);
      const bubble = el("button", "bubble");
      bubble.onclick = () => round.say(GL.sentence(o, Jeux.NAME));
      cl.append(face, bubble);
      const zone = el("div", "stackZone");
      const stack = el("div", "stack");
      const holder = el("div", "holderEl");
      stack.appendChild(holder); zone.appendChild(stack);
      const side = el("div", "side");
      const dots = el("div", "steps");
      const choices = el("div", "choices");
      const nav = el("div", "nav");
      side.append(dots, choices, nav);
      shop.append(cl, zone, side);
      round.stage.appendChild(shop);
      const fit = () => { const r = zone.getBoundingClientRect(); round.stage.style.setProperty("--s", Math.max(44, Math.min(110, r.width / 2.2, r.height / 5.5)) + "px"); drawHolder(); };

      function drawHolder() {
        const s = parseFloat(getComputedStyle(round.stage).getPropertyValue("--s")) || 80;
        if (!ice.holder) { holder.innerHTML = `<svg width="${s * 1.5}" height="${s * 0.3}" viewBox="0 0 160 30"><ellipse cx="80" cy="15" rx="78" ry="12" fill="#fff" stroke="#e5e5e5" stroke-width="3"/></svg>`; return; }
        if (ice.holder === "cornet") {
          let lines = ""; for (let i = -6; i <= 12; i++) lines += `<line x1="${i * 14}" y1="0" x2="${i * 14 + 120}" y2="160" stroke="#c98b4a" stroke-width="3"/><line x1="${i * 14 + 120}" y1="0" x2="${i * 14}" y2="160" stroke="#c98b4a" stroke-width="3"/>`;
          holder.innerHTML = `<svg width="${s * 0.95}" height="${s * 1.55}" viewBox="0 0 100 160"><defs><clipPath id="cone"><polygon points="2,4 98,4 50,158"/></clipPath></defs><polygon points="2,4 98,4 50,158" fill="#f2c27b" stroke="#c98b4a" stroke-width="4" stroke-linejoin="round"/><g clip-path="url(#cone)">${lines}</g><rect x="-2" y="0" width="104" height="14" rx="7" fill="#e9a95b"/></svg>`;
        } else {
          holder.innerHTML = `<svg width="${s * 1.25}" height="${s * 0.85}" viewBox="0 0 125 85"><polygon points="4,4 121,4 105,82 20,82" fill="#fff" stroke="#ffafcc" stroke-width="4" stroke-linejoin="round"/><polygon points="30,4 45,4 40,82 30,82" fill="#ff8fab" opacity="0.6"/><polygon points="62,4 77,4 75,82 64,82" fill="#ff8fab" opacity="0.6"/><polygon points="94,4 109,4 98,82 88,82" fill="#ff8fab" opacity="0.6"/><rect x="0" y="0" width="125" height="12" rx="6" fill="#ff8fab"/></svg>`;
        }
      }
      const topScoop = () => (stack.children.length > 1 ? stack.lastElementChild : null);
      function drawTop() {
        stack.querySelectorAll(".sauce, .deco, .sprinkles").forEach((x) => x.remove());
        const top = topScoop();
        if (!top) return;
        if (ice.sauce) {
          let d = "M 4 38 Q 50 -8 96 38 ";
          for (const [x, y] of [[88, 62], [74, 50], [60, 70], [44, 48], [28, 66], [14, 52]]) d += `L ${x + 5} 44 Q ${x + 4} ${y + 6} ${x} ${y + 6} Q ${x - 4} ${y + 6} ${x - 4} 44 `;
          const s = document.createElementNS("http://www.w3.org/2000/svg", "svg"); s.setAttribute("viewBox", "0 0 100 80"); s.setAttribute("class", "sauce");
          s.innerHTML = `<path d="${d}Z" fill="${GL.SAUCES[ice.sauce].c}"/>`; top.appendChild(s);
        }
        if (ice.decos.includes("🌈")) {
          const sp = el("div", "sprinkles"); const cols = ["#ef476f", "#ffd166", "#06d6a0", "#118ab2", "#f15bb5", "#fff"];
          for (let i = 0; i < 14; i++) { const x = el("i"); x.style.left = 10 + Math.random() * 75 + "%"; x.style.top = 5 + Math.random() * 50 + "%"; x.style.background = cols[i % 6]; x.style.transform = `rotate(${Math.random() * 180}deg)`; sp.appendChild(x); }
          top.appendChild(sp);
        }
        ice.decos.filter((e) => e !== "🌈").forEach((e, i, arr) => { const d = el("div", "deco", e); d.style.transform = `translateX(calc(-50% + ${(i - (arr.length - 1) / 2) * 34}%))`; top.appendChild(d); });
      }
      function addScoop(f) {
        if (ice.scoops.length >= 4) { round.say("Attention, ça va tomber !"); return; }
        ice.scoops.push(f);
        const sc = el("div", "scoop");
        sc.style.background = GL.FLAVORS[f].c;
        if (GL.FLAVORS[f].chips) for (let i = 0; i < 8; i++) { const c = el("i"); c.style.left = 12 + Math.random() * 70 + "%"; c.style.top = 12 + Math.random() * 60 + "%"; sc.appendChild(c); }
        sc.onclick = () => { if (served || step !== 1 || sc !== stack.lastElementChild) return; ice.scoops.pop(); sc.remove(); Jeux.sounds.pop(); afterChange(); };
        stack.appendChild(sc);
        round.timeout(() => Jeux.sounds.slide(500, 200, 0.12, 0.3), 280);
        round.say(GL.FLAVORS[f].name);
        afterChange();
      }
      function afterChange() { stack.classList.toggle("wobble", ice.scoops.length >= 3); drawTop(); updateBubble(); }
      function updateBubble() {
        let h = `<span class="chip ${ice.holder === o.holder ? "ok" : ""}">${o.holder === "cornet" ? "🍦" : "🥣"}</span>`;
        const want = GL.countBy(o.scoops), have = GL.countBy(ice.scoops);
        for (const [f, n] of Object.entries(want)) h += `<span class="chip ${have[f] === n ? "ok" : ""}"><span class="ball" style="background:${GL.FLAVORS[f].c}"></span>${have[f] || 0}/${n}</span>`;
        if (o.sauce) h += `<span class="chip ${ice.sauce === o.sauce ? "ok" : ""}"><span class="ball" style="background:${GL.SAUCES[o.sauce].c}"></span>💧</span>`;
        for (const d of o.decos) h += `<span class="chip ${ice.decos.includes(d) ? "ok" : ""}">${d}</span>`;
        bubble.innerHTML = h;
      }
      function opt(html, onClick, sel = false) { const b = el("button", "opt" + (sel ? " sel" : "")); b.innerHTML = html; b.onclick = () => onClick(b); choices.appendChild(b); return b; }
      let optEls = {}, nextBtn = null;
      function showStep(n) {
        step = n;
        dots.innerHTML = STEPS.map((_, i) => `<i class="${i <= n ? "on" : ""}"></i>`).join("");
        choices.innerHTML = ""; nav.innerHTML = ""; optEls = {}; nextBtn = null;
        const name = STEPS[n];
        if (n > 0) { const back = el("button", "k-btn", "⬅️"); back.setAttribute("aria-label", "Retour"); back.onclick = () => { Jeux.sounds.click(); showStep(n - 1); }; nav.appendChild(back); }
        if (name === "holder") {
          for (const [id, e] of [["cornet", "🍦"], ["pot", "🥣"]]) optEls[id] = opt(`${e}<small>${id}</small>`, () => { ice.holder = id; drawHolder(); Jeux.sounds.success(); updateBubble(); round.timeout(() => showStep(1), 400); }, ice.holder === id);
        } else if (name === "scoops") {
          o.tubs.forEach((f) => {
            const b = opt(`<span class="tub" style="--c:${GL.FLAVORS[f].c}"></span><small>${f}</small>`, () => {});
            b.onclick = null;
            Kit.drag(b, { ghost: () => { const g = el("div", "scoop"); g.style.background = GL.FLAVORS[f].c; g.style.animation = "none"; return g; },
              onMove: (pt) => zone.classList.toggle("k-zone-hot", Kit.over(zone, pt)),
              onDrop: (pt) => { zone.classList.remove("k-zone-hot"); if (!Kit.over(zone, pt)) return false; addScoop(f); return true; },
              onTap: () => addScoop(f) });
            optEls[f] = b;
          });
          nextBtn = el("button", "k-btn primary", "➡️"); nextBtn.setAttribute("aria-label", "Suivant");
          nextBtn.onclick = () => { if (!ice.scoops.length) { round.say("Il faut au moins une boule !"); return; } Jeux.sounds.click(); showStep(2); };
          nav.appendChild(nextBtn);
        } else if (name === "sauce") {
          optEls.none = opt(`🚫<small>sans</small>`, (b) => pickSauce(null, b), !ice.sauce);
          for (const [id, s] of Object.entries(GL.SAUCES)) optEls[id] = opt(`<span class="ball" style="background:${s.c}"></span><small>${id}</small>`, (b) => pickSauce(id, b), ice.sauce === id);
          nextBtn = el("button", "k-btn primary", "➡️"); nextBtn.setAttribute("aria-label", "Suivant");
          nextBtn.onclick = () => { Jeux.sounds.click(); showStep(3); };
          nav.appendChild(nextBtn);
        } else {
          for (const e of Object.keys(GL.DECOS)) optEls[e] = opt(e, (b) => { const i = ice.decos.indexOf(e); if (i >= 0) { ice.decos.splice(i, 1); b.classList.remove("sel"); Jeux.sounds.pop(); } else { ice.decos.push(e); b.classList.add("sel"); Jeux.sounds.coin(); } drawTop(); updateBubble(); }, ice.decos.includes(e));
          nextBtn = el("button", "k-btn primary", "🍽️"); nextBtn.setAttribute("aria-label", "Servir");
          nextBtn.onclick = serve;
          nav.appendChild(nextBtn);
        }
        if (round.index + n > 0) round.say(STEP_SAY[name]);
      }
      function pickSauce(id, b) { ice.sauce = id; [...choices.children].forEach((x) => x.classList.remove("sel")); b.classList.add("sel"); Jeux.sounds.noise(0.35, { from: 500, to: 300, q: 2, volume: 0.15 }); drawTop(); updateBubble(); }
      function serve() {
        if (served) return;
        served = true;
        const { perfect, notes } = GL.judge(o, ice);
        face.classList.add("eat");
        let lick = 0;
        const t = round.interval(() => { lick++; Jeux.sounds.yum(); stack.style.transform = `scale(${1 - lick * 0.2})`; if (lick >= 4) { clearInterval(t); stack.style.opacity = 0; face.classList.remove("eat");
          if (perfect) { face.textContent = client + "😋"; round.win(face, "Elle est parfaite ! Miam ! Merci !", { praise: false, delay: 3200 }); }
          else { face.textContent = client + "🙂"; round.oops(); round.win(face, `Merci, c'était bon ! Mais ${notes[0]}.`, { praise: false, delay: 4200 }); } } }, 420);
      }
      // aide : ce qu'il faut faire maintenant
      round.setHintTarget(() => {
        const name = STEPS[step];
        if (name === "holder") return optEls[o.holder];
        if (name === "scoops") {
          const want = GL.countBy(o.scoops), have = GL.countBy(ice.scoops);
          const extra = ice.scoops.find((f) => (have[f] || 0) > (want[f] || 0));
          if (extra && ice.scoops[ice.scoops.length - 1] === extra) return stack.lastElementChild;
          if (extra) return stack.lastElementChild;
          const miss = Object.keys(want).find((f) => (have[f] || 0) < want[f]);
          return miss ? { from: optEls[miss], to: zone } : nextBtn;
        }
        if (name === "sauce") return ice.sauce !== o.sauce ? optEls[o.sauce || "none"] : nextBtn;
        const missing = o.decos.find((d) => !ice.decos.includes(d)), extraD = ice.decos.find((d) => !o.decos.includes(d));
        return missing ? optEls[missing] : extraD ? optEls[extraD] : nextBtn;
      });
      fit();
      const ro = new ResizeObserver(fit); ro.observe(zone); round.onCleanup(() => ro.disconnect());
      updateBubble();
      showStep(0);
      round.timeout(() => round.say(GL.sentence(o, Jeux.NAME)), round.index === 0 ? 3600 : 600);
    }

    Kit.game({
      id: "glacier", title: "Le Glacier", icon: "🍦",
      bg: "linear-gradient(180deg, #d0f4ff 0 64%, #ffc8dd 64% 66%, #ffafcc 66%)",
      instruction: () => "Écoute la commande du client, et prépare sa glace !",
      levels: GL.LEVELS,
      start,
    });
  </script>
</body>
</html>
