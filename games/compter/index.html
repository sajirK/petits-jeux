<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Je compte</title>
  <link rel="stylesheet" href="../../css/common.css?v=2.0.0-dev" />
  <link rel="stylesheet" href="../../css/tokens.css?v=2.0.0-dev" />
  <link rel="stylesheet" href="../../css/kit.css?v=2.0.0-dev" />
  <style>
    .box { display: flex; flex-wrap: wrap; justify-content: center; align-content: center; gap: 6px 14px; background: rgba(255,255,255,0.7); border-radius: var(--r-lg); padding: 16px; box-shadow: var(--sh-1); width: min(94vw, 760px); min-height: clamp(120px, 26vh, 260px); margin-bottom: var(--s-4); }
    .item { font-size: clamp(44px, 11vmin, 80px); cursor: pointer; transition: transform var(--t-med) var(--ease-bounce); animation: k-in var(--t-slow) var(--ease-bounce) both; }
    .item.counted { transform: scale(1.25); filter: drop-shadow(0 0 10px #fff); }
  </style>
</head>
<body>
  <script src="../../js/common.js?v=2.0.0-dev"></script>
  <script src="../../js/kit/levels.js?v=2.0.0-dev"></script>
  <script src="../../js/kit/kit.js?v=2.0.0-dev"></script>
  <script src="logic.js?v=2.0.0-dev"></script>
  <script>
    const CO = CompterLogic;
    let last = null;
    Kit.game({
      id: "compter", title: "Je compte", icon: "🔢",
      bg: "linear-gradient(160deg, #fff3bf, #ffd8a8)",
      instruction: (cfg, lv) => lv === 3 ? "Compte seulement les objets demandés ! Touche-les pour compter." : "Combien y en a-t-il ? Touche les objets pour compter.",
      levels: CO.LEVELS,
      start(round) {
        const q = CO.question(round.level, Math.random, last);
        last = q.n;
        Kit.ui.prompt(round.stage, { visual: `${q.thing.e} ❓`, onTap: () => round.say(CO.say(q)) });
        const box = Kit.ui.el("div", "box");
        let counted = 0;
        q.items.forEach((e, i) => {
          const s = Kit.ui.el("span", "item", e);
          s.style.animationDelay = i * 60 + "ms";
          s.onclick = () => {
            if (e !== q.thing.e) { round.say(`Ça, ce n'est pas ${q.thing.f ? "une" : "un"} ${q.thing.one} !`); return; }
            if (s.classList.contains("counted")) return;
            s.classList.add("counted"); counted++;
            Jeux.sounds.step(counted - 1);
            round.say(CO.countWord(counted, q.thing));
          };
          box.appendChild(s);
        });
        round.stage.appendChild(box);
        const buttons = Kit.ui.choices(round.stage, q.options, {
          onPick(v, b) {
            if (v === q.n) round.win(b, `${CO.countWord(q.n, q.thing)} ${q.n > 1 ? q.thing.many : q.thing.one} !`);
            else round.miss(b, "Essaie encore ! Touche-les pour compter.");
          },
        });
        round.setHintTarget(() => buttons[q.options.indexOf(q.n)]);
        round.timeout(() => round.say(CO.say(q)), round.index === 0 ? 2600 : 350);
      },
    });
  </script>
</body>
</html>
