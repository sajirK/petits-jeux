<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Je compte</title>
  <link rel="stylesheet" href="../../css/common.css" />
  <style>
    html, body { height: 100%; }
    body {
      background: linear-gradient(160deg, #fff3b0, #ffd166);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #stars { font-size: clamp(22px, 5vw, 34px); min-height: 1.4em; letter-spacing: 2px; }
    #question {
      font-size: clamp(22px, 5vw, 34px);
      margin: 4px 0 10px;
      display: flex; align-items: center; gap: 10px;
    }
    #question > span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    #speak { font-size: 30px; background: #fff; border-radius: 50%; width: 54px; height: 54px; box-shadow: var(--shadow); }
    #items {
      flex: 1;
      width: min(94vw, 760px);
      max-height: 48vh;
      background: rgba(255, 255, 255, 0.7);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: flex;
      flex-wrap: wrap;
      align-content: center;
      justify-content: center;
      gap: 6px 14px;
      padding: 16px;
    }
    .item {
      font-size: clamp(44px, 11vw, 84px);
      animation: bounce-in 0.4s both;
      transition: transform 0.2s;
    }
    .item.counted { transform: scale(1.25); filter: drop-shadow(0 0 10px #fff); }
    #answers {
      display: flex;
      gap: clamp(12px, 4vw, 30px);
      margin: 18px 0 max(24px, env(safe-area-inset-bottom));
    }
    .answer {
      width: clamp(84px, 22vw, 140px);
      height: clamp(84px, 22vw, 140px);
      border-radius: 50%;
      font-size: clamp(44px, 12vw, 78px);
      font-weight: bold;
      background: #fff;
      box-shadow: 0 8px 0 rgba(0,0,0,0.15);
      transition: transform 0.1s;
    }
    .answer:active { transform: scale(0.9) translateY(5px); }
    .answer.good { background: #95d5b2; animation: bounce-in 0.4s; }
  </style>
</head>
<body>
  <h1 class="game-title">Je compte</h1>
  <div id="stars"></div>
  <div id="question"><span>Combien il y en a ?</span><button id="speak" aria-label="Écouter">🔊</button></div>
  <div id="items"></div>
  <div id="answers"></div>

  <script src="../../js/common.js"></script>
  <script>
    Jeux.addHomeButton();
    const { sounds, say, confetti, shuffle, pick } = Jeux;
    const things = [
      ["🍎", "pommes"], ["🐟", "poissons"], ["🚗", "voitures"], ["⭐", "étoiles"],
      ["🐞", "coccinelles"], ["🎈", "ballons"], ["🍪", "biscuits"], ["🦆", "canards"],
      ["🌸", "fleurs"], ["🦖", "dinosaures"], ["🍌", "bananes"], ["⚽", "ballons de foot"],
    ];
    const NUMBERS = ["zéro", "un", "deux", "trois", "quatre", "cinq", "six", "sept", "huit", "neuf", "dix"];
    const itemsEl = document.getElementById("items");
    const answersEl = document.getElementById("answers");
    const starsEl = document.getElementById("stars");
    let stars = 0, count = 0, name = "", busy = false, max = 5;

    function ask() { say(`Combien de ${name} ?`); }
    document.getElementById("speak").onclick = ask;

    function round() {
      busy = false;
      max = stars < 5 ? 5 : stars < 10 ? 8 : 10; // devient un peu plus dur petit à petit
      count = 1 + Math.floor(Math.random() * max);
      const [emoji, n] = pick(things);
      name = n;
      itemsEl.innerHTML = "";
      for (let i = 0; i < count; i++) {
        const s = document.createElement("span");
        s.className = "item";
        s.textContent = emoji;
        s.style.animationDelay = i * 0.08 + "s";
        // Toucher un objet le "compte" à voix haute
        s.addEventListener("click", () => {
          if (s.classList.contains("counted")) return;
          s.classList.add("counted");
          const done = itemsEl.querySelectorAll(".counted").length;
          sounds.step(done - 1);
          say(NUMBERS[done]);
        });
        itemsEl.appendChild(s);
      }
      const options = new Set([count]);
      while (options.size < 3) {
        const o = Math.max(1, Math.min(10, count + Math.floor(Math.random() * 5) - 2));
        options.add(o);
      }
      answersEl.innerHTML = "";
      shuffle([...options]).forEach((o) => {
        const b = document.createElement("button");
        b.className = "answer";
        b.textContent = o;
        b.onclick = () => answer(b, o);
        answersEl.appendChild(b);
      });
      setTimeout(ask, 500);
    }

    function answer(btn, o) {
      if (busy) return;
      if (o === count) {
        busy = true;
        btn.classList.add("good");
        sounds.success();
        stars++;
        starsEl.textContent = "⭐".repeat(stars % 10 || 10);
        Jeux.addStars(1);
        say(`Oui ! ${NUMBERS[count]} ${name} ! Bravo ${Jeux.NAME} !`);
        if (stars % 10 === 0) { confetti(60); sounds.win(); }
        setTimeout(round, 2300);
      } else {
        sounds.wrong();
        btn.classList.remove("shake");
        void btn.offsetWidth;
        btn.classList.add("shake");
        say("Essaie encore ! Touche-les pour compter.");
      }
    }

    round();
  </script>
</body>
</html>
