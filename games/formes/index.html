<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Les Formes</title>
  <link rel="stylesheet" href="../../css/common.css" />
  <style>
    html, body { height: 100%; overflow: hidden; }
    body {
      background: linear-gradient(160deg, #fdffb6, #ffd6a5);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .hint { font-size: clamp(20px, 4.5vw, 30px); margin: 0 0 6px; }
    #zone {
      flex: 1;
      width: min(96vw, 900px);
      display: grid;
      grid-template-rows: 1fr 1fr;
      gap: 12px;
      padding-bottom: max(16px, env(safe-area-inset-bottom));
    }
    .row {
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-radius: var(--radius);
    }
    #targets { background: rgba(255,255,255,0.5); box-shadow: inset 0 4px 0 rgba(0,0,0,0.06); }
    .shadow, .piece {
      width: clamp(80px, 22vw, 150px);
      height: clamp(80px, 22vw, 150px);
      display: grid; place-items: center;
    }
    .shadow svg { opacity: 0.22; }
    .shadow.filled svg { opacity: 1; animation: bounce-in 0.4s; }
    .piece { touch-action: none; cursor: grab; z-index: 5; position: relative; }
    .piece.dragging { z-index: 50; filter: drop-shadow(0 10px 6px rgba(0,0,0,0.25)); }
    .piece.back { transition: transform 0.3s; }
    svg { width: 100%; height: 100%; overflow: visible; }
  </style>
</head>
<body>
  <h1 class="game-title">Les Formes</h1>
  <p class="hint">Glisse chaque forme dans son ombre 👆</p>
  <div id="zone">
    <div class="row" id="targets"></div>
    <div class="row" id="pieces"></div>
  </div>

  <script src="../../js/common.js"></script>
  <script>
    Jeux.addHomeButton();
    const { sounds, say, shuffle, confetti, bravo } = Jeux;
    const SHAPES = {
      rond: '<circle cx="50" cy="50" r="45"/>',
      carré: '<rect x="8" y="8" width="84" height="84" rx="6"/>',
      triangle: '<polygon points="50,5 95,92 5,92"/>',
      étoile: '<polygon points="50,4 62,38 98,38 69,60 80,95 50,74 20,95 31,60 2,38 38,38"/>',
      cœur: '<path d="M50 90 C 10 60, 0 35, 20 18 C 35 6, 48 15, 50 26 C 52 15, 65 6, 80 18 C 100 35, 90 60, 50 90 Z"/>',
      losange: '<polygon points="50,3 95,50 50,97 5,50"/>',
      lune: '<path d="M70 8 A 45 45 0 1 0 92 70 A 36 36 0 1 1 70 8 Z"/>',
      rectangle: '<rect x="2" y="25" width="96" height="50" rx="6"/>',
    };
    const COLORS = ["#ef476f", "#118ab2", "#06d6a0", "#ff9f1c", "#7b2cbf", "#f15bb5"];
    const targetsEl = document.getElementById("targets");
    const piecesEl = document.getElementById("pieces");
    let left = 0, rounds = 0;

    const svg = (name, fill) => `<svg viewBox="0 0 100 100"><g fill="${fill}">${SHAPES[name]}</g></svg>`;

    function round() {
      const n = rounds < 2 ? 3 : 4;
      const names = shuffle(Object.keys(SHAPES)).slice(0, n);
      const colors = shuffle(COLORS);
      left = n;
      targetsEl.innerHTML = "";
      piecesEl.innerHTML = "";
      shuffle(names).forEach((name) => {
        const t = document.createElement("div");
        t.className = "shadow";
        t.dataset.name = name;
        t.innerHTML = svg(name, "#3b2a4d");
        targetsEl.appendChild(t);
      });
      names.forEach((name, i) => {
        const p = document.createElement("div");
        p.className = "piece";
        p.dataset.name = name;
        p.dataset.color = colors[i];
        p.innerHTML = svg(name, colors[i]);
        makeDraggable(p);
        piecesEl.appendChild(p);
      });
    }

    function makeDraggable(p) {
      let sx, sy;
      p.addEventListener("pointerdown", (e) => {
        p.setPointerCapture(e.pointerId);
        sx = e.clientX; sy = e.clientY;
        p.classList.remove("back");
        p.classList.add("dragging");
        sounds.click();
        say(p.dataset.name);
      });
      p.addEventListener("pointermove", (e) => {
        if (!p.classList.contains("dragging")) return;
        p.style.transform = `translate(${e.clientX - sx}px, ${e.clientY - sy}px) scale(1.1)`;
      });
      const drop = (e) => {
        if (!p.classList.contains("dragging")) return;
        p.classList.remove("dragging");
        const pr = p.getBoundingClientRect();
        const cx = pr.left + pr.width / 2, cy = pr.top + pr.height / 2;
        const target = [...targetsEl.children].find((t) => {
          const r = t.getBoundingClientRect();
          // tolérance généreuse pour les petits doigts
          return Math.hypot(cx - (r.left + r.width / 2), cy - (r.top + r.height / 2)) < r.width * 0.6;
        });
        if (target && target.dataset.name === p.dataset.name && !target.classList.contains("filled")) {
          target.classList.add("filled");
          target.innerHTML = svg(p.dataset.name, p.dataset.color);
          p.style.visibility = "hidden";
          sounds.success();
          left--;
          if (left === 0) {
            rounds++;
            Jeux.addStars(1);
            setTimeout(() => { sounds.win(); confetti(50); bravo("Toutes les formes sont à leur place !"); }, 300);
            setTimeout(round, 3200);
          }
        } else {
          if (target) { sounds.wrong(); say(`Ce n'est pas la bonne ombre.`); }
          p.classList.add("back");
          p.style.transform = "";
        }
      };
      p.addEventListener("pointerup", drop);
      p.addEventListener("pointercancel", drop);
    }
    round();
  </script>
</body>
</html>
