<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Les Formes</title>
  <link rel="stylesheet" href="../../css/common.css?v=2.0.0-dev" />
  <link rel="stylesheet" href="../../css/tokens.css?v=2.0.0-dev" />
  <link rel="stylesheet" href="../../css/kit.css?v=2.0.0-dev" />
  <style>
    .zone { width: min(96vw, 900px); display: grid; grid-template-rows: 1fr 1fr; gap: 14px; flex: 1; min-height: 0; max-height: 640px; }
    .row { display: flex; justify-content: space-around; align-items: center; border-radius: var(--r-lg); flex-wrap: wrap; gap: 8px; }
    .targets { background: rgba(255,255,255,0.55); box-shadow: inset 0 4px 0 rgba(0,0,0,0.06); }
    .shadow, .piece { width: var(--sz); height: var(--sz); display: grid; place-items: center; }
    .shadow svg { opacity: 0.22; transition: opacity var(--t-med); }
    .shadow.hot { outline: 4px dashed var(--c-success); outline-offset: 4px; border-radius: 16px; }
    .shadow.filled svg { opacity: 1; animation: k-good var(--t-slow) var(--ease-bounce); }
    .piece { cursor: grab; }
    .piece.placed { visibility: hidden; }
    svg { width: 100%; height: 100%; overflow: visible; }
  </style>
</head>
<body>
  <script src="../../js/common.js?v=2.0.0-dev"></script>
  <script src="../../js/kit/levels.js?v=2.0.0-dev"></script>
  <script src="../../js/kit/kit.js?v=2.0.0-dev"></script>
  <script src="logic.js?v=2.0.0-dev"></script>
  <script>
    const FL = FormesLogic;
    const COLORS = ["#ef476f", "#118ab2", "#06d6a0", "#ff9f1c", "#7b2cbf", "#f15bb5"];
    const svg = (name, fill) => `<svg viewBox="0 0 100 100"><g fill="${fill}">${FL.SHAPES[name]}</g></svg>`;
    Kit.game({
      id: "formes", title: "Les Formes", icon: "🔺",
      bg: "linear-gradient(160deg, #fdffb6, #ffd6a5)",
      instruction: () => "Glisse chaque forme dans son ombre !",
      levels: FL.LEVELS,
      start(round) {
        const b = FL.board(round.level);
        const zone = Kit.ui.el("div", "zone");
        const targets = Kit.ui.el("div", "row targets"), pieces = Kit.ui.el("div", "row");
        zone.append(targets, pieces);
        round.stage.appendChild(zone);
        round.stage.style.setProperty("--sz", ["", "clamp(90px, 22vmin, 150px)", "clamp(80px, 19vmin, 130px)", "clamp(70px, 16vmin, 112px)"][round.level]);
        const shadowEls = {};
        b.shadows.forEach((n) => { const s = Kit.ui.el("div", "shadow"); s.innerHTML = svg(n, "#3b2a4d"); shadowEls[n] = s; targets.appendChild(s); });
        let left = b.pieces.length;
        const pieceEls = {};
        b.pieces.forEach((n, i) => {
          const color = COLORS[i % COLORS.length];
          const p = Kit.ui.el("div", "piece"); p.innerHTML = svg(n, color); pieceEls[n] = p;
          pieces.appendChild(p);
          const under = (pt) => Object.entries(shadowEls).find(([, s]) => !s.classList.contains("filled") && Kit.over(s, pt, 24));
          Kit.drag(p, {
            ghost: () => { const g = Kit.ui.el("div"); g.style.width = g.style.height = "var(--sz)"; g.innerHTML = svg(n, color); return g; },
            onMove: (pt) => { Object.values(shadowEls).forEach((s) => s.classList.remove("hot")); const u = under(pt); if (u) u[1].classList.add("hot"); },
            onDrop: (pt) => {
              Object.values(shadowEls).forEach((s) => s.classList.remove("hot"));
              const u = under(pt);
              if (!u) return false;
              if (u[0] !== n) { round.miss(u[1], `Ce n'est pas la bonne ombre. Cherche l'ombre ${FL.DE[n]} !`); return false; }
              u[1].classList.add("filled"); u[1].innerHTML = svg(n, color);
              p.classList.add("placed");
              Jeux.sounds.success();
              round.burst(u[1], { count: 16 });
              round.say(FL.ARTICLE[n]);
              left--;
              if (left === 0) round.win(null, "Toutes les formes sont à leur place !", { delay: 1800 });
              return true;
            },
            onTap: () => { round.say(FL.ARTICLE[n]); round.hint({ from: p, to: shadowEls[n] }); },
          });
        });
        round.setHintTarget(() => { const n = b.pieces.find((x) => !pieceEls[x].classList.contains("placed")); return n ? { from: pieceEls[n], to: shadowEls[n] } : null; });
        if (round.index > 0) round.say("Glisse chaque forme dans son ombre !");
      },
    });
  </script>
</body>
</html>
