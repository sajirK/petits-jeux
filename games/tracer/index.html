<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>J'écris</title>
  <link rel="stylesheet" href="../../css/common.css?v=2.1.0" />
  <link rel="stylesheet" href="../../css/tokens.css?v=2.1.0" />
  <link rel="stylesheet" href="../../css/kit.css?v=2.1.0" />
  <style>
    .main { flex: 1; min-height: 0; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
    @media (orientation: landscape) { .main { flex-direction: row; } }
    .paper { background: #fff; border-radius: 24px; box-shadow: var(--sh-2); padding: 6px; }
    .paper canvas { display: block; touch-action: none; }
    .side { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .word { font-size: clamp(22px, 5vmin, 32px); min-height: 1.6em; display: flex; align-items: center; gap: 8px; }
    .word span { font-size: 1.8em; }
    .act { width: clamp(64px, 14vmin, 88px); height: clamp(64px, 14vmin, 88px); border-radius: 20px; background: #fff; box-shadow: var(--sh-2); font-size: clamp(30px, 7vmin, 44px); }
  </style>
</head>
<body>
  <script src="../../js/common.js?v=2.1.0"></script>
  <script src="../../js/kit/levels.js?v=2.1.0"></script>
  <script src="../../js/kit/kit.js?v=2.1.0"></script>
  <script src="logic.js?v=2.1.0"></script>
  <script>
    const TL = TracerLogic;
    const LETTER_NAMES = { A: "a", B: "bé", C: "cé", D: "dé", E: "e", F: "effe", G: "gé", H: "hache", I: "i", J: "ji", K: "ka", L: "elle", M: "emme", N: "enne", O: "o", P: "pé", Q: "ku", R: "erre", S: "esse", T: "té", U: "u", V: "vé", W: "double vé", X: "ixe", Y: "i grec", Z: "zède" };
    const spokenName = (ch) => LETTER_NAMES[ch] || TL.NUMBER_WORDS[+ch];
    const COLORS = ["#ff6b6b", "#4dabf7", "#51cf66", "#fcc419", "#cc5de8"];
    let glyphs = null;

    function start(round) {
      const cfg = round.cfg, el = Kit.ui.el;
      if (round.index === 0 || !glyphs) glyphs = TL.pickGlyphs(round.level, Jeux.NAME);
      const ch = glyphs[round.index], isDigit = /\d/.test(ch);
      const strokes = TL.glyph(ch), traces = strokes.map((p) => TL.newTrace(p));
      let current = 0, finished = false, tracing = false, offPath = 0, lastHint = 0, demoing = false, S = 3;
      const main = el("div", "main"), paper = el("div", "paper"), canvas = document.createElement("canvas");
      paper.appendChild(canvas);
      const side = el("div", "side"), word = el("div", "word"), demo = el("button", "act", "👀"), clear = el("button", "act", "🔄");
      demo.setAttribute("aria-label", "Regarde"); clear.setAttribute("aria-label", "Recommencer");
      side.append(word, demo, clear);
      main.append(paper, side);
      round.stage.appendChild(main);
      const ctx = canvas.getContext("2d");
      function resize() {
        const r = round.stage.getBoundingClientRect(), land = r.width > r.height;
        const availW = land ? r.width - 180 : r.width - 24, availH = land ? r.height - 20 : r.height - 120;
        S = Math.max(1.6, Math.min(availW / TL.W, availH / TL.H, 5));
        const dpr = devicePixelRatio || 1;
        canvas.width = TL.W * S * dpr; canvas.height = TL.H * S * dpr;
        canvas.style.width = TL.W * S + "px"; canvas.style.height = TL.H * S + "px";
        ctx.setTransform(dpr * S, 0, 0, dpr * S, 0, 0);
        draw();
      }
      const path = (pts, upto = pts.length - 1) => { ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i <= upto; i++) ctx.lineTo(pts[i][0], pts[i][1]); };
      function draw(demoPoint = null) {
        ctx.clearRect(0, 0, TL.W, TL.H);
        ctx.strokeStyle = "#e7f5ff"; ctx.lineWidth = 0.8;
        for (const y of [10, 60, 110]) { ctx.beginPath(); ctx.moveTo(2, y); ctx.lineTo(TL.W - 2, y); ctx.stroke(); }
        ctx.lineCap = ctx.lineJoin = "round";
        strokes.forEach((pts, i) => { ctx.strokeStyle = i === current && !finished ? "#dee2e6" : "#f1f3f5"; ctx.lineWidth = cfg.width; path(pts); ctx.stroke(); });
        if (!finished) { ctx.setLineDash([2, 3]); ctx.strokeStyle = "#adb5bd"; ctx.lineWidth = 1.2; path(strokes[current]); ctx.stroke(); ctx.setLineDash([]); }
        traces.forEach((tr, i) => { if (tr.progress <= 0) return; ctx.strokeStyle = COLORS[i % COLORS.length]; ctx.lineWidth = cfg.width * 0.72; path(tr.points, tr.progress); ctx.stroke(); });
        if (!finished) {
          const tr = traces[current], p = tr.points[tr.progress], q = tr.points[Math.min(tr.points.length - 1, tr.progress + 5)];
          const ang = Math.atan2(q[1] - p[1], q[0] - p[0]);
          ctx.save(); ctx.translate(p[0] + Math.cos(ang) * 12, p[1] + Math.sin(ang) * 12); ctx.rotate(ang);
          ctx.fillStyle = "#2b8a3e"; ctx.beginPath(); ctx.moveTo(5, 0); ctx.lineTo(-3, -4.5); ctx.lineTo(-3, 4.5); ctx.closePath(); ctx.fill(); ctx.restore();
          ctx.fillStyle = "#40c057"; ctx.beginPath(); ctx.arc(p[0], p[1], 6, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = "#fff"; ctx.font = "bold 7px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(String(current + 1), p[0], p[1] + 0.5);
        }
        if (demoPoint) { ctx.fillStyle = "#fa5252"; ctx.beginPath(); ctx.arc(demoPoint[0], demoPoint[1], 5, 0, Math.PI * 2); ctx.fill(); ctx.font = "14px serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("👆", demoPoint[0] + 13, demoPoint[1] - 12); }
      }
      const toUnits = (e) => { const r = canvas.getBoundingClientRect(); return [((e.clientX - r.left) / r.width) * TL.W, ((e.clientY - r.top) / r.height) * TL.H]; };
      const hint = (text) => { const now = performance.now(); if (now - lastHint < 3500) return; lastHint = now; round.say(text); };
      canvas.addEventListener("pointerdown", (e) => {
        if (finished || demoing) return;
        e.preventDefault();
        try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
        const [x, y] = toUnits(e), tr = traces[current];
        TL.touchStart(tr);
        if (!TL.canStartAt(tr, x, y, cfg.tol)) { tracing = false; Jeux.sounds.tone(300, 0.08, "sine", 0.12); hint("Commence au point vert !"); return; }
        tracing = true; offPath = 0;
        TL.feed(tr, x, y, cfg.tol); draw();
      });
      canvas.addEventListener("pointermove", (e) => {
        if (!tracing || finished) return;
        const [x, y] = toUnits(e), tr = traces[current], res = TL.feed(tr, x, y, cfg.tol);
        if (!res.near) { offPath++; if (offPath > 12) hint("Reste sur le chemin gris !"); } else offPath = 0;
        if (res.advanced && tr.progress % 8 === 0) Jeux.sounds.tone(500 + tr.progress * 6, 0.04, "sine", 0.06);
        if (tr.done) strokeDone();
        draw();
      });
      const up = () => { tracing = false; };
      canvas.addEventListener("pointerup", up); canvas.addEventListener("pointercancel", up);
      function strokeDone() {
        tracing = false;
        Jeux.sounds.step(current);
        if (current < strokes.length - 1) { current++; round.say(`Bravo ! Maintenant, le trait numéro ${current + 1}.`); }
        else {
          finished = true; draw();
          if (isDigit) { word.innerHTML = `<span>${"🍎".repeat(+ch) || "0️⃣"}</span>`; round.win(paper, `Tu as écrit le chiffre ${spokenName(ch)} !`, { praise: false, delay: 3000 }); }
          else { const [w, e] = TL.WORDS[ch]; word.innerHTML = `<span>${e}</span>${ch}`; round.win(paper, `${spokenName(ch)}, comme ${w} !`, { praise: false, delay: 3000 }); }
        }
      }
      demo.onclick = () => {
        if (finished || demoing) return;
        demoing = true; Jeux.sounds.click(); round.say("Regarde bien le point rouge.");
        const pts = traces[current].points.slice(traces[current].progress);
        let i = 0;
        const step = () => { if (i >= pts.length) { demoing = false; draw(); return; } draw(pts[i]); i++; round.timeout(step, 28); };
        round.timeout(step, 500);
      };
      clear.onclick = () => { if (demoing || finished) return; traces.forEach((t) => { t.progress = 0; t.done = false; t.last = null; }); current = 0; Jeux.sounds.pop(); draw(); };
      // aide : le bouton 👀 (et, pour le robot de test, le chemin du trait à suivre)
      demo.__robotPath = () => { const r = canvas.getBoundingClientRect(), tr = traces[current]; return tr.points.slice(tr.progress).map(([x, y]) => [r.left + (x / TL.W) * r.width, r.top + (y / TL.H) * r.height]); };
      round.setHintTarget(() => (finished ? null : demo));
      resize();
      const ro = new ResizeObserver(resize); ro.observe(round.stage); round.onCleanup(() => ro.disconnect());
      round.timeout(() => round.say(isDigit ? `Écris le chiffre ${spokenName(ch)}. Commence au point vert !` : `Écris la lettre ${spokenName(ch)}. Commence au point vert !`), round.index === 0 ? 2800 : 400);
    }

    Kit.game({
      id: "tracer", title: "J'écris", icon: "✏️",
      bg: "linear-gradient(160deg, #e7f5ff, #fff0f6)",
      instruction: () => "Suis le chemin gris avec ton doigt. Commence au point vert, et suis la flèche !",
      levels: TL.LEVELS,
      start,
    });
  </script>
</body>
</html>
