<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Les Suites logiques</title>
  <link rel="stylesheet" href="../../css/common.css?v=2.0.0" />
  <link rel="stylesheet" href="../../css/tokens.css?v=2.0.0" />
  <link rel="stylesheet" href="../../css/kit.css?v=2.0.0" />
  <style>
    .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; background: rgba(255,255,255,0.6); border-radius: var(--r-lg); padding: 14px; margin-bottom: var(--s-4); max-width: min(96vw, 920px); }
    .cell { width: clamp(50px, 11vmin, 84px); aspect-ratio: 1; border-radius: var(--r-md); background: #fff; display: grid; place-items: center; font-size: clamp(30px, 7vmin, 54px); font-weight: bold; box-shadow: var(--sh-1); animation: k-in var(--t-slow) var(--ease-bounce) both; }
    .cell.g0 { background: #ffe5ec; } .cell.g1 { background: #e0f4ff; }
    .slot { border: 4px dashed var(--c-primary); background: #f3f0ff; color: var(--c-primary); animation: pulse 1.1s infinite; }
    .slot.filled { border-style: solid; border-color: var(--c-success); background: var(--c-success-soft); animation: k-good var(--t-slow) var(--ease-bounce); }
    @keyframes pulse { 50% { transform: scale(1.08); } }
  </style>
</head>
<body>
  <script src="../../js/common.js?v=2.0.0"></script>
  <script src="../../js/kit/levels.js?v=2.0.0"></script>
  <script src="../../js/kit/kit.js?v=2.0.0"></script>
  <script src="logic.js?v=2.0.0"></script>
  <script>
const stepOf = (round) => { const a = round.cfg.internal; return a[Math.min(a.length - 1, Math.floor((round.index * a.length) / round.rounds))]; };
    const SL = SuitesLogic;
    let lastKey = "";
    Kit.game({
      id: "suites", title: "Les Suites logiques", icon: "🧩",
      bg: "linear-gradient(160deg, #e5dbff, #d0ebff)",
      instruction: () => "Regarde bien la suite. Qu'est-ce qui vient après ?",
      levels: SL.LEVELS,
      start(round) {
        let q, k = 0;
        do { q = SL.generate(stepOf(round)); } while (q.shown.join() + q.answer === lastKey && k++ < 10);
        lastKey = q.shown.join() + q.answer;
        const row = Kit.ui.el("div", "row");
        q.shown.forEach((v, i) => { const c = Kit.ui.el("div", "cell", String(v)); c.style.animationDelay = i * 50 + "ms"; row.appendChild(c); });
        const slot = Kit.ui.el("div", "cell slot", "?");
        row.appendChild(slot);
        round.stage.appendChild(row);
        let hinted = false;
        const buttons = Kit.ui.choices(round.stage, q.options, {
          onPick(o, b) {
            if (o === q.answer) {
              slot.textContent = o; slot.classList.add("filled");
              round.win(b, q.kind === "numbers" ? `Après ${q.shown[q.shown.length - 1]}, c'est ${o} !` : "");
            } else {
              // indice : on colorie les répétitions du motif
              if (!hinted && q.kind === "symbols") { hinted = true; [...row.children].forEach((c, i) => { if (c !== slot) c.classList.add("g" + (Math.floor(i / q.unit.length) % 2)); }); }
              round.miss(b, q.kind === "numbers" ? "Regarde de combien ça avance à chaque fois !" : "Regarde les couleurs : le même groupe se répète !");
            }
          },
        });
        round.setHintTarget(() => buttons[q.options.indexOf(q.answer)]);
        if (round.index > 0) round.say(q.kind === "numbers" ? "Quel nombre vient après ?" : "Qu'est-ce qui vient après ?");
      },
    });
  </script>
</body>
</html>
