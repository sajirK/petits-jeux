<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Trouve l'intrus</title>
  <link rel="stylesheet" href="../../css/common.css?v=2.1.0" />
  <link rel="stylesheet" href="../../css/tokens.css?v=2.1.0" />
  <link rel="stylesheet" href="../../css/kit.css?v=2.1.0" />
  <style>
    .k-choice.card { min-width: clamp(110px, 25vmin, 170px); min-height: clamp(110px, 25vmin, 170px); font-size: clamp(56px, 13vmin, 96px); }
    .k-choice.card small { opacity: 0; transition: opacity var(--t-med); }
    .k-choice.card.reveal small { opacity: 1; }
  </style>
</head>
<body>
  <script src="../../js/common.js?v=2.1.0"></script>
  <script src="../../js/kit/levels.js?v=2.1.0"></script>
  <script src="../../js/kit/kit.js?v=2.1.0"></script>
  <script src="logic.js?v=2.1.0"></script>
  <script>
const stepOf = (round) => { const a = round.cfg.internal; return a[Math.min(a.length - 1, Math.floor((round.index * a.length) / round.rounds))]; };
    const IL = IntrusLogic;
    let lastOdd = "";
    Kit.game({
      id: "intrus", title: "Trouve l'intrus", icon: "🔎",
      bg: "linear-gradient(160deg, #fff9db, #ffe8cc)",
      instruction: () => "Un des objets n'est pas comme les autres. Trouve l'intrus !",
      levels: IL.LEVELS,
      start(round) {
        let q, k = 0;
        do { q = IL.generate(stepOf(round)); } while (q.intrus.emoji === lastOdd && k++ < 10);
        lastOdd = q.intrus.emoji;
        const buttons = Kit.ui.choices(round.stage, q.items, {
          cls: "card",
          render(it, b) { b.innerHTML = `<span>${it.emoji}</span><small></small>`; b.querySelector("small").textContent = it.name.replace(/^(le |la |les |l')/, ""); },
          onPick(it, b) {
            b.classList.add("reveal");
            if (it.odd) {
              buttons.forEach((x) => { x.classList.add("reveal"); if (x !== b) x.classList.add("dim"); });
              round.win(b, `Bravo ! ${q.explanation}`, { praise: false, delay: 4600 });
            } else round.miss(b, IL.whyNot(it.name, q.groupKey));
          },
        });
        round.setHintTarget(() => buttons[q.items.findIndex((x) => x.odd)]);
        if (round.index > 0) round.say("Trouve l'intrus !");
      },
    });
  </script>
</body>
</html>
