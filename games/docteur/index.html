<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Le Docteur des animaux</title>
  <link rel="stylesheet" href="../../css/common.css?v=2.0.0-dev" />
  <link rel="stylesheet" href="../../css/tokens.css?v=2.0.0-dev" />
  <link rel="stylesheet" href="../../css/kit.css?v=2.0.0-dev" />
  <style>
    /* ---------- Disposition : patient au centre, trousse en bas (ou à droite en paysage) ---------- */
    .room { flex: 1; min-height: 0; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: space-between; gap: var(--s-2); }
    @media (orientation: landscape) { .room { flex-direction: row; justify-content: center; gap: var(--s-4); } }
    /* la zone du patient prend toute la place restante (sinon sa taille se calcule sur son contenu) */
    .care { flex: 1; min-height: 0; min-width: 0; align-self: stretch; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .kitbag { align-self: center; }

    /* bulle : ce qu'a l'animal + les étapes du soin (en images) */
    .bubble { display: flex; align-items: center; gap: var(--s-2); background: var(--c-paper); border-radius: var(--r-pill); padding: 6px 10px; box-shadow: var(--sh-1); margin-bottom: var(--s-1); cursor: pointer; }
    .bubble .sick-icon { font-size: 30px; }
    .step { width: 46px; height: 46px; border-radius: 50%; background: #f1f3f5; display: grid; place-items: center; font-size: 24px; position: relative; transition: all var(--t-med) var(--ease-bounce); }
    .step.now { background: #e7f5ff; box-shadow: 0 0 0 3px #4dabf7; transform: scale(1.12); }
    .step.done { background: var(--c-success-soft); }
    .step.done::after { content: "✓"; position: absolute; right: -4px; bottom: -6px; font-size: 18px; font-weight: bold; color: var(--c-success); }

    /* le patient */
    .patient-wrap { position: relative; display: flex; flex-direction: column; align-items: center; }
    .patient { position: relative; width: var(--P); height: var(--P); touch-action: none; z-index: 2; }
    .patient.arrive { animation: arrive 0.7s var(--ease-out); }
    @keyframes arrive { from { transform: translateX(-70vw) rotate(-10deg); } }
    .patient.sick { animation: shiver 2.4s ease-in-out infinite; }
    @keyframes shiver { 0%, 100% { rotate: 0deg; } 25% { rotate: -1.5deg; } 75% { rotate: 1.5deg; } }
    .patient.happy { animation: jump 0.5s ease-in-out 3; }
    @keyframes jump { 50% { transform: translateY(-14%); } }
    .bed { width: calc(var(--P) * 1.2); height: calc(var(--P) * 0.11); margin-top: calc(var(--P) * -0.09); background: #fff; border-radius: 18px; box-shadow: 0 8px 0 #a5d8ff; }
    .part { position: absolute; transform: translate(-50%, -50%); }
    .body { border-radius: 48% 48% 42% 42%; box-shadow: inset -10px -12px 0 rgba(0,0,0,0.1); }
    .limb { border-radius: 50%; box-shadow: inset -5px -6px 0 rgba(0,0,0,0.12); }
    .belly { border-radius: 50%; background: rgba(255,255,255,0.35); }
    .head { font-size: calc(var(--P) * 0.42); line-height: 1; z-index: 3; }
    .fx { position: absolute; transform: translate(-50%, -50%); pointer-events: none; z-index: 5; }
    .mood { position: absolute; right: -4%; top: -2%; font-size: calc(var(--P) * 0.15); z-index: 7; animation: k-in var(--t-slow) var(--ease-bounce); }
    .fever { border-radius: 50%; background: radial-gradient(circle, rgba(255, 60, 60, 0.45), transparent 70%); z-index: 4; }
    .scratch i { position: absolute; left: 0; width: 100%; height: 18%; border-radius: 4px; background: #d00000; transform: rotate(-25deg); }
    .mud { border-radius: 46% 54% 40% 60%; background: #7f5539; z-index: 6; transition: opacity 0.2s; }
    .thorn { width: 0; height: 0; border-left: calc(var(--P) * 0.02) solid transparent; border-right: calc(var(--P) * 0.02) solid transparent; border-bottom: calc(var(--P) * 0.075) solid #6b3e1e; z-index: 8; transition: opacity 0.2s; }
    .tear { font-size: calc(var(--P) * 0.06); animation: tear 1.4s ease-in infinite; z-index: 6; }
    @keyframes tear { from { opacity: 1; transform: translate(-50%, -50%); } to { opacity: 0; transform: translate(-50%, 250%); } }
    .cast { border-radius: 40%; background: repeating-linear-gradient(-30deg, #fff 0 8px, #e9ecef 8px 12px); z-index: 6; animation: k-in 0.3s var(--ease-bounce); }
    .applied { font-size: calc(var(--P) * 0.13); z-index: 7; animation: k-in var(--t-slow) var(--ease-bounce); }
    .temp { position: absolute; top: -6%; left: 50%; transform: translateX(-50%); background: #fff; border-radius: 14px; padding: 2px 12px; font-size: calc(var(--P) * 0.08); font-weight: bold; box-shadow: var(--sh-1); z-index: 9; }
    /* la cible : où soigner (se remplit quand on frotte) */
    .target { border-radius: 50%; border: 4px dashed #4dabf7; z-index: 8; animation: spin 5s linear infinite; background: conic-gradient(rgba(77, 171, 247, 0.4) var(--pct, 0%), transparent 0); }
    .target.hot { border-color: var(--c-success); border-style: solid; }
    @keyframes spin { to { rotate: 360deg; } }

    /* la trousse */
    .kitbag {
      flex: none; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;
      background: rgba(255,255,255,0.7); border-radius: var(--r-lg); padding: 10px; box-shadow: var(--sh-1);
      max-width: min(96vw, 720px); margin-bottom: 4px;
    }
    @media (orientation: landscape) { .kitbag { max-width: 270px; } }
    .tool {
      width: clamp(64px, 13vmin, 84px); height: clamp(64px, 13vmin, 84px); border-radius: 50%;
      background: var(--c-paper); box-shadow: var(--sh-2); font-size: clamp(32px, 7vmin, 44px);
      display: grid; place-items: center; touch-action: none; cursor: grab;
      transition: transform var(--t-fast) var(--ease-out), opacity var(--t-fast);
    }
    .tool.lifted { opacity: 0.3; transform: scale(0.9); }
    .tool.glow { animation: glow 1.1s ease-in-out infinite; }
    @keyframes glow { 50% { transform: translateY(-6px) scale(1.06); box-shadow: 0 0 0 6px #ffd43b, var(--sh-2); } }
    .ghost { position: fixed; z-index: 900; font-size: 64px; pointer-events: none; transform: translate(-50%, -60%) scale(1.1); filter: drop-shadow(0 10px 8px rgba(0,0,0,0.25)); }
    .ghost.back { transition: left 0.3s var(--ease-out), top 0.3s var(--ease-out), opacity 0.3s; opacity: 0.2; }
    .puff { position: fixed; pointer-events: none; z-index: 950; font-size: 28px; animation: puff 0.8s ease-out forwards; }
    @keyframes puff { to { transform: translate(var(--dx), -46px) scale(1.6); opacity: 0; } }
  </style>
</head>
<body>
  <script src="../../js/common.js?v=2.0.0-dev"></script>
  <script src="../../js/kit/levels.js?v=2.0.0-dev"></script>
  <script src="../../js/kit/kit.js?v=2.0.0-dev"></script>
  <script src="logic.js?v=2.0.0-dev"></script>
  <script>
    const D = DocteurLogic;
    let session = null, ctx = null;

    // ======================================================================
    // Construction de la scène pour un patient
    // ======================================================================
    function buildRoom(round, patient, tray) {
      const [head, body, limbs] = patient.animal;
      const ailment = D.AILMENTS[patient.ailment];
      ctx = { round, patient, tray, step: 0, progress: 0, placed: 0, busy: false, sick: {}, toolEls: {} };

      const room = el("div", "room");
      const care = el("div", "care");
      const bubble = el("button", "bubble");
      bubble.setAttribute("aria-label", "Réécouter");
      bubble.onclick = () => round.say(currentStep() ? currentStep().say : ailment.intro);
      care.appendChild(bubble);
      const wrap = el("div", "patient-wrap");
      const p = el("div", "patient arrive sick");
      wrap.append(p, el("div", "bed"));
      care.appendChild(wrap);
      const bag = el("div", "kitbag");
      room.append(care, bag);
      round.stage.appendChild(room);
      ctx.bubble = bubble; ctx.patientEl = p;

      // taille du patient selon la place disponible
      const fit = () => {
        const r = care.getBoundingClientRect();
        const P = Math.max(150, Math.min(r.width * 0.78, (r.height - 70) * 0.9, 420));
        round.stage.style.setProperty("--P", P + "px");
      };
      fit();
      new ResizeObserver(fit).observe(care);

      // le corps de l'animal
      part(p, "limb", 37, 88, 18, 14, limbs); part(p, "limb", 63, 88, 18, 14, limbs);
      part(p, "limb", 22, 60, 16, 16, limbs); part(p, "limb", 78, 60, 16, 16, limbs);
      part(p, "body", 50, 66, 50, 44, body); part(p, "belly", 50, 70, 30, 26);
      part(p, "head", 50, 27).textContent = head;
      const mood = el("div", "mood"); mood.textContent = patient.ailment === "fievre" ? "🤒" : "😢"; p.appendChild(mood);
      ctx.mood = mood;
      showSickness(p, patient.ailment);

      // la trousse
      tray.forEach((t) => {
        const b = el("button", "tool");
        b.textContent = D.TOOLS[t].e;
        b.dataset.tool = t;
        b.setAttribute("aria-label", D.TOOLS[t].name);
        b.addEventListener("pointerdown", (e) => startDrag(e, b, t));
        bag.appendChild(b);
        ctx.toolEls[t] = b;
      });

      round.setHintTarget(() => ctx.toolEls[currentStep() && currentStep().tool]);
      renderStep();
      // l'animal se présente, puis on dit quoi faire
      setTimeout(() => p.classList.remove("arrive"), 800);
      setTimeout(() => round.say(`${ailment.intro} ${patient.steps[0].say}`), round.index === 0 ? 3200 : 500);
    }

    const el = (tag, cls) => { const e = document.createElement(tag); e.className = cls; return e; };
    function part(p, cls, x, y, w, h, bg) {
      const d = el("div", "part " + cls);
      d.style.left = x + "%"; d.style.top = y + "%";
      if (w) d.style.width = w + "%";
      if (h) d.style.height = h + "%";
      if (bg) d.style.background = bg;
      p.appendChild(d);
      return d;
    }
    const fx = (p, cls, x, y, w, h) => { const d = part(p, "fx " + cls, x, y, w, h); return d; };

    function showSickness(p, id) {
      const s = ctx.sick;
      s.tears = [fx(p, "tear", 38, 34), fx(p, "tear", 62, 34)];
      s.tears.forEach((t, i) => { t.textContent = "💧"; t.style.animationDelay = i * 0.7 + "s"; });
      const Z = D.ZONES;
      if (id === "bobo") { s.scratch = fx(p, "scratch", Z.joue[0], Z.joue[1], 11, 7); s.scratch.innerHTML = "<i style='top:10%'></i><i style='top:45%'></i><i style='top:80%'></i>"; }
      if (id === "fievre") s.fever = fx(p, "fever", 50, 27, 48, 48);
      if (id === "epine") { s.thorn = fx(p, "thorn", Z.patte[0], Z.patte[1]); s.thorn.style.opacity = 0.1; }
      if (id === "ventre") { s.swirl = fx(p, "", 50, 68); s.swirl.textContent = "🌀"; s.swirl.style.fontSize = "calc(var(--P) * 0.09)"; s.swirl.style.opacity = 0.6; }
      if (id === "boue") s.mud = [[40, 62, 14, 10], [60, 74, 12, 9], [44, 20, 10, 8], [76, 58, 9, 9], [36, 88, 10, 7]].map(([x, y, w, h]) => { const m = fx(p, "mud", x, y, w, h); m.dataset.left = 1; return m; });
      if (id === "jambe") { s.bones = fx(p, "", Z.jambe[0], Z.jambe[1]); s.bones.textContent = "🦴"; s.bones.style.fontSize = "calc(var(--P) * 0.14)"; s.bones.style.opacity = 0; s.bolt = fx(p, "", Z.jambe[0] + 10, Z.jambe[1] - 8); s.bolt.textContent = "⚡"; s.bolt.style.fontSize = "calc(var(--P) * 0.07)"; }
    }

    const currentStep = () => ctx.patient.steps[ctx.step];

    // bulle (étapes en images), cible sur le corps, outil qui brille en Facile
    function renderStep() {
      const ailment = D.AILMENTS[ctx.patient.ailment];
      ctx.bubble.innerHTML = `<span class="sick-icon">${ailment.icon}</span>` + ctx.patient.steps.map((s, i) => `<span class="step ${i < ctx.step ? "done" : i === ctx.step ? "now" : ""}">${D.TOOLS[s.tool].e}</span>`).join("");
      if (ctx.target) ctx.target.remove();
      ctx.target = null;
      Object.values(ctx.toolEls).forEach((b) => b.classList.remove("glow"));
      const s = currentStep();
      if (!s) return;
      if (s.zone !== "mud") {
        const [x, y, r] = D.ZONES[s.zone];
        ctx.target = fx(ctx.patientEl, "target", x, y, r * 2.3, r * 2.3);
      }
      if (ctx.round.cfg.glow && ctx.toolEls[s.tool]) ctx.toolEls[s.tool].classList.add("glow");
    }

    // ======================================================================
    // Glisser-déposer des outils
    // ======================================================================
    let drag = null;
    function startDrag(e, btn, tool) {
      if (ctx.busy || drag) return;
      e.preventDefault();
      try { btn.setPointerCapture(e.pointerId); } catch (err) {}
      const g = el("div", "ghost");
      g.textContent = D.TOOLS[tool].e;
      document.body.appendChild(g);
      // on retient l'étape au moment où l'outil est pris : si l'étape se termine pendant
      // le geste (on a fini de frotter), lâcher l'outil ne doit pas compter comme une erreur
      drag = { btn, tool, ghost: g, last: null, grabbed: false, pid: e.pointerId, stepAtStart: ctx.step, patientAtStart: ctx.patient };
      btn.classList.add("lifted");
      Jeux.sounds.click();
      moveGhost(e);
      btn.addEventListener("pointermove", onMove);
      btn.addEventListener("pointerup", onUp);
      btn.addEventListener("pointercancel", onUp);
    }
    function moveGhost(e) { drag.ghost.style.left = e.clientX + "px"; drag.ghost.style.top = e.clientY + "px"; }
    // position du doigt dans le patient, en %
    function rel(e) {
      const r = ctx.patientEl.getBoundingClientRect();
      return [((e.clientX - r.left) / r.width) * 100, ((e.clientY - r.top) / r.height) * 100];
    }
    const onPatient = (pt) => pt[0] > -5 && pt[0] < 105 && pt[1] > -5 && pt[1] < 105;

    let lastFx = 0, lastBeat = 0;
    function onMove(e) {
      if (!drag) return;
      moveGhost(e);
      const s = currentStep();
      const pt = rel(e);
      const dist = drag.last ? Math.hypot(pt[0] - drag.last[0], pt[1] - drag.last[1]) : 0;
      drag.last = pt;
      if (!s || !D.isRightTool(s, drag.tool) || ctx.busy) return;
      const now = performance.now();
      if (s.type === "rub" && D.inZone(pt, s.zone)) {
        ctx.progress += dist / 100;
        ctx.target && ctx.target.classList.add("hot");
        setPct(ctx.progress / s.amount);
        rubEffect(drag.tool, e, now);
        if (ctx.progress >= s.amount) stepDone(rubMessage(drag.tool));
      } else if (s.type === "rub" && ctx.target) ctx.target.classList.remove("hot");
      if (s.type === "mud") {
        for (const m of ctx.sick.mud) {
          if (m.dataset.left <= 0) continue;
          if (Math.hypot(pt[0] - parseFloat(m.style.left), pt[1] - parseFloat(m.style.top)) < 13) {
            m.dataset.left = Math.max(0, m.dataset.left - dist / (ctx.round.level === 1 ? 35 : 55));
            m.style.opacity = m.dataset.left;
            if (now - lastFx > 120) { lastFx = now; puff(e, "🫧"); Jeux.sounds.noise(0.12, { from: 900, to: 1400, q: 2, volume: 0.1 }); }
            if (m.dataset.left <= 0) { m.remove(); Jeux.sounds.pop(); ctx.round.burst(m, { emojis: ["🫧", "✨"], count: 10 }); }
          }
        }
        if (ctx.sick.mud.every((m) => m.dataset.left <= 0)) stepDone("Tout propre ! Ça brille !");
      }
      if (s.type === "pull") {
        if (!drag.grabbed && D.inZone(pt, s.zone)) { drag.grabbed = true; Jeux.sounds.slide(500, 800, 0.08, 0.2); ctx.round.say("Tu l'as attrapée ! Tire !"); }
        if (drag.grabbed && ctx.sick.thorn) {
          const z = D.ZONES[s.zone];
          ctx.sick.thorn.style.left = pt[0] + "%"; ctx.sick.thorn.style.top = pt[1] + "%";
          if (Math.hypot(pt[0] - z[0], pt[1] - z[1]) > 26) { ctx.sick.thorn.remove(); ctx.sick.thorn = null; Jeux.sounds.slide(300, 1000, 0.15, 0.3); stepDone("Pop ! L'épine est partie !"); }
        }
      }
    }

    function onUp(e) {
      if (!drag) return;
      const { btn, tool, ghost } = drag;
      btn.removeEventListener("pointermove", onMove);
      btn.removeEventListener("pointerup", onUp);
      btn.removeEventListener("pointercancel", onUp);
      const pt = rel(e);
      const s = currentStep();
      let consumed = false;
      const stepChanged = drag.stepAtStart !== ctx.step || drag.patientAtStart !== ctx.patient;
      if (s && !ctx.busy && !stepChanged && onPatient(pt)) {
        if (!D.isRightTool(s, tool)) {
          // mauvais outil posé sur l'animal : il rigole (et ça compte comme une erreur douce)
          ctx.round.miss(btn, pickOne(["Hihi, ça chatouille ! Ce n'est pas le bon outil.", "Hihihi ! Essaie un autre outil.", "Ça chatouille ! Regarde la bulle : quel outil faut-il ?"]));
          Jeux.sounds.slide(600, 900, 0.1, 0.2);
        } else if (s.type === "place") {
          if (D.inZone(pt, s.zone, 1.4)) { consumed = true; place(s, tool); }
          else { ctx.round.say(s.say); ctx.round.hint(ctx.target); }
        } else if (s.type === "pull" && drag.grabbed && ctx.sick.thorn) {
          // on a lâché trop tôt : l'épine retourne dans la patte
          const z = D.ZONES[s.zone];
          ctx.sick.thorn.style.left = z[0] + "%"; ctx.sick.thorn.style.top = z[1] + "%";
          ctx.round.say("Tire plus loin, sans lâcher !");
        }
      }
      // l'outil retourne dans la trousse
      const r = btn.getBoundingClientRect();
      if (consumed) ghost.remove();
      else {
        ghost.classList.add("back");
        ghost.style.left = r.left + r.width / 2 + "px";
        ghost.style.top = r.top + r.height / 2 + "px";
        setTimeout(() => ghost.remove(), 300);
      }
      btn.classList.remove("lifted");
      if (ctx.target) ctx.target.classList.remove("hot");
      drag = null;
    }

    // ======================================================================
    // Effets des outils
    // ======================================================================
    const pickOne = (a) => a[Math.floor(Math.random() * a.length)];
    function setPct(v) { if (ctx.target) ctx.target.style.setProperty("--pct", Math.min(100, v * 100) + "%"); }
    function puff(e, emoji) {
      const p = el("div", "puff");
      p.textContent = emoji;
      p.style.left = e.clientX + "px"; p.style.top = e.clientY - 40 + "px";
      p.style.setProperty("--dx", (Math.random() - 0.5) * 60 + "px");
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 800);
    }
    function rubEffect(tool, e, now) {
      const s = ctx.sick;
      if (tool === "desinfectant" && now - lastFx > 140) { lastFx = now; puff(e, "💨"); Jeux.sounds.noise(0.15, { from: 3000, to: 5000, q: 0.8, volume: 0.1 }); if (s.scratch) s.scratch.style.opacity = Math.max(0.35, 1 - ctx.progress / currentStep().amount); }
      if (tool === "loupe" && s.thorn) s.thorn.style.opacity = Math.min(1, 0.1 + ctx.progress / currentStep().amount);
      if (tool === "radio") { if (s.bones) s.bones.style.opacity = Math.min(1, ctx.progress / currentStep().amount); if (now - lastFx > 220) { lastFx = now; Jeux.sounds.tone(1200, 0.05, "sine", 0.06); } }
      if (tool === "stethoscope" && now - lastBeat > 650) { lastBeat = now; Jeux.sounds.slide(90, 60, 0.12, 0.5); Jeux.sounds.slide(90, 60, 0.1, 0.4, "sine", 0.18); puff(e, "💓"); }
    }
    function rubMessage(tool) {
      return { desinfectant: "C'est tout propre !", loupe: "Je vois une épine !", radio: "Oh ! L'os est cassé !", stethoscope: "Boum boum… et ça gargouille !" }[tool] || "";
    }
    function place(s, tool) {
      const z = D.ZONES[s.zone];
      const p = ctx.patientEl;
      ctx.placed++;
      if (tool === "thermometre") {
        ctx.busy = true;
        const th = fx(p, "applied", z[0] + 12, z[1]); th.textContent = "🌡️"; th.style.transform = "translate(-50%, -50%) rotate(40deg)";
        const t = el("div", "temp"); p.appendChild(t);
        let deg = 36;
        const iv = setInterval(() => {
          deg += 0.5;
          t.textContent = deg.toFixed(1).replace(".", ",") + "°";
          Jeux.sounds.tone(500 + deg * 10, 0.05, "sine", 0.08);
          if (deg >= 39.5) { clearInterval(iv); t.style.color = "#e03131"; setTimeout(() => { th.remove(); t.remove(); ctx.busy = false; stepDone("Il a de la fièvre !"); }, 1100); }
        }, 200);
        return;
      }
      if (tool === "sirop") { Jeux.sounds.yum(); ctx.round.burst(p.querySelector(".head"), { emojis: ["💖", "✨"], count: 8, power: 0.6 }); }
      if (tool === "pansement") { const b = fx(p, "applied", z[0], z[1]); b.textContent = "🩹"; b.style.transform = "translate(-50%, -50%) rotate(-20deg)"; if (ctx.sick.scratch) ctx.sick.scratch.remove(); Jeux.sounds.slide(400, 700, 0.08, 0.2); }
      if (tool === "glace") { const g = fx(p, "applied", z[0], z[1] - 2); g.textContent = "🧊"; if (ctx.sick.fever) ctx.sick.fever.remove(); Jeux.sounds.slide(1200, 800, 0.1, 0.15); }
      if (tool === "platre") { fx(p, "cast", z[0] - 1, z[1] - 1, 18 + ctx.placed * 3, 10 + ctx.placed * 4); Jeux.sounds.noise(0.2, { from: 600, to: 1200, q: 1, volume: 0.12 }); }
      setPct(ctx.placed / s.count);
      if (ctx.placed >= s.count) {
        if (tool === "platre" && ctx.sick.bolt) ctx.sick.bolt.remove();
        stepDone({ sirop: "Miam ! C'est bon !", pansement: "Voilà un joli pansement !", glace: "Ahh, ça rafraîchit !", platre: "Le plâtre est bien mis !" }[tool] || "");
      } else if (tool === "sirop") ctx.round.say(pickOne(["Miam !", "Encore une cuillère !", "C'est bon !"]));
    }

    // ======================================================================
    // Étapes et guérison
    // ======================================================================
    function stepDone(msg) {
      if (ctx.step >= ctx.patient.steps.length) return; // déjà guéri
      ctx.step++;
      ctx.progress = 0; ctx.placed = 0;
      if (drag) drag.grabbed = false;
      Jeux.sounds.step(ctx.step);
      renderStep();
      const s = currentStep();
      if (!s) return cured();
      ctx.round.say(`${msg} ${s.say}`);
    }

    function cured() {
      ctx.busy = true;
      const p = ctx.patientEl;
      (ctx.sick.tears || []).forEach((t) => t.remove());
      ["swirl", "fever"].forEach((k) => ctx.sick[k] && ctx.sick[k].remove());
      if (ctx.sick.bones) ctx.sick.bones.style.opacity = 0;
      p.classList.remove("sick");
      p.classList.add("happy");
      ctx.mood.textContent = "😄";
      ctx.round.burst(p, { emojis: ["❤️", "💖", "⭐", "✨"], count: 30 });
      const name = Jeux.NAME ? ` ${Jeux.NAME}` : "";
      ctx.round.win(null, `Merci docteur${name} ! Je me sens beaucoup mieux !`, { delay: 3200, praise: false });
    }

    // on démarre le jeu une fois que toutes les fonctions sont définies
    Kit.game({
      id: "docteur",
      title: "Le Docteur des animaux",
      icon: "🩺",
      bg: "linear-gradient(180deg, #e3fafc 0%, #e7f5ff 60%, #d0ebff 100%)",
      instruction: () => "Tu es le docteur ! Glisse les outils de la trousse sur l'animal pour le soigner.",
      levels: D.LEVELS,
      start(round) {
        if (round.index === 0) session = D.session(round.level);
        const patient = session.patients[round.index];
        const tray = round.level === 1 ? D.trayFor([patient.ailment], 1) : session.tray;
        buildRoom(round, patient, tray);
      },
    });
  </script>
