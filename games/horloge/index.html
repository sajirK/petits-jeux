<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Quelle heure est-il ?</title>
  <link rel="stylesheet" href="../../css/common.css?v=2.1.0" />
  <link rel="stylesheet" href="../../css/tokens.css?v=2.1.0" />
  <link rel="stylesheet" href="../../css/kit.css?v=2.1.0" />
  <style>
    .wrap { flex: 1; min-height: 0; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(10px, 3vmin, 24px); }
    @media (orientation: landscape) { .wrap.set { flex-direction: row; } }
    .clocks { display: grid; grid-template-columns: repeat(var(--n), auto); gap: clamp(10px, 3vmin, 22px); }
    @media (orientation: portrait) { .clocks.four { grid-template-columns: repeat(2, auto); } }
    .clockBtn { background: #fff; border-radius: 26px; padding: 8px; box-shadow: var(--sh-2); min-width: var(--tap-min); }
    .clockBtn svg { width: var(--cs); height: var(--cs); display: block; }
    .clockBtn.k-good { background: var(--c-success-soft); }
    .clockBtn.k-miss { background: var(--c-soft-error); }
    .big svg { width: clamp(200px, 48vmin, 360px); height: auto; display: block; filter: drop-shadow(0 8px 0 rgba(0,0,0,0.1)); }
    .hand { transition: transform 0.6s cubic-bezier(.3,1.4,.6,1); transform-origin: 150px 150px; }
    .setter { display: grid; grid-template-columns: auto auto; gap: 12px; align-items: center; justify-items: center; }
    .turn { width: clamp(72px, 15vmin, 96px); height: clamp(72px, 15vmin, 96px); border-radius: 50%; background: #fff; box-shadow: var(--sh-2); font-size: clamp(30px, 7vmin, 44px); display: grid; place-items: center; position: relative; }
    .turn i { position: absolute; left: 50%; bottom: 50%; transform-origin: 50% 100%; border-radius: 4px; }
    .turn.h { border: 6px solid #364fc7; } .turn.m { border: 6px solid #f03e3e; }
    .turn:active { transform: scale(0.92); }
    .ok { grid-column: 1 / -1; }
  </style>
</head>
<body>
  <script src="../../js/common.js?v=2.1.0"></script>
  <script src="../../js/kit/levels.js?v=2.1.0"></script>
  <script src="../../js/kit/kit.js?v=2.1.0"></script>
  <script src="logic.js?v=2.1.0"></script>
  <script>
    const HL = HorlogeLogic;
    const NS = "http://www.w3.org/2000/svg";
    // une horloge en SVG (viewBox 300×300) ; withNums : les nombres du cadran
    function clockSVG(h, m, { nums = true, id = "" } = {}) {
      let s = `<svg viewBox="0 0 300 300"><circle cx="150" cy="150" r="140" fill="#fff" stroke="#ff922b" stroke-width="12"/>`;
      for (let i = 0; i < 60; i += (nums ? 1 : 5)) {
        const a = (i * 6 * Math.PI) / 180, big = i % 5 === 0;
        s += `<line x1="${150 + Math.sin(a) * (big ? 116 : 124)}" y1="${150 - Math.cos(a) * (big ? 116 : 124)}" x2="${150 + Math.sin(a) * 130}" y2="${150 - Math.cos(a) * 130}" stroke="${big ? "#495057" : "#ced4da"}" stroke-width="${big ? 5 : 2}"/>`;
      }
      for (let n = 1; n <= 12; n++) {
        if (!nums && n % 3) continue;
        const a = (n * 30 * Math.PI) / 180;
        s += `<text x="${150 + Math.sin(a) * 96}" y="${150 - Math.cos(a) * 96 + 12}" text-anchor="middle" font-size="${nums ? 30 : 40}" font-weight="bold" fill="${n % 3 === 0 ? "#f76707" : "#343a40"}">${n}</text>`;
      }
      s += `<rect class="hand" id="${id}h" x="143" y="80" width="14" height="78" rx="7" fill="#364fc7" style="transform:rotate(${HL.hourAngle(h, m)}deg)"/>`;
      s += `<rect class="hand" id="${id}m" x="146" y="36" width="8" height="122" rx="4" fill="#f03e3e" style="transform:rotate(${HL.minuteAngle(m)}deg)"/>`;
      return s + `<circle cx="150" cy="150" r="11" fill="#343a40"/></svg>`;
    }
    let last = null;

    function start(round) {
      const el = Kit.ui.el;
      const q = HL.question(round.level, round.index, Math.random, last);
      last = q;
      const wrap = el("div", "wrap" + (q.mode === "set" ? " set" : ""));
      round.stage.appendChild(wrap);
      if (q.mode === "set") return setMode(round, q, wrap);
      const ask = () => round.say(`Il est ${q.words}. Touche la bonne horloge !`);
      Kit.ui.prompt(wrap, { visual: "🔊", caption: round.level > 1 ? q.digits : "", onTap: ask });
      const box = el("div", "clocks" + (q.options.length === 4 ? " four" : ""));
      box.style.setProperty("--n", q.options.length);
      box.style.setProperty("--cs", q.options.length === 4 ? "clamp(120px, 26vmin, 190px)" : "clamp(110px, 27vmin, 210px)");
      let good = null;
      q.options.forEach((o) => {
        const b = el("button", "clockBtn");
        b.innerHTML = clockSVG(o.h, o.m, { nums: round.level > 1 });
        b.setAttribute("aria-label", o.words);
        b.onclick = () => {
          if (o.h === q.h && o.m === q.m) round.win(b, `Il est ${q.words} !`);
          else round.miss(b, q.m === 0 ? "Regarde la petite aiguille bleue : elle montre l'heure. La grande rouge est tout en haut, sur le 12." : "La petite aiguille bleue montre l'heure, la grande rouge montre les minutes.");
        };
        if (o.h === q.h && o.m === q.m) good = b;
        box.appendChild(b);
      });
      wrap.appendChild(box);
      round.setHintTarget(good);
      round.timeout(ask, round.index === 0 ? 3000 : 400);
    }

    // Difficile, une manche sur deux : on règle soi-même les aiguilles
    function setMode(round, q, wrap) {
      const el = Kit.ui.el;
      let h = 12, m = 0, hDeg = 0, mDeg = 0;
      const ask = () => round.say(`À toi ! Mets les aiguilles sur ${q.words}.`);
      const big = el("button", "big");
      big.innerHTML = clockSVG(12, 0, { id: "set" });
      big.onclick = ask;
      wrap.appendChild(big);
      const setter = el("div", "setter");
      const mk = (cls, label, hand) => { const b = el("button", "turn " + cls, "↻"); b.setAttribute("aria-label", label); setter.appendChild(b); return b; };
      const mBtn = mk("m", "Avancer la grande aiguille"), hBtn = mk("h", "Avancer la petite aiguille");
      const ok = el("button", "k-btn primary ok", "✅");
      ok.setAttribute("aria-label", "C'est l'heure !");
      setter.appendChild(ok);
      wrap.appendChild(setter);
      const tick = () => Jeux.sounds.tone(1400, 0.03, "sine", 0.12);
      const show = () => {
        hDeg += ((((HL.hourAngle(h, m) - hDeg) % 360) + 360) % 360);
        mDeg += ((((HL.minuteAngle(m) - mDeg) % 360) + 360) % 360);
        big.querySelector("#seth").style.transform = `rotate(${hDeg}deg)`;
        big.querySelector("#setm").style.transform = `rotate(${mDeg}deg)`;
      };
      mBtn.onclick = () => { m = (m + 15) % 60; tick(); show(); };
      hBtn.onclick = () => { h = (h % 12) + 1; tick(); show(); };
      ok.onclick = () => {
        if (HL.isSet(q, h, m)) round.win(big, `Bravo ! Il est ${q.words} !`);
        else round.miss(ok, m !== q.m ? "Regarde d'abord la grande aiguille rouge, celle des minutes." : "La grande aiguille est bien placée ! Maintenant, la petite aiguille bleue.");
      };
      round.setHintTarget(() => ({ "m+": mBtn, "h+": hBtn, ok }[HL.nextSetMove(q, h, m)]));
      round.timeout(ask, 400);
    }

    Kit.game({
      id: "horloge", title: "Quelle heure est-il ?", icon: "🕰️",
      bg: "linear-gradient(160deg, #fff9db, #d3f9d8)",
      instruction: (cfg, lv) => lv === 3 ? "Écoute l'heure, et trouve la bonne horloge. Parfois, c'est toi qui tournes les aiguilles !" : "Écoute l'heure, et touche la bonne horloge !",
      levels: HL.LEVELS,
      start,
    });
  </script>
</body>
</html>
