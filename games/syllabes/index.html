<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Les syllabes magiques</title>
  <link rel="stylesheet" href="../../css/common.css?v=2.0.0" />
  <link rel="stylesheet" href="../../css/tokens.css?v=2.0.0" />
  <link rel="stylesheet" href="../../css/kit.css?v=2.0.0" />
  <style>
    .slots { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin: -6px 0 var(--s-4); }
    .slot { min-width: clamp(70px, 17vmin, 110px); height: clamp(64px, 15vmin, 96px); padding: 0 10px; border-radius: var(--r-md); border: 4px dashed rgba(0,0,0,0.18); background: rgba(255,255,255,0.55); display: grid; place-items: center; font-size: clamp(30px, 8vmin, 52px); font-weight: bold; }
    .slot.next { border-color: var(--c-primary); animation: pulse 1.1s infinite; }
    .slot.full { border: 4px solid transparent; color: #fff; text-shadow: 0 3px 0 rgba(0,0,0,0.2); animation: k-good var(--t-slow) var(--ease-bounce); }
    @keyframes pulse { 50% { transform: scale(1.05); } }
    .k-choice.tile { color: #fff; text-shadow: 0 3px 0 rgba(0,0,0,0.2); letter-spacing: 2px; }
    .k-choice.tile.used { visibility: hidden; }
    .readword { display: flex; gap: 4px; font-size: clamp(42px, 11vmin, 76px); font-weight: bold; letter-spacing: 3px; margin-bottom: var(--s-4); }
    .readword span { padding: 2px 8px; border-radius: 12px; cursor: pointer; background: rgba(255,255,255,0.6); }
    .k-choice.pic { font-size: clamp(60px, 15vmin, 104px); }
    .magic { animation: magic 1.2s ease-in-out; }
    @keyframes magic { 30% { transform: scale(1.35) rotate(-8deg); } 60% { transform: scale(1.2) rotate(8deg); } }
  </style>
</head>
<body>
  <script src="../../js/common.js?v=2.0.0"></script>
  <script src="../../js/kit/levels.js?v=2.0.0"></script>
  <script src="../../js/kit/kit.js?v=2.0.0"></script>
  <script src="logic.js?v=2.0.0"></script>
  <script>
const stepOf = (round) => { const a = round.cfg.internal; return a[Math.min(a.length - 1, Math.floor((round.index * a.length) / round.rounds))]; };
    const SY = SyllabesLogic;
    const COLORS = ["#f76707", "#7048e8", "#1c7ed6", "#37b24d", "#e64980"];
    let last = null;
    Kit.game({
      id: "syllabes", title: "Les syllabes magiques", icon: "🪄",
      bg: "linear-gradient(160deg, #f3d9fa, #d0ebff)",
      instruction: (cfg, lv) => lv === 3 ? "Assemble les syllabes, et lis les mots tout seul !" : "Écoute le mot, et assemble les syllabes dans l'ordre !",
      levels: SY.LEVELS,
      start(round) {
        const q = SY.generate(stepOf(round), Math.random, last);
        last = q.word;
        if (q.mode === "read") return readMode(round, q);
        const pic = Kit.ui.prompt(round.stage, { visual: q.emoji, onTap: () => round.say(q.word.toLowerCase()) });
        const slots = Kit.ui.el("div", "slots");
        q.syllables.forEach((s, i) => slots.appendChild(Kit.ui.el("div", "slot" + (i === 0 ? " next" : ""))));
        round.stage.appendChild(slots);
        let placed = 0;
        const buttons = Kit.ui.choices(round.stage, q.tiles, {
          cls: "tile",
          render(t, b) { b.textContent = t.text; b.style.background = COLORS[q.tiles.indexOf(t) % COLORS.length]; },
          onPick(t, b) {
            round.say(t.say, { rate: 0.85 });
            if (SY.isNext(q, placed, t)) {
              const slot = slots.children[placed];
              slot.textContent = t.text; slot.style.background = b.style.background; slot.classList.remove("next"); slot.classList.add("full");
              b.classList.add("used");
              Jeux.sounds.step(placed);
              placed++;
              if (placed < q.syllables.length) slots.children[placed].classList.add("next");
              else { pic.querySelector(".k-prompt-visual").classList.add("magic"); round.win(null, SY.blendSpeech(q), { praise: false, delay: 3600 }); }
            } else round.miss(b, `Écoute : ${q.syllables.map((s) => s.say).join("... ")}. Il faut « ${q.syllables[placed].say} ».`);
          },
        });
        round.setHintTarget(() => (placed >= q.syllables.length ? null : buttons.find((b, i) => !b.classList.contains("used") && SY.isNext(q, placed, q.tiles[i]))));
        round.timeout(() => round.say(`${q.word.toLowerCase()}. Construis le mot ${q.word.toLowerCase()} !`), round.index === 0 ? 2800 : 350);
      },
    });
    // lecture : le mot est écrit (syllabes en couleur), on trouve la bonne image
    function readMode(round, q) {
      const rw = Kit.ui.el("div", "readword");
      q.syllables.forEach((s, i) => { const sp = Kit.ui.el("span", "", s.text); sp.style.color = COLORS[i % COLORS.length]; sp.onclick = () => round.say(s.say, { rate: 0.85 }); rw.appendChild(sp); });
      round.stage.appendChild(rw);
      const buttons = Kit.ui.choices(round.stage, q.options, {
        cls: "pic",
        render(o, b) { b.textContent = o.emoji; },
        onPick(o, b) {
          if (o.word === q.word) round.win(b, `${q.word.toLowerCase()} ! Tu sais lire !`, { delay: 2600 });
          else round.miss(b, `Ça, c'est ${o.word.toLowerCase()}. Relis bien les syllabes !`);
        },
      });
      round.setHintTarget(() => buttons[q.options.findIndex((o) => o.word === q.word)]);
      round.timeout(() => round.say("Lis le mot tout seul, puis touche la bonne image !"), 350);
    }
  </script>
</body>
</html>
