<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Les saisons et la météo</title>
  <link rel="stylesheet" href="../../css/common.css?v=2.0.0-dev" />
  <link rel="stylesheet" href="../../css/tokens.css?v=2.0.0-dev" />
  <link rel="stylesheet" href="../../css/kit.css?v=2.0.0-dev" />
  <style>
    .wrap { flex: 1; min-height: 0; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(8px, 2.5vmin, 18px); }
    @media (orientation: landscape) { .wrap.meteo { flex-direction: row; } }
    .sky { border-radius: 28px; padding: 12px 18px; box-shadow: var(--sh-2); display: flex; align-items: center; gap: 14px; transition: background 0.6s, outline 0.2s; }
    .sky.k-zone-hot { outline: 5px dashed #4dabf7; }
    .scene { font-size: clamp(40px, 10vmin, 72px); letter-spacing: 4px; display: flex; flex-direction: column; align-items: center; line-height: 1.1; }
    .kid { position: relative; font-size: clamp(80px, 20vmin, 140px); line-height: 1; text-align: center; }
    .worn { display: flex; flex-wrap: wrap; gap: 4px; max-width: 230px; justify-content: center; min-height: 56px; }
    .worn button { font-size: clamp(34px, 8vmin, 50px); min-width: var(--tap-min); min-height: var(--tap-min); animation: k-in 0.3s var(--ease-bounce); }
    .side { display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .wardrobe { display: grid; grid-template-columns: repeat(var(--cols), 1fr); gap: 10px; }
    .cloth { width: clamp(64px, 13vmin, 92px); height: clamp(64px, 13vmin, 92px); border-radius: 20px; background: #fff; box-shadow: var(--sh-2); font-size: clamp(32px, 7.5vmin, 50px); touch-action: none; }
    .cloth.on { background: var(--c-success-soft); outline: 4px solid var(--c-success); }
    .k-choice .big { font-size: 1.8em; display: block; }
  </style>
</head>
<body>
  <script src="../../js/common.js?v=2.0.0-dev"></script>
  <script src="../../js/kit/levels.js?v=2.0.0-dev"></script>
  <script src="../../js/kit/kit.js?v=2.0.0-dev"></script>
  <script src="logic.js?v=2.0.0-dev"></script>
  <script>
    const SL = SaisonsLogic;
    let plan = null;

    function start(round) {
      if (round.index === 0 || !plan) plan = SL.plan(round.level);
      const r = plan[round.index];
      const wrap = Kit.ui.el("div", "wrap" + (r.kind === "meteo" ? " meteo" : ""));
      round.stage.appendChild(wrap);
      if (r.kind === "meteo") meteo(round, r, wrap); else season(round, r, wrap);
    }

    // ---------- Habiller selon la météo ----------
    function meteo(round, r, wrap) {
      const el = Kit.ui.el, w = r.weather;
      const worn = [];
      const sky = el("button", "sky");
      sky.style.background = w.sky;
      const scene = el("div", "scene");
      scene.innerHTML = [...w.scene.matchAll(/\p{Extended_Pictographic}️?/gu)].map((x) => `<span>${x[0]}</span>`).join("");
      const kidBox = el("div");
      const kid = el("div", "kid", "🧒");
      const wornEl = el("div", "worn");
      kidBox.append(kid, wornEl);
      sky.append(scene, kidBox);
      const ask = () => round.say(`${w.text} Habille-le pour aller dehors !`);
      sky.onclick = ask;
      const side = el("div", "side");
      const wardrobe = el("div", "wardrobe");
      wardrobe.style.setProperty("--cols", r.wardrobe.length <= 5 ? r.wardrobe.length : 5);
      const ready = el("button", "k-btn primary", "✅");
      ready.setAttribute("aria-label", "C'est prêt !");
      side.append(wardrobe, ready);
      wrap.append(sky, side);
      const btns = {};
      function render() {
        wornEl.innerHTML = "";
        worn.forEach((k) => { const b = el("button", "", SL.CLOTHES[k].e); b.setAttribute("aria-label", SL.CLOTHES[k].name); b.onclick = (e) => { e.stopPropagation(); toggle(k); }; wornEl.appendChild(b); });
        for (const [k, b] of Object.entries(btns)) b.classList.toggle("on", worn.includes(k));
      }
      function toggle(k, put) {
        if (round.ended) return;
        const i = worn.indexOf(k);
        if (i >= 0 && put !== true) { worn.splice(i, 1); Jeux.sounds.pop(); }
        else if (i < 0) { worn.push(k); Jeux.sounds.click(); round.say(SL.CLOTHES[k].name); }
        render();
      }
      r.wardrobe.forEach((k) => {
        const b = el("button", "cloth", SL.CLOTHES[k].e);
        b.setAttribute("aria-label", SL.CLOTHES[k].name);
        Kit.drag(b, {
          onMove: (pt) => sky.classList.toggle("k-zone-hot", Kit.over(sky, pt)),
          onDrop: (pt) => { sky.classList.remove("k-zone-hot"); if (!Kit.over(sky, pt)) return false; toggle(k, true); return true; },
          onTap: () => toggle(k),
        });
        btns[k] = b; wardrobe.appendChild(b);
      });
      ready.onclick = () => {
        const res = SL.checkOutfit(w, worn);
        if (res.ok) round.win(kid, SL.outfitMessage(w, worn), { praise: false, delay: 3000 });
        else round.miss(res.wrong.length ? wornEl.children[worn.indexOf(res.wrong[0])] : ready, SL.outfitMessage(w, worn));
      };
      round.setHintTarget(() => {
        const res = SL.checkOutfit(w, worn);
        if (res.wrong.length) return wornEl.children[worn.indexOf(res.wrong[0])];
        if (res.missing.length) return { from: btns[res.missing[0]], to: sky };
        return ready;
      });
      round.timeout(ask, round.index === 0 ? 2800 : 400);
    }

    // ---------- Les saisons ----------
    function season(round, r, wrap) {
      const ans = SL.SEASONS.find((x) => x.id === r.answer);
      const ask = () => round.say(r.kind === "scene" ? "Regarde l'image. Quelle saison est-ce ?" : `Qu'est-ce qui vient après ${r.season.name} ?`);
      Kit.ui.prompt(wrap, { visual: r.kind === "scene" ? r.season.scene : `${r.season.e} ➜ ❓`, onTap: ask });
      let good = null;
      const btns = Kit.ui.choices(wrap, r.options, {
        render: (s, b) => { b.innerHTML = `<span class="big">${s.e}</span><small>${s.label}</small>`; b.setAttribute("aria-label", s.label); if (s.id === r.answer) good = b; },
        onPick: (s, b) => {
          if (s.id === r.answer) round.win(b, r.kind === "scene" ? `C'est ${ans.name} : ${ans.hint} !` : `Après ${r.season.name}, vient ${ans.name} !`, { praise: false, delay: 3600 });
          else round.miss(b, r.kind === "scene" ? `${s.label}, c'est quand ${s.hint}. Regarde bien l'image !` : "Printemps, été, automne, hiver… Réfléchis à l'ordre !");
        },
      });
      round.setHintTarget(good);
      round.timeout(ask, 400);
    }

    Kit.game({
      id: "saisons", title: "Saisons et météo", icon: "🌦️",
      bg: "linear-gradient(160deg, #e7f5ff, #fff4e6)",
      instruction: (cfg) => cfg.seasons ? "Habille l'enfant selon la météo, puis trouve les saisons !" : "Regarde le temps qu'il fait, et habille l'enfant pour sortir !",
      levels: SL.LEVELS,
      start,
    });
  </script>
</body>
</html>
