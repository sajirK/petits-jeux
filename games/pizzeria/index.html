<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>La Pizzeria</title>
  <link rel="stylesheet" href="../../css/common.css?v=2.1.0" />
  <link rel="stylesheet" href="../../css/tokens.css?v=2.1.0" />
  <link rel="stylesheet" href="../../css/kit.css?v=2.1.0" />
  <style>
    .shop { flex: 1; min-height: 0; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 8px; }
    @media (orientation: landscape) { .shop { flex-direction: row; justify-content: center; } }
    .client { display: flex; align-items: center; gap: 10px; }
    @media (orientation: landscape) { .client { flex-direction: column; max-width: 28vw; } }
    .face { font-size: clamp(50px, 12vmin, 86px); line-height: 1; }
    .face.arrive { animation: arrive 0.7s var(--ease-out); }
    @keyframes arrive { from { transform: translateX(-60vw); } }
    .face.eat { animation: munch 0.25s ease-in-out 6; }
    @keyframes munch { 50% { transform: scale(1.15, 0.9); } }
    .bubble { background: #fff; border-radius: var(--r-md); padding: 8px 10px; box-shadow: var(--sh-1); display: flex; flex-wrap: wrap; gap: 6px; cursor: pointer; max-width: 70vw; }
    .chip { display: flex; align-items: center; gap: 4px; background: #fff3e0; border-radius: 14px; padding: 4px 10px; font-size: clamp(18px, 4vmin, 26px); border: 3px solid transparent; }
    .chip.ok { border-color: var(--c-success); background: var(--c-success-soft); }
    .chip.too { border-color: #ef476f; }
    .pizzaZone { flex: 1; min-height: 0; min-width: 0; align-self: stretch; display: grid; place-items: center; }
    .board { width: var(--S); height: var(--S); border-radius: 50%; background: radial-gradient(circle, #c68b59 60%, #a86a3d 61% 66%, transparent 67%); display: grid; place-items: center; }
    .pizza { position: relative; width: var(--S); height: var(--S); transition: transform 0.8s ease-in, opacity 0.8s; }
    .pizza.hot { filter: drop-shadow(0 0 14px rgba(81, 207, 102, 0.9)); }
    .pizza canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    .pizza.baked canvas, .pizza.baked .top { filter: sepia(0.35) saturate(1.35) brightness(0.93); }
    .pizza.gone { opacity: 0; transform: scale(0.3); }
    .top { position: absolute; transform: translate(-50%, -50%) rotate(var(--r)); font-size: calc(var(--S) * 0.11); line-height: 1; animation: k-in 0.25s var(--ease-bounce); cursor: pointer; }
    .tray { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; max-width: 760px; padding-bottom: 4px; }
    @media (orientation: landscape) { .tray { max-width: 30vw; } }
    .ing { width: clamp(64px, 12.5vmin, 84px); height: clamp(64px, 12.5vmin, 84px); border-radius: 18px; background: #fff; box-shadow: var(--sh-1); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: clamp(28px, 6.5vmin, 42px); line-height: 1.05; cursor: grab; }
    .ing small { font-size: 11px; }
    .ing.paint { background: #fff3bf; }
    .act { min-height: var(--tap-min); padding: 0 18px; border-radius: 18px; font-size: var(--fs-md); box-shadow: var(--sh-2); color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,0.2); }
    .act.bake { background: #f77f00; } .act.serve { background: var(--c-success); } .act.reset { background: #adb5bd; }
    .oven { position: fixed; inset: 0; z-index: 900; display: grid; place-items: center; background: rgba(40, 20, 10, 0.55); }
    .ovenBox { width: min(84vw, 440px); background: linear-gradient(#6c757d, #495057); border-radius: 28px; padding: 18px; box-shadow: var(--sh-float); }
    .ovenWin { height: min(46vw, 230px); border-radius: 18px; background: radial-gradient(circle at 50% 80%, #ffb703, #fb8500 40%, #6a040f 90%); display: grid; place-items: center; overflow: hidden; position: relative; border: 8px solid #343a40; }
    .ovenWin img { width: 60%; animation: glow 0.6s ease-in-out infinite alternate; }
    @keyframes glow { to { filter: brightness(1.2) sepia(0.4); } }
    .flames { position: absolute; bottom: 4px; left: 0; right: 0; text-align: center; font-size: 34px; letter-spacing: 4px; }
    .bar { height: 18px; border-radius: 9px; background: #343a40; margin-top: 14px; overflow: hidden; }
    .bar div { height: 100%; width: 0; background: linear-gradient(90deg, #ffd166, #ef476f); transition: width 2.6s linear; }
  </style>
</head>
<body>
  <script src="../../js/common.js?v=2.1.0"></script>
  <script src="../../js/kit/levels.js?v=2.1.0"></script>
  <script src="../../js/kit/kit.js?v=2.1.0"></script>
  <script src="logic.js?v=2.1.0"></script>
  <script>
    const PL = PizzeriaLogic;
    // points de contrôle pour mesurer la couverture de sauce / fromage
    const SAMPLES = [];
    for (let y = -0.75; y <= 0.75; y += 0.1) for (let x = -0.75; x <= 0.75; x += 0.1) if (x * x + y * y < 0.72 * 0.72) SAMPLES.push([x, y]);
    const coverage = (dabs, r) => SAMPLES.filter(([x, y]) => dabs.some((d) => (d.x - x) ** 2 + (d.y - y) ** 2 < r * r)).length / SAMPLES.length;
    const rand = (s) => { const x = Math.sin(s * 9301 + 49297) * 233280; return x - Math.floor(x); };

    function start(round) {
      const lv = round.level;
      const R = { sauce: lv === 1 ? 0.24 : 0.18, cheese: lv === 1 ? 0.22 : 0.16 };
      const o = PL.order(lv);
      const client = PL.CLIENTS[Math.floor(Math.random() * PL.CLIENTS.length)];
      const st = { sauce: [], cheese: [], tops: [], baked: false };
      const el = Kit.ui.el;
      const shop = el("div", "shop");
      const cl = el("div", "client");
      const face = el("div", "face arrive", client);
      const bubble = el("button", "bubble");
      bubble.onclick = () => round.say(PL.sentence(o, Jeux.NAME));
      cl.append(face, bubble);
      const zone = el("div", "pizzaZone");
      const boardEl = el("div", "board");
      const pizza = el("div", "pizza");
      const canvas = document.createElement("canvas");
      const tops = el("div");
      pizza.append(canvas, tops); boardEl.appendChild(pizza); zone.appendChild(boardEl);
      const tray = el("div", "tray");
      shop.append(cl, zone, tray);
      round.stage.appendChild(shop);
      const ctx = canvas.getContext("2d");
      let S = 300;
      const fit = () => {
        const r = zone.getBoundingClientRect();
        S = Math.floor(Math.max(170, Math.min(r.width * 0.9, r.height * 0.9, 480)));
        round.stage.style.setProperty("--S", S + "px");
        const d = devicePixelRatio || 1; canvas.width = S * d; canvas.height = S * d; ctx.setTransform(d, 0, 0, d, 0, 0);
        redraw();
      };

      // ---------- dessin ----------
      const toPx = (v) => ((v + 1) / 2) * S;
      function clip() { ctx.save(); ctx.beginPath(); ctx.arc(S / 2, S / 2, S * 0.41, 0, Math.PI * 2); ctx.clip(); }
      function dough() {
        ctx.clearRect(0, 0, S, S);
        const c = S / 2, b = st.baked;
        const g = ctx.createRadialGradient(c, c, S * 0.36, c, c, S * 0.5);
        g.addColorStop(0, b ? "#e9b872" : "#f6dca8"); g.addColorStop(0.75, b ? "#c47a32" : "#efc98a"); g.addColorStop(1, b ? "#9c5a1f" : "#e0b272");
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(c, c, S * 0.48, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = b ? "#f3d9a4" : "#fbe9c6"; ctx.beginPath(); ctx.arc(c, c, S * 0.4, 0, Math.PI * 2); ctx.fill();
      }
      function sauceDab(d) {
        clip();
        const x = toPx(d.x), y = toPx(d.y), r = (R.sauce * S) / 2 * 1.15;
        const g = ctx.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, "rgba(214,40,40,0.95)"); g.addColorStop(0.7, "rgba(200,35,35,0.9)"); g.addColorStop(1, "rgba(200,35,35,0)");
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); ctx.restore();
      }
      function cheeseDab(d) {
        clip();
        const x = toPx(d.x), y = toPx(d.y), r = (R.cheese * S) / 2;
        for (let i = 0; i < 9; i++) {
          const a = rand(d.seed + i) * Math.PI * 2, dist = rand(d.seed + i + 20) * r;
          ctx.save(); ctx.translate(x + Math.cos(a) * dist, y + Math.sin(a) * dist); ctx.rotate(rand(d.seed + i + 40) * Math.PI);
          ctx.fillStyle = st.baked ? (i % 2 ? "#ffd166" : "#f4a261") : (i % 2 ? "#ffe066" : "#ffd43b");
          ctx.fillRect(-S * 0.025, -S * 0.007, S * 0.05, S * 0.014); ctx.restore();
        }
        ctx.restore();
      }
      function redraw() { dough(); st.sauce.forEach(sauceDab); st.cheese.forEach(cheeseDab); }
      function renderTops() {
        tops.innerHTML = "";
        st.tops.forEach((t) => {
          const d = el("div", "top", t.e);
          d.style.left = (t.x + 1) * 50 + "%"; d.style.top = (t.y + 1) * 50 + "%"; d.style.setProperty("--r", t.r + "deg");
          d.onclick = () => { if (st.baked) return; st.tops.splice(st.tops.indexOf(t), 1); Jeux.sounds.pop(); renderTops(); updateBubble(); };
          tops.appendChild(d);
          t.el = d;
        });
      }
      const counts = () => { const m = {}; st.tops.forEach((t) => (m[t.e] = (m[t.e] || 0) + 1)); return m; };
      const state = () => ({ sauce: coverage(st.sauce, R.sauce), cheese: coverage(st.cheese, R.cheese), tops: counts() });
      function updateBubble() {
        const s = state(), c = s.tops;
        let html = `<span class="chip ${s.sauce >= PL.SAUCE_OK ? "ok" : ""}">🥫</span>`;
        html += o.cheese ? `<span class="chip ${s.cheese >= PL.CHEESE_OK ? "ok" : ""}">🧀</span>` : `<span class="chip ${s.cheese > 0.05 ? "too" : "ok"}">🚫🧀</span>`;
        for (const [e, n] of Object.entries(o.tops)) { const h = c[e] || 0; html += `<span class="chip ${h === n ? "ok" : h > n ? "too" : ""}">${e} ${h}/${n}</span>`; }
        bubble.innerHTML = html;
      }
      const inPizza = (pt) => { const r = pizza.getBoundingClientRect(); const x = ((pt.x - r.left) / r.width) * 2 - 1, y = ((pt.y - r.top) / r.height) * 2 - 1; return x * x + y * y < 0.85 * 0.85 ? { x, y } : null; };

      // ---------- outils : sauce et fromage (on glisse la bouteille sur la pizza) ----------
      let lastNoise = 0;
      function paintTool(kind, emoji, label) {
        const b = el("button", "ing paint");
        b.innerHTML = `${emoji}<small>${label}</small>`;
        Kit.drag(b, {
          enabled: () => !st.baked,
          onMove: (pt) => {
            const p = inPizza(pt); pizza.classList.toggle("hot", !!p);
            if (!p) return;
            const list = st[kind], lastD = list[list.length - 1];
            if (lastD && Math.hypot(lastD.x - p.x, lastD.y - p.y) < 0.05) return;
            const d = { x: p.x, y: p.y, seed: Math.random() * 1000 };
            list.push(d); (kind === "sauce" ? sauceDab : cheeseDab)(d);
            const now = performance.now();
            if (now - lastNoise > 140) { lastNoise = now; Jeux.sounds.noise(0.1, kind === "sauce" ? { from: 400, to: 250, q: 2, volume: 0.1 } : { from: 3000, to: 4000, q: 3, volume: 0.07 }); }
            if (list.length % 5 === 0) updateBubble();
          },
          onDrop: () => { pizza.classList.remove("hot"); updateBubble(); return false; },
          onTap: () => { round.say(kind === "sauce" ? "Glisse la sauce sur la pizza pour l'étaler !" : "Glisse le fromage sur la pizza !"); round.hint({ from: b, to: pizza }); },
        });
        return b;
      }
      const sauceBtn = paintTool("sauce", "🥫", "sauce"), cheeseBtn = paintTool("cheese", "🧀", "fromage");
      tray.append(sauceBtn, cheeseBtn);
      // ---------- garnitures ----------
      function addTop(e, x, y) {
        if (st.baked || st.tops.length >= 30) return;
        if (x === undefined) {
          let best = [0, 0], bestD = -1;
          for (let k = 0; k < 25; k++) { const a = Math.random() * Math.PI * 2, r = Math.sqrt(Math.random()) * 0.62; const cx = Math.cos(a) * r, cy = Math.sin(a) * r; const d = Math.min(1, ...st.tops.map((t) => Math.hypot(t.x - cx, t.y - cy))); if (d > bestD) { bestD = d; best = [cx, cy]; } }
          [x, y] = best;
        }
        st.tops.push({ e, x: Math.max(-0.7, Math.min(0.7, x)), y: Math.max(-0.7, Math.min(0.7, y)), r: Math.floor(Math.random() * 60 - 30) });
        renderTops();
        const n = counts()[e];
        Jeux.sounds.step(n - 1);
        round.say((PL.FEMININE.has(e) ? ["", "une", "deux", "trois", "quatre", "cinq", "six"] : ["", "un", "deux", "trois", "quatre", "cinq", "six"])[n] || String(n));
        updateBubble();
      }
      const topBtns = {};
      o.tray.forEach((e) => {
        const b = el("button", "ing");
        b.innerHTML = `${e}<small>${PL.LABELS[e]}</small>`;
        Kit.drag(b, {
          ghost: e, enabled: () => !st.baked,
          onMove: (pt) => pizza.classList.toggle("hot", !!inPizza(pt)),
          onDrop: (pt) => { pizza.classList.remove("hot"); const p = inPizza(pt); if (!p) return false; addTop(e, p.x, p.y); return true; },
          onTap: () => addTop(e),
        });
        tray.appendChild(b); topBtns[e] = b;
      });
      const reset = el("button", "act reset", "🔄");
      reset.setAttribute("aria-label", "Recommencer la pizza");
      reset.onclick = () => { if (st.baked) return; st.sauce = []; st.cheese = []; st.tops = []; redraw(); renderTops(); updateBubble(); Jeux.sounds.pop(); };
      const bake = el("button", "act bake", "🔥 Au four !");
      const serve = el("button", "act serve", "🍽️ Servir !");
      serve.style.display = "none";
      tray.append(reset, bake, serve);

      bake.onclick = () => {
        if (st.baked) return;
        if (!st.sauce.length && !st.tops.length) { round.say("La pizza est toute vide ! Commence par la sauce tomate."); round.hint({ from: sauceBtn, to: pizza }); return; }
        const snap = document.createElement("canvas"); snap.width = S; snap.height = S;
        const sc = snap.getContext("2d"); sc.drawImage(canvas, 0, 0, S, S);
        sc.textAlign = "center"; sc.textBaseline = "middle"; sc.font = `${S * 0.11}px serif`;
        st.tops.forEach((t) => sc.fillText(t.e, ((t.x + 1) / 2) * S, ((t.y + 1) / 2) * S));
        const oven = el("div", "oven");
        oven.innerHTML = `<div class="ovenBox"><div class="ovenWin"><img alt="" /><div class="flames">🔥🔥🔥🔥🔥</div></div><div class="bar"><div></div></div></div>`;
        oven.querySelector("img").src = snap.toDataURL();
        document.body.appendChild(oven);
        round.onCleanup(() => oven.remove());
        round.say("Au four ! Ça chauffe !");
        requestAnimationFrame(() => requestAnimationFrame(() => (oven.querySelector(".bar div").style.width = "100%")));
        const crackle = round.interval(() => Jeux.sounds.noise(0.3, { from: 1500, to: 900, q: 0.7, volume: 0.06 }), 300);
        round.timeout(() => {
          clearInterval(crackle);
          Jeux.sounds.ding();
          st.baked = true; pizza.classList.add("baked"); redraw();
          oven.remove();
          bake.style.display = "none"; reset.style.display = "none"; serve.style.display = "";
          round.say("Ding ! La pizza est cuite ! Sers-la vite !");
        }, 2800);
      };
      serve.onclick = () => {
        if (!st.baked || serve.disabled) return;
        serve.disabled = true;
        const { perfect, notes } = PL.judge(o, state());
        face.classList.add("eat");
        pizza.classList.add("gone");
        Jeux.sounds.yum();
        round.timeout(() => {
          face.classList.remove("eat");
          if (perfect) { face.textContent = client + "😋"; round.win(face, "C'est parfait ! Miam miam ! Merci chef !", { praise: false, delay: 3200 }); }
          else { face.textContent = client + "🙂"; round.oops(); round.win(face, `Merci, c'était bon ! Mais ${notes[0]}.`, { praise: false, delay: 4200 }); }
        }, 1400);
      };

      // ---------- aide : la prochaine chose à faire ----------
      round.setHintTarget(() => {
        if (st.baked) return serve;
        const need = PL.nextNeed(o, state());
        if (need === "sauce") return { from: sauceBtn, to: pizza, paint: true };
        if (need === "fromage") return { from: cheeseBtn, to: pizza, paint: true };
        if (need === "four") return bake;
        if (need.add) return { from: topBtns[need.add], to: pizza };
        if (need.remove) { const t = st.tops.find((x) => x.e === need.remove); return t && t.el; }
        return null;
      });
      fit();
      const ro = new ResizeObserver(fit); ro.observe(zone); round.onCleanup(() => ro.disconnect());
      updateBubble();
      round.timeout(() => face.classList.remove("arrive"), 800);
      round.timeout(() => round.say(PL.sentence(o, Jeux.NAME)), round.index === 0 ? 3600 : 700);
    }

    Kit.game({
      id: "pizzeria", title: "La Pizzeria", icon: "🍕",
      bg: "linear-gradient(180deg, #fff1e6 0 62%, #e9c46a 62%)",
      instruction: () => "Écoute la commande du client. Glisse la sauce et le fromage sur la pizza, puis les garnitures. Ensuite, au four !",
      levels: PL.LEVELS,
      start,
    });
  </script>
</body>
</html>
