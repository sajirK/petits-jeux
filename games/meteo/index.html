<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Ma météo du jour</title>
  <link rel="stylesheet" href="../../css/common.css?v=2.0.0-dev" />
  <link rel="stylesheet" href="../../css/tokens.css?v=2.0.0-dev" />
  <link rel="stylesheet" href="../../css/kit.css?v=2.0.0-dev" />
  <style>
    .step { width: 100%; max-width: 760px; flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; overflow-y: auto; padding: 0 8px 12px; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; width: 100%; }
    .emo { border-radius: 22px; padding: 10px 4px; background: #fff; box-shadow: var(--sh-2); min-height: var(--tap-big); display: grid; place-items: center; }
    .emo span { font-size: clamp(44px, 11vmin, 70px); line-height: 1; }
    .emo:active { transform: scale(0.94); }
    .sizes { display: flex; align-items: flex-end; gap: clamp(14px, 4vmin, 30px); }
    .size { background: #fff; border-radius: 24px; padding: 10px 14px; box-shadow: var(--sh-2); display: flex; flex-direction: column; align-items: center; min-width: var(--tap-min); }
    .size span { line-height: 1; }
    .card { background: #fff; border-radius: 28px; padding: 14px 18px; box-shadow: var(--sh-2); text-align: center; width: 100%; }
    .face { width: clamp(110px, 26vmin, 190px); aspect-ratio: 1; display: grid; place-items: center; border-radius: 50%; margin: auto; font-size: clamp(64px, 16vmin, 110px); line-height: 1; animation: weatherJoy .7s cubic-bezier(.2,1.6,.4,1) both; }
    @keyframes weatherJoy { 0% { transform: scale(.35) rotate(-12deg); opacity: .3; } 60% { transform: scale(var(--feeling-size, 1.18)) rotate(6deg); } 100% { transform: scale(1) rotate(0); opacity: 1; } }
    .tips { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 10px; }
    .tip { width: var(--tap-big); height: var(--tap-big); border-radius: 22px; background: #f8f9fa; display: grid; place-items: center; font-size: clamp(36px, 8vmin, 50px); text-decoration: none; }
    a.tip { background: #e7f5ff; border: 3px solid #74c0fc; }
    .adult { margin-top: 10px; font-size: clamp(40px, 9vmin, 56px); background: #fff3bf; border-radius: 16px; padding: 4px 12px; }
    .week { background: #fff; border-radius: 22px; padding: 10px; box-shadow: var(--sh-1); width: 100%; display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
    .day { font-size: clamp(12px, 2.8vmin, 16px); opacity: 0.7; }
    .day span { display: block; font-size: clamp(26px, 6.5vmin, 40px); line-height: 1.2; }
    .day.today { opacity: 1; font-weight: bold; }
  </style>
</head>
<body>
  <script src="../../js/common.js?v=2.0.0-dev"></script>
  <script src="../../js/kit/levels.js?v=2.0.0-dev"></script>
  <script src="../../js/kit/kit.js?v=2.0.0-dev"></script>
  <script src="../../js/emotions.js?v=2.0.0-dev"></script>
  <script src="logic.js?v=2.0.0-dev"></script>
  <script>
    const MT = MeteoLogic, E = Emotions.EMOTIONS;
    const LINKS = { "🎈": "../respire/index.html", "🎨": "../dessin/index.html", "💃": "../piano/index.html" };
    const WEEKDAYS = ["D", "L", "M", "M", "J", "V", "S"];
    const journal = () => { try { return JSON.parse(localStorage.getItem("jeux.meteo") || "{}"); } catch (e) { return {}; } };

    function start(round) {
      const el = Kit.ui.el;
      const step = el("div", "step");
      round.stage.appendChild(step);
      function chooseEmotion(speak = true) {
        step.innerHTML = "";
        const grid = el("div", "grid");
        MT.ORDER.forEach((k) => {
          const b = el("button", "emo");
          b.style.background = E[k].color;
          b.innerHTML = `<span>${E[k].emoji}</span>`;
          b.setAttribute("aria-label", E[k].label);
          b.onclick = () => { Jeux.sounds.pop(); round.say(E[k].label); chooseSize(k); };
          grid.appendChild(b);
        });
        step.appendChild(grid);
        if (speak) round.say("Comment tu te sens aujourd'hui ? Touche le visage qui te ressemble.");
      }
      function chooseSize(k) {
        step.innerHTML = "";
        const sizes = el("div", "sizes");
        MT.SIZES.forEach(([label, scale], i) => {
          const b = el("button", "size");
          b.innerHTML = `<span style="font-size:${scale * 90}px">${E[k].emoji}</span>`;
          b.setAttribute("aria-label", label);
          b.onclick = () => result(k, i);
          sizes.appendChild(b);
        });
        step.appendChild(sizes);
        round.say(`${E[k].label}. Un peu, beaucoup, ou énormément ?`);
      }
      function result(k, intensity, silent = false) {
        const e = E[k], j = journal();
        j[Emotions.todayKey()] = { e: k, i: intensity };
        const keys = Object.keys(j).sort();
        while (keys.length > 60) delete j[keys.shift()];
        localStorage.setItem("jeux.meteo", JSON.stringify(j));
        step.innerHTML = "";
        const card = el("div", "card"), face = el("button", "face", e.emoji);
        face.style.background = e.color; face.style.setProperty("--feeling-size", `${1.12 + intensity * 0.12}`);
        const msg = MT.message(k), tips = el("div", "tips");
        const speech = `${msg} ${e.tips.map((t) => t[1]).join(" ")}${MT.needsAdult(k, intensity) ? " Si c'est très fort, va voir un adulte que tu aimes." : ""}`;
        face.onclick = () => round.say(speech);
        e.tips.forEach(([icon, text]) => {
          const t = el(LINKS[icon] ? "a" : "button", "tip", icon);
          t.setAttribute("aria-label", text);
          if (LINKS[icon]) t.href = LINKS[icon]; else t.onclick = () => round.say(text);
          tips.appendChild(t);
        });
        card.append(face, tips);
        if (MT.needsAdult(k, intensity)) card.appendChild(el("div", "adult", "👨‍👩‍👧"));
        const week = el("div", "week");
        Emotions.lastDays(journal()).forEach((d, i, arr) => {
          const day = el("div", "day" + (i === arr.length - 1 ? " today" : ""));
          day.innerHTML = `<span>${d.entry && E[d.entry.e] ? E[d.entry.e].emoji : "·"}</span>${i === arr.length - 1 ? "★" : WEEKDAYS[d.day]}`;
          week.appendChild(day);
        });
        const again = el("button", "k-btn", "🔁");
        again.setAttribute("aria-label", "Changer");
        again.onclick = () => { Jeux.sounds.click(); chooseEmotion(); };
        step.append(card, week, again);
        if (!silent) { Jeux.sounds.bell(659, 0, 0.18, 1); if (MT.POSITIVE.has(k)) Jeux.confetti(25, [e.emoji, "✨"]); round.say(speech); }
      }
      const today = journal()[Emotions.todayKey()];
      if (today && E[today.e]) result(today.e, today.i || 0, true); else { chooseEmotion(false); round.timeout(() => round.say("Comment tu te sens aujourd'hui ? Touche le visage qui te ressemble."), 2600); }
    }
    Kit.game({
      id: "meteo", title: "Ma météo du jour", icon: "🌤️", mode: "free",
      bg: "linear-gradient(160deg, #fff9db, #e3fafc)",
      instruction: () => "Dis-moi comment tu te sens aujourd'hui. Quand tu as fini, appuie sur le bouton vert.",
      doneText: "Merci de m'avoir dit comment tu te sens !",
      start,
    });
  </script>
</body>
</html>
