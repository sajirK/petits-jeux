<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Que ferais-tu ?</title>
  <link rel="stylesheet" href="../../css/common.css?v=2.0.0" />
  <link rel="stylesheet" href="../../css/tokens.css?v=2.0.0" />
  <link rel="stylesheet" href="../../css/kit.css?v=2.0.0" />
  <style>
    .k-prompt-visual { letter-spacing: 6px; }
    .opts { display: flex; flex-direction: column; gap: 12px; width: min(94vw, 680px); }
    .opt { display: flex; align-items: center; gap: 12px; text-align: left; min-height: var(--tap-big); padding: 8px 14px; border-radius: var(--r-md); background: #fff; box-shadow: var(--sh-2); font-size: var(--fs-md); border-left: 12px solid var(--c); animation: k-in var(--t-slow) var(--ease-bounce) both; }
    .opt .e { font-size: clamp(36px, 8vmin, 52px); flex: none; }
    .opt .t { flex: 1; }
    .opt .listen { flex: none; width: 52px; height: 52px; border-radius: 50%; background: #f1f3f5; font-size: 22px; }
    .opt.k-good { background: var(--c-success-soft); } .opt.k-miss { background: var(--c-soft-error); }
    .why { font-size: var(--fs-md); text-align: center; min-height: 2.6em; margin-top: var(--s-3); max-width: 640px; }
  </style>
</head>
<body>
  <script src="../../js/common.js?v=2.0.0"></script>
  <script src="../../js/kit/levels.js?v=2.0.0"></script>
  <script src="../../js/kit/kit.js?v=2.0.0"></script>
  <script src="../../js/emotions.js?v=2.0.0"></script>
  <script src="logic.js?v=2.0.0"></script>
  <script>
    const COLORS = ["#4dabf7", "#ffa94d", "#b197fc"];
    const NAMES = ["Le bleu", "L'orange", "Le violet"];
    let list = [];
    Kit.game({
      id: "que-faire", title: "Que ferais-tu ?", icon: "🤝",
      bg: "linear-gradient(160deg, #d3f9d8, #c3fae8)",
      instruction: () => "Écoute l'histoire, puis choisis ce que tu ferais. Choisis la réponse la plus gentille !",
      levels: QueFaireLogic.LEVELS,
      start(round) {
        if (round.index === 0) list = QueFaireLogic.stories(round.level);
        const c = list[round.index];
        const readAll = () => round.say(`${c.text} Qu'est-ce que tu ferais ? ${c.options.map((o, i) => `${NAMES[i]} : ${o.t}`).join(" ")}`, { rate: 0.92 });
        Kit.ui.prompt(round.stage, { visual: c.scene, caption: c.text, onTap: readAll });
        const opts = Kit.ui.el("div", "opts");
        const why = Kit.ui.el("div", "why");
        const buttons = c.options.map((o, i) => {
          const b = Kit.ui.el("button", "opt");
          b.style.setProperty("--c", COLORS[i]);
          b.innerHTML = `<span class="e"></span><span class="t"></span><span class="listen" role="button" aria-label="Écouter">🔊</span>`;
          b.querySelector(".e").textContent = o.e;
          b.querySelector(".t").textContent = o.t;
          b.querySelector(".listen").addEventListener("click", (ev) => { ev.stopPropagation(); round.say(o.t); });
          b.onclick = () => {
            why.textContent = (o.good ? "💛 " : "🤔 ") + o.why;
            if (o.good) round.win(b, o.why, { praise: false, delay: 4200 });
            else round.miss(b, o.why);
          };
          opts.appendChild(b);
          return b;
        });
        round.stage.append(opts, why);
        round.setHintTarget(() => buttons[c.options.findIndex((o) => o.good)]);
        round.timeout(readAll, round.index === 0 ? 3600 : 400);
      },
    });
  </script>
</body>
</html>
