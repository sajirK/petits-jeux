<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Le Piano rigolo</title>
  <link rel="stylesheet" href="../../css/common.css?v=2.1.0" />
  <link rel="stylesheet" href="../../css/tokens.css?v=2.1.0" />
  <link rel="stylesheet" href="../../css/kit.css?v=2.1.0" />
  <style>
    .wrap { flex: 1; min-height: 0; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .instr { display: flex; gap: 10px; }
    .instr button { width: var(--tap-min); height: var(--tap-min); border-radius: 50%; background: rgba(255,255,255,0.8); box-shadow: var(--sh-1); font-size: 34px; }
    .instr button.active { background: #ffd166; transform: scale(1.12); }
    .keys { flex: 1; min-height: 0; display: flex; gap: clamp(4px, 1vw, 10px); width: min(98vw, 1100px); padding-bottom: max(14px, env(safe-area-inset-bottom)); touch-action: none; }
    .key { flex: 1; border-radius: 0 0 22px 22px; box-shadow: 0 8px 0 rgba(0,0,0,0.2); display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding-bottom: 16px; font-size: clamp(26px, 6vw, 54px); transition: transform 0.08s, filter 0.08s; min-width: 0; }
    .key.down { transform: translateY(8px); box-shadow: none; filter: brightness(1.2); }
    .note { position: fixed; pointer-events: none; font-size: 40px; animation: fly 1.2s ease-out forwards; z-index: 5; }
    @keyframes fly { to { transform: translateY(-40vh) rotate(30deg); opacity: 0; } }
  </style>
</head>
<body>
  <script src="../../js/common.js?v=2.1.0"></script>
  <script src="../../js/kit/levels.js?v=2.1.0"></script>
  <script src="../../js/kit/kit.js?v=2.1.0"></script>
  <script src="logic.js?v=2.1.0"></script>
  <script>
    const PL = PianoLogic;
    function start(round) {
      const el = Kit.ui.el;
      let instr = PL.INSTRUMENTS[0];
      const wrap = el("div", "wrap"), bar = el("div", "instr"), keys = el("div", "keys");
      wrap.append(bar, keys);
      round.stage.appendChild(wrap);
      PL.INSTRUMENTS.forEach((m, i) => {
        const b = el("button", i ? "" : "active", m.e);
        b.setAttribute("aria-label", m.name);
        b.onclick = () => { instr = m; bar.querySelectorAll("button").forEach((x) => x.classList.toggle("active", x === b)); play(PL.NOTES[4]); };
        bar.appendChild(b);
      });
      function play(note) {
        if (Jeux.isMuted()) return;
        const ac = Jeux.audio(); if (!ac) return;
        const out = Jeux.output(), t = ac.currentTime, g = ac.createGain(), filter = ac.createBiquadFilter();
        filter.type = "lowpass"; filter.frequency.value = instr.type === "sine" || instr.type === "triangle" ? 5000 : 1400;
        filter.connect(g).connect(out);
        const partials = instr.type === "triangle" ? [[1, 1], [2, 0.3], [3, 0.1]] : [[1, 1]];
        for (const [mult, amp] of partials) {
          const o = ac.createOscillator();
          o.type = instr.type === "triangle" ? "sine" : instr.type;
          o.frequency.value = note.f * mult;
          if (instr.vibrato) { const lfo = ac.createOscillator(), lg = ac.createGain(); lfo.frequency.value = 6; lg.gain.value = instr.vibrato; lfo.connect(lg).connect(o.frequency); lfo.start(t); lfo.stop(t + 1.3); }
          const og = ac.createGain(); og.gain.value = amp; o.connect(og).connect(filter); o.start(t); o.stop(t + 1.3);
        }
        const vol = instr.type === "triangle" || instr.type === "sine" ? 0.32 : 0.14;
        g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.2);
      }
      PL.NOTES.forEach((note) => { const k = el("div", "key"); k.style.background = note.c; k.innerHTML = `<span>${note.a}</span>`; k._note = note; keys.appendChild(k); });
      const active = new Map();
      const keyAt = (e) => { const t = document.elementFromPoint(e.clientX, e.clientY); return t && t.closest(".key"); };
      function press(k, e) {
        play(k._note);
        k.classList.add("down"); round.timeout(() => k.classList.remove("down"), 150);
        const n = el("div", "note", ["🎵", "🎶", k._note.a][Math.floor(Math.random() * 3)]);
        n.style.left = e.clientX - 20 + "px"; n.style.top = e.clientY - 40 + "px";
        document.body.appendChild(n); setTimeout(() => n.remove(), 1200);
      }
      keys.addEventListener("pointerdown", (e) => { e.preventDefault(); const k = keyAt(e); active.set(e.pointerId, k); if (k) press(k, e); });
      keys.addEventListener("pointermove", (e) => { if (!active.has(e.pointerId)) return; const k = keyAt(e); if (k && k !== active.get(e.pointerId)) press(k, e); active.set(e.pointerId, k); });
      const stop = (e) => active.delete(e.pointerId);
      keys.addEventListener("pointerup", stop); keys.addEventListener("pointercancel", stop);
    }
    Kit.game({
      id: "piano", title: "Le Piano rigolo", icon: "🎹", mode: "free",
      bg: "linear-gradient(160deg, #ffc6ff, #bdb2ff)",
      instruction: () => "Touche les grandes touches pour jouer de la musique ! Choisis ton instrument en haut.",
      doneText: "Quel joli concert ! Bravo, musicien !",
      start,
    });
  </script>
</body>
</html>
