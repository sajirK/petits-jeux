<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Les histoires d'émotions</title>
  <link rel="stylesheet" href="../../css/common.css?v=2.0.0-dev" />
  <link rel="stylesheet" href="../../css/tokens.css?v=2.0.0-dev" />
  <link rel="stylesheet" href="../../css/kit.css?v=2.0.0-dev" />
  <style>
    .k-prompt-visual { letter-spacing: 6px; }
    .k-choice.face { font-size: clamp(56px, 13vmin, 90px); min-width: clamp(104px, 22vmin, 150px); }
    .tip { font-size: var(--fs-md); text-align: center; min-height: 2.6em; margin-top: var(--s-3); max-width: 640px; color: var(--c-ink-soft); }
  </style>
</head>
<body>
  <script src="../../js/common.js?v=2.0.0-dev"></script>
  <script src="../../js/kit/levels.js?v=2.0.0-dev"></script>
  <script src="../../js/kit/kit.js?v=2.0.0-dev"></script>
  <script src="../../js/emotions.js?v=2.0.0-dev"></script>
  <script src="logic.js?v=2.0.0-dev"></script>
  <script>
    const E = Emotions.EMOTIONS;
    let last = null;
    Kit.game({
      id: "emotion-situations", title: "Les histoires d'émotions", icon: "🤔",
      bg: "linear-gradient(160deg, #e7f5ff, #e5dbff)",
      instruction: () => "Écoute l'histoire. Comment se sent le personnage ?",
      levels: EmotionSituationsLogic.LEVELS,
      start(round) {
        const q = EmotionSituationsLogic.question(round.level, Math.random, last);
        last = q.situation.text;
        const s = q.situation;
        const story = `${s.text} Comment se sent ${s.who} ?`;
        Kit.ui.prompt(round.stage, { visual: s.scene, caption: s.text, onTap: () => round.say(story) });
        const tip = Kit.ui.el("div", "tip");
        const buttons = Kit.ui.choices(round.stage, q.options, {
          cls: "face",
          render(k, b) { b.innerHTML = `<span>${E[k].emoji}</span><small>${E[k].label}</small>`; },
          onPick(k, b) {
            if (k === q.answer) {
              const why = Emotions.sentence(s, k);
              const help = E[k].tips[Math.floor(Math.random() * E[k].tips.length)];
              tip.textContent = `${help[0]} ${help[1]}`;
              round.win(b, `Oui ! ${why} ${help[1]}`, { praise: false, delay: 5200 });
            } else round.miss(b, `Hmm… ${Emotions.isItQuestion(s, k)} Je ne crois pas. Écoute encore : ${s.text}`);
          },
        });
        round.stage.appendChild(tip);
        round.setHintTarget(() => buttons[q.options.indexOf(q.answer)]);
        round.timeout(() => round.say(story), round.index === 0 ? 2800 : 350);
      },
    });
  </script>
</body>
</html>
