<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>La Boulangerie des nombres</title>
  <link rel="stylesheet" href="../../css/common.css?v=2.0.0" />
  <link rel="stylesheet" href="../../css/tokens.css?v=2.0.0" />
  <link rel="stylesheet" href="../../css/kit.css?v=2.0.0" />
  <style>
    .client { display: flex; align-items: center; gap: 12px; margin-bottom: var(--s-2); }
    .client .face { font-size: clamp(54px, 13vmin, 90px); line-height: 1; animation: arrive 0.6s var(--ease-out); }
    @keyframes arrive { from { transform: translateX(-50vw); } }
    .order { background: #fff; border-radius: var(--r-lg); padding: 6px 18px; box-shadow: var(--sh-2); text-align: center; cursor: pointer; }
    .order b { font-size: clamp(40px, 10vmin, 66px); line-height: 1.1; }
    .boxes { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; padding: 10px; border-radius: var(--r-lg); transition: background var(--t-med); }
    .boxes.k-zone-hot { background: rgba(81, 207, 102, 0.18); }
    .box { background: #a0522d; border-radius: 16px; padding: 8px; box-shadow: 0 6px 0 rgba(0,0,0,0.18); display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
    .cell { width: clamp(34px, 8.5vmin, 58px); aspect-ratio: 1; border-radius: 10px; background: #f8e1c4; display: grid; place-items: center; font-size: clamp(22px, 6vmin, 38px); }
    .cell.full { animation: k-in 0.25s var(--ease-bounce); cursor: pointer; }
    .count { font-size: var(--fs-md); min-height: 1.5em; text-align: center; margin: 4px 0; }
    .count b { font-size: 1.6em; }
    .tools { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; align-items: center; margin-top: var(--s-2); }
    .src { width: var(--tap-big); height: var(--tap-big); border-radius: 50%; background: #fff; box-shadow: var(--sh-2); font-size: clamp(40px, 9vmin, 60px); display: grid; place-items: center; cursor: grab; }
    .src.ten { border-radius: var(--r-md); width: auto; padding: 0 16px; font-size: var(--fs-lg); background: #ffd8a8; }
    .tray { min-height: clamp(76px, 15vmin, 100px); min-width: min(88vw, 520px); background: #e9ecef; border-radius: var(--r-lg); padding: 8px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; border: 4px dashed #ced4da; transition: background var(--t-med); }
    .tray.k-zone-hot { background: #d3f9d8; }
    .coin { width: clamp(64px, 14vmin, 86px); aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; font-weight: bold; font-size: clamp(18px, 4.4vmin, 26px); color: #5c3c00; box-shadow: 0 5px 0 rgba(0,0,0,0.2); cursor: grab; }
    .coin.c1 { background: radial-gradient(circle, #dee2e6 0 52%, #e0b84c 54%); }
    .coin.c2 { background: radial-gradient(circle, #e0b84c 0 52%, #dee2e6 54%); }
    .coin.c5, .coin.c10, .coin.c20 { border-radius: 10px; width: clamp(96px, 22vmin, 130px); aspect-ratio: 1.8; background: linear-gradient(135deg, #b2c9b0, #8fb08c); color: #2b4a2a; }
    .coin.c10 { background: linear-gradient(135deg, #f4b6b6, #e08a8a); color: #5a1d1d; }
    .coin.c20 { background: linear-gradient(135deg, #a5c8f0, #6f9fd8); color: #13325a; }
    .tray .coin { animation: k-in 0.25s var(--ease-bounce); cursor: pointer; }
  </style>
</head>
<body>
  <script src="../../js/common.js?v=2.0.0"></script>
  <script src="../../js/kit/levels.js?v=2.0.0"></script>
  <script src="../../js/kit/kit.js?v=2.0.0"></script>
  <script src="logic.js?v=2.0.0"></script>
  <script>
const stepOf = (round) => { const a = round.cfg.internal; return a[Math.min(a.length - 1, Math.floor((round.index * a.length) / round.rounds))]; };
    const BL = BoulangerieLogic;
    let last = null;
    Kit.game({
      id: "boulangerie", title: "La Boulangerie des nombres", icon: "🥐",
      bg: "linear-gradient(180deg, #fff4e6 0 62%, #e8c39e 62%)",
      instruction: (cfg, lv) => lv === 3 ? "Le client doit payer. Glisse les pièces dans le plateau, puis appuie sur Payer !" : "Écoute le client, et mets le bon nombre dans les boîtes, puis appuie sur Donner !",
      levels: BL.LEVELS,
      start(round) {
        const q = BL.generate(stepOf(round), Math.random, last);
        last = q.n || q.price;
        const stage = round.stage;
        const client = Kit.ui.el("div", "client");
        client.innerHTML = `<div class="face">${q.client}</div>`;
        const order = Kit.ui.el("button", "order");
        order.onclick = () => round.say(q.speech);
        client.appendChild(order);
        stage.appendChild(client);
        if (q.mode === "pay") return pay(round, q, order);
        order.innerHTML = `<b>${q.n} ${q.pastry.e}</b>`;
        const boxes = Kit.ui.el("div", "boxes");
        const count = Kit.ui.el("div", "count");
        const tools = Kit.ui.el("div", "tools");
        stage.append(boxes, count, tools);
        let have = 0;
        const max = q.tens ? 20 : 10;
        function render() {
          boxes.innerHTML = "";
          for (let b = 0; b < (q.tens || have > 10 ? 2 : 1); b++) {
            const box = Kit.ui.el("div", "box");
            for (let i = 0; i < 10; i++) {
              const k = b * 10 + i;
              const c = Kit.ui.el("div", "cell" + (k < have ? " full" : ""), k < have ? q.pastry.e : "");
              if (k < have) c.onclick = () => { have--; Jeux.sounds.pop(); render(); };
              box.appendChild(c);
            }
            boxes.appendChild(box);
          }
          const tens = Math.floor(have / 10), ones = have % 10;
          count.innerHTML = have === 0 ? "" : `<b>${have}</b>` + (have >= 10 ? ` = ${tens} boîte${tens > 1 ? "s" : ""} de 10${ones ? ` et ${ones}` : ""}` : "");
        }
        function add(n) {
          if (n === 10 && have % 10 !== 0) { round.say("Une boîte de 10, ça va dans une boîte vide !"); return; }
          if (have + n > max) { round.say("Les boîtes sont pleines !"); return; }
          have += n;
          Jeux.sounds.step(Math.min(11, (have - 1) % 12));
          round.say(n === 10 ? `Une boîte de 10 ! Ça fait ${have}.` : String(have), { rate: 1 });
          render();
        }
        const hot = (pt) => boxes.classList.toggle("k-zone-hot", Kit.over(boxes, pt, 20));
        const one = Kit.ui.el("button", "src", q.pastry.e);
        Kit.drag(one, { onMove: hot, onDrop: (pt) => { boxes.classList.remove("k-zone-hot"); if (!Kit.over(boxes, pt, 20)) return false; add(1); return true; }, onTap: () => add(1) });
        tools.appendChild(one);
        let ten = null;
        if (q.tens) {
          ten = Kit.ui.el("button", "src ten", "📦 10");
          Kit.drag(ten, { ghost: "📦", onMove: hot, onDrop: (pt) => { boxes.classList.remove("k-zone-hot"); if (!Kit.over(boxes, pt, 20)) return false; add(10); return true; }, onTap: () => add(10) });
          tools.appendChild(ten);
        }
        const give = Kit.ui.el("button", "k-btn primary", "🛍️ Donner");
        give.onclick = () => {
          const fb = BL.feedback(q.n, have, q.pastry);
          if (fb.ok) round.win(give, fb.text + (q.n >= 10 ? " " + BL.decompose(q.n) : ""), { praise: false, delay: 3400 });
          else round.miss(give, fb.text);
        };
        tools.appendChild(give);
        render();
        round.setHintTarget(() => (have < q.n ? (ten && q.n - have >= 10 && have % 10 === 0 ? ten : one) : have > q.n ? boxes.querySelectorAll(".cell.full")[have - 1] : give));
        round.timeout(() => round.say(q.speech), round.index === 0 ? 3400 : 500);
      },
    });

    function pay(round, q, order) {
      order.innerHTML = `<b>${q.price} €</b>`;
      const tray = Kit.ui.el("div", "tray");
      const count = Kit.ui.el("div", "count");
      const tools = Kit.ui.el("div", "tools");
      round.stage.append(tray, count, tools);
      const given = [];
      const coin = (v) => { const c = Kit.ui.el("button", `coin c${v}`, `${v} €`); return c; };
      function render() {
        tray.innerHTML = "";
        given.forEach((v, i) => { const c = coin(v); c.onclick = () => { given.splice(i, 1); Jeux.sounds.pop(); render(); }; tray.appendChild(c); });
        const s = BL.sum(given);
        count.innerHTML = s ? `<b>${s} €</b>` : "";
      }
      function give(v) { if (BL.sum(given) + v > 70) return; given.push(v); Jeux.sounds.tone(1200, 0.06, "sine", 0.15); round.say(`${v} euro${v > 1 ? "s" : ""}`); render(); }
      const wallet = {};
      q.coins.forEach((v) => {
        const c = coin(v);
        Kit.drag(c, { onMove: (pt) => tray.classList.toggle("k-zone-hot", Kit.over(tray, pt, 20)), onDrop: (pt) => { tray.classList.remove("k-zone-hot"); if (!Kit.over(tray, pt, 20)) return false; give(v); return true; }, onTap: () => give(v) });
        tools.appendChild(c);
        wallet[v] = c;
      });
      const payBtn = Kit.ui.el("button", "k-btn primary", "💶 Payer");
      payBtn.onclick = () => { const fb = BL.payFeedback(q.price, given); if (fb.ok) round.win(payBtn, fb.text, { praise: false, delay: 2800 }); else round.miss(payBtn, fb.text); };
      tools.appendChild(payBtn);
      render();
      round.setHintTarget(() => { const s = BL.sum(given); if (s === q.price) return payBtn; if (s > q.price) return tray.lastElementChild; return wallet[BL.bestCoin(q.price - s, q.coins)]; });
      round.timeout(() => round.say(q.speech), round.index === 0 ? 3400 : 500);
    }
  </script>
</body>
</html>
