<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Mon jardin</title>
  <link rel="stylesheet" href="../../css/common.css?v=2.1.0" />
  <link rel="stylesheet" href="../../css/tokens.css?v=2.1.0" />
  <link rel="stylesheet" href="../../css/kit.css?v=2.1.0" />
  <style>
    .wrap { flex: 1; min-height: 0; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(10px, 3vmin, 26px); }
    .basket { background: #fff; border-radius: 999px; padding: 6px 16px; box-shadow: var(--sh-1); font-size: clamp(18px, 4vmin, 26px); min-height: 1.5em; }
    .pots { display: flex; gap: clamp(12px, 4vmin, 40px); justify-content: center; align-items: flex-end; }
    .pot { display: flex; flex-direction: column; align-items: center; padding: 8px; border-radius: 24px; transition: background 0.2s; position: relative; min-width: var(--tap-min); }
    .pot.sel { background: rgba(255,255,255,0.55); outline: 4px solid #fab005; }
    .pot.k-zone-hot { background: rgba(81, 207, 102, 0.3); }
    .pot.done { opacity: 0.75; }
    .sky { height: clamp(36px, 8vmin, 54px); font-size: clamp(30px, 7vmin, 46px); }
    .plant { font-size: clamp(60px, 15vmin, 104px); line-height: 1; height: clamp(74px, 18vmin, 120px); display: flex; align-items: flex-end; }
    .plant.grow { animation: grow 0.8s cubic-bezier(.3,1.6,.6,1); }
    @keyframes grow { from { transform: scale(0.4); } }
    .plant.droop { animation: droop 0.6s; }
    @keyframes droop { 50% { transform: rotate(-12deg) translateY(6px); } }
    .plant.ready { animation: ripe 1s ease-in-out infinite; }
    @keyframes ripe { 50% { transform: scale(1.12) rotate(4deg); } }
    .soil { width: clamp(96px, 22vmin, 150px); height: clamp(48px, 11vmin, 74px); border-radius: 0 0 26px 26px; background: linear-gradient(#8d5524 0 22%, #c06c3e 22%); display: grid; place-items: center; font-size: clamp(26px, 6vmin, 40px); }
    .water { height: 22px; font-size: 18px; margin-top: 4px; }
    .drop { position: absolute; top: 30px; font-size: 26px; animation: fall 0.7s ease-in forwards; pointer-events: none; }
    @keyframes fall { to { transform: translateY(70px); opacity: 0; } }
    .tools { display: flex; gap: 16px; }
    .tool { width: clamp(76px, 15vmin, 100px); height: clamp(76px, 15vmin, 100px); border-radius: 24px; background: #fff; box-shadow: var(--sh-2); font-size: clamp(38px, 8vmin, 54px); touch-action: none; }
  </style>
</head>
<body>
  <script src="../../js/common.js?v=2.1.0"></script>
  <script src="../../js/kit/levels.js?v=2.1.0"></script>
  <script src="../../js/kit/kit.js?v=2.1.0"></script>
  <script src="logic.js?v=2.1.0"></script>
  <script>
    const JL = JardinLogic;
    const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
    const loadBasket = () => { try { return JSON.parse(localStorage.getItem("jeux.jardin.panier") || "{}"); } catch (e) { return {}; } };

    function start(round) {
      const el = Kit.ui.el, cfg = round.cfg;
      const pots = JL.potsFor(round.level);
      const done = pots.map(() => false);
      let sel = 0;
      const basket = loadBasket();
      const wrap = el("div", "wrap");
      const basketEl = el("div", "basket");
      const potsEl = el("div", "pots");
      const tools = el("div", "tools");
      const waterBtn = el("button", "tool", "💧"), sunBtn = el("button", "tool", "☀️");
      waterBtn.setAttribute("aria-label", "Arroser"); sunBtn.setAttribute("aria-label", "Soleil");
      tools.append(waterBtn, sunBtn);
      wrap.append(basketEl, potsEl, tools);
      round.stage.appendChild(wrap);

      const needText = (p) => {
        const n = JL.needs(p), name = cap(JL.PLANTS[p.type].name);
        if (n === "récolter") return `${name} est prête ! Touche-la pour la cueillir !`;
        if (n === "eau et soleil") return `${name} a besoin d'eau et de soleil.`;
        if (n === "eau") return `${name} a eu du soleil. Maintenant, un peu d'eau !`;
        return `${name} a bu. Maintenant, il lui faut du soleil !`;
      };
      const potEls = pots.map((p, i) => {
        const d = el("button", "pot");
        d.onclick = () => tapPot(i);
        potsEl.appendChild(d);
        return d;
      });
      function render(i, anim) {
        const p = pots[i], plant = JL.PLANTS[p.type], d = potEls[i];
        d.classList.toggle("sel", i === sel && pots.length > 1 && !done[i]);
        d.classList.toggle("done", done[i]);
        const above = done[i] ? "✅" : plant.underground && p.stage === 4 ? "🌿" : p.stage === 0 ? "" : plant.stages[p.stage];
        d.innerHTML = `<div class="sky">${done[i] ? "" : p.sun ? "☀️" : p.stage < 4 ? "☁️" : ""}</div>
          <div class="plant${anim ? " " + anim : ""}${p.stage === 4 && !done[i] ? " ready" : ""}">${above}</div>
          <div class="soil">${p.stage === 0 && !done[i] ? "🟤" : plant.underground && p.stage >= 3 && !done[i] ? "🥕" : plant.seed}</div>
          <div class="water">${"💧".repeat(p.water)}</div>`;
      }
      const renderAll = () => pots.forEach((_, i) => render(i));
      const renderBasket = () => { const items = Object.entries(basket).map(([e, n]) => `${e} ${n}`).join("  "); basketEl.textContent = "🧺 " + (items || ""); };
      function select(i) { sel = i; renderAll(); }

      function act(kind, i) {
        if (round.ended || done[i]) return;
        select(i);
        const p = pots[i];
        if (p.stage >= 4) { round.say(needText(p)); round.hint(potEls[i]); return; }
        const res = kind === "eau" ? JL.water(p) : JL.sun(p);
        if (!res.ok) {
          if (kind === "eau") render(i, "droop");
          if (kind === "eau" && cfg.strict) round.miss(potEls[i], res.msg);
          else { Jeux.sounds.wrong(); round.say(`${res.msg} ${needText(p)}`); }
          return;
        }
        if (kind === "eau") {
          Jeux.sounds.noise(0.5, { from: 2000, to: 1200, q: 1, volume: 0.1 });
          for (let k = 0; k < 3; k++) { const dr = el("div", "drop", "💧"); dr.style.left = 25 + k * 22 + "%"; dr.style.animationDelay = k * 0.1 + "s"; potEls[i].appendChild(dr); round.timeout(() => dr.remove(), 900); }
        } else Jeux.sounds.bell(880, 0, 0.12, 0.8);
        if (res.grew) {
          round.timeout(() => { render(i, "grow"); Jeux.sounds.success(); round.burst(potEls[i]); round.say(p.stage === 4 ? "Bravo ! Elle est prête à cueillir ! Touche-la !" : `Elle grandit ! ${needText(p)}`); }, kind === "eau" ? 500 : 0);
        } else { round.timeout(() => render(i), kind === "eau" ? 500 : 0); round.say(`${res.msg} ${needText(p)}`); }
      }
      function tapPot(i) {
        if (round.ended || done[i]) return;
        const p = pots[i];
        if (p.stage < 4) { select(i); round.say(needText(p)); return; }
        const plant = JL.PLANTS[p.type];
        const h = JL.harvest(p);
        done[i] = true;
        basket[h.e] = (basket[h.e] || 0) + h.count;
        localStorage.setItem("jeux.jardin.panier", JSON.stringify(basket));
        renderBasket(); render(i);
        Jeux.confetti(20, [h.e, "✨", "🌱"]);
        const next = done.indexOf(false);
        if (next < 0) round.win(potEls[i], `Bravo ! ${plant.fact}`, { praise: false, delay: 4800 });
        else { Jeux.sounds.success(); round.burst(potEls[i]); round.say(`Miam ! ${plant.fact}`); select(next); }
      }
      const potAt = (pt) => potEls.findIndex((d, i) => !done[i] && Kit.over(d, pt, 10));
      for (const [btn, kind] of [[waterBtn, "eau"], [sunBtn, "soleil"]]) {
        Kit.drag(btn, {
          onMove: (pt) => { const k = potAt(pt); potEls.forEach((d, i) => d.classList.toggle("k-zone-hot", i === k)); },
          onDrop: (pt) => { potEls.forEach((d) => d.classList.remove("k-zone-hot")); const k = potAt(pt); if (k < 0) return false; act(kind, k); return true; },
          onTap: () => act(kind, done[sel] ? done.indexOf(false) : sel),
        });
      }
      round.setHintTarget(() => {
        const i = done.indexOf(false);
        if (i < 0) return null;
        const a = JL.nextAction(pots[i]);
        return a === "cueillir" ? potEls[i] : { from: a === "eau" ? waterBtn : sunBtn, to: potEls[i] };
      });
      renderAll(); renderBasket();
      const intro = pots.length === 1 ? `On plante ${JL.PLANTS[pots[0].type].name} ! Donne-lui de l'eau et du soleil pour qu'elle grandisse.` : `${pots.length} pots à faire pousser ! Glisse l'eau et le soleil sur chaque plante.`;
      round.timeout(() => round.say(intro), round.index === 0 ? 3200 : 400);
    }

    Kit.game({
      id: "jardin", title: "Mon jardin", icon: "🌱",
      bg: "linear-gradient(180deg, #a5d8ff 0 55%, #8ce99a 55%)",
      instruction: (cfg) => "Une plante a besoin d'eau et de soleil pour grandir. Glisse l'arrosoir et le soleil sur le pot, puis cueille la plante !" + (cfg.strict ? " Attention, pas trop d'eau !" : ""),
      levels: JL.LEVELS,
      start,
    });
  </script>
</body>
</html>
