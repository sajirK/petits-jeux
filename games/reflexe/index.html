<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Réflexe Éclair</title>
  <link rel="stylesheet" href="../../css/common.css?v=2.1.0" />
  <link rel="stylesheet" href="../../css/tokens.css?v=2.1.0" />
  <link rel="stylesheet" href="../../css/kit.css?v=2.1.0" />
  <style>
    .arena { position: absolute; inset: 0 0 90px 0; touch-action: none; }
    .item { position: absolute; transform: translate(-50%, -50%); width: var(--sz); height: var(--sz); border-radius: 50%; display: grid; place-items: center; font-size: calc(var(--sz) * 0.62); font-weight: bold; background: rgba(255,255,255,0.92); box-shadow: 0 6px 0 rgba(0,0,0,0.15); animation: pop-in 0.18s ease-out; }
    .item.balloon { border-radius: 50% 50% 48% 48% / 56% 56% 44% 44%; box-shadow: inset -8px -10px 0 rgba(0,0,0,0.15); }
    .item.digit { color: #3a0ca3; font-family: "Arial Rounded MT Bold", "Comic Sans MS", sans-serif; }
    @keyframes pop-in { from { transform: translate(-50%, -50%) scale(0.2); } }
    .item.hit { animation: hit 0.3s forwards; }
    @keyframes hit { to { transform: translate(-50%, -50%) scale(1.5); opacity: 0; } }
    .item.oops { background: #ff6b6b; animation: sh 0.3s; }
    @keyframes sh { 25% { margin-left: -8px; } 75% { margin-left: 8px; } }
    .rule { position: absolute; left: 50%; bottom: max(12px, env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; gap: 14px; align-items: center; background: #fff; border-radius: 999px; padding: 6px 18px; box-shadow: var(--sh-2); font-size: clamp(28px, 6vmin, 40px); min-height: var(--tap-min); white-space: nowrap; }
    .rule .yes, .rule .no { display: flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 999px; }
    .rule .yes { background: var(--c-success-soft); }
    .rule .no { background: #ffe3e3; position: relative; }
    .rule .dot { width: 1em; height: 1em; border-radius: 50%; display: inline-block; }
    .rule.change { animation: k-in 0.5s var(--ease-bounce); }
  </style>
</head>
<body>
  <script src="../../js/common.js?v=2.1.0"></script>
  <script src="../../js/kit/levels.js?v=2.1.0"></script>
  <script src="../../js/kit/kit.js?v=2.1.0"></script>
  <script src="logic.js?v=2.1.0"></script>
  <script>
    const RL = ReflexeLogic;
    const BALLOON = { red: "#e63946", blue: "#1d70f5", green: "#2dc653", yellow: "#ffd60a" };
    const show = (rule, v) => rule.balloons ? `<span class="dot" style="background:${BALLOON[v]}"></span>` : v;

    function start(round) {
      const cfg = round.cfg, el = Kit.ui.el;
      const meter = round.meter("⚡", cfg.goal);
      const arena = el("div", "arena");
      const ruleEl = el("button", "rule");
      round.stage.append(arena, ruleEl);
      let rule = RL.ruleFor(round.level), hits = 0, items = [], running = false;
      function showRule() {
        ruleEl.innerHTML = `<span class="yes">👆 ${rule.go.slice(0, 3).map((v) => show(rule, v)).join("")}</span><span class="no">🚫 ${rule.nogo.slice(0, 3).map((v) => show(rule, v)).join("")}</span>`;
        ruleEl.classList.remove("change"); void ruleEl.offsetWidth; ruleEl.classList.add("change");
      }
      ruleEl.onclick = () => round.say(rule.say);
      showRule();
      function freeSpot(size) {
        const W = arena.clientWidth, H = arena.clientHeight;
        for (let k = 0; k < 30; k++) {
          const x = size / 2 + 10 + Math.random() * Math.max(10, W - size - 20);
          const y = size / 2 + 10 + Math.random() * Math.max(10, H - size - 20);
          if (items.every((it) => Math.hypot(it.x - x, it.y - y) > size * 1.1)) return [x, y];
        }
        return null;
      }
      function remove(o) { o.el.remove(); items = items.filter((x) => x !== o); }
      function spawn() {
        if (!running) return;
        const size = Math.max(76, Math.min(130, Math.min(arena.clientWidth, arena.clientHeight) * 0.2));
        const spot = freeSpot(size);
        if (spot) {
          const it = RL.nextItem(rule, Math.random, cfg.goRatio);
          const e = el("button", "item");
          e.style.setProperty("--sz", size + "px");
          e.style.left = spot[0] + "px"; e.style.top = spot[1] + "px";
          if (rule.balloons) { e.classList.add("balloon"); e.style.background = BALLOON[it.value]; }
          else { if (rule.digits) e.classList.add("digit"); e.textContent = it.value; }
          const o = { el: e, x: spot[0], y: spot[1], go: it.go };
          e.addEventListener("pointerdown", (ev) => { ev.preventDefault(); tap(o); });
          arena.appendChild(e); items.push(o);
          round.timeout(() => { if (!o.done) remove(o); }, cfg.life);
        }
        round.timeout(spawn, cfg.gap * (0.8 + Math.random() * 0.4));
      }
      function tap(o) {
        if (!running || o.done || round.ended) return;
        o.done = true;
        if (!o.go) { round.oops(); Jeux.sounds.wrong(); o.el.classList.add("oops"); round.timeout(() => remove(o), 350); round.say(rule.say); return; }
        Jeux.sounds.pop();
        round.burst(o.el);
        o.el.classList.add("hit");
        round.timeout(() => remove(o), 300);
        hits++; meter.set(hits);
        if (hits >= cfg.goal) { running = false; round.timeout(() => round.end({ text: "Quels réflexes ! Bravo !" }), 400); return; }
        if (cfg.switchAt && hits % cfg.switchAt === 0) {
          running = false;
          items.slice().forEach(remove);
          rule = RL.ruleFor(round.level, Math.random, rule.id);
          showRule();
          round.say(`Attention, on change ! ${rule.say}`);
          round.timeout(() => { running = true; spawn(); }, 3200);
        }
      }
      round.setHintTarget(() => { const o = items.find((x) => x.go && !x.done); return o && o.el; });
      round.timeout(() => round.say(rule.say), round.level === 1 ? 2600 : 2800);
      round.timeout(() => { running = true; spawn(); }, 5200);
    }

    Kit.game({
      id: "reflexe", title: "Réflexe Éclair", icon: "⚡", mode: "arcade",
      bg: "linear-gradient(160deg, #ffe066, #f77f00)",
      instruction: () => "Touche seulement ce qu'on te demande. Le reste, on n'y touche pas !",
      levels: RL.LEVELS,
      start,
    });
  </script>
</body>
</html>
