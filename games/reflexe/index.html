<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Réflexe Éclair</title>
  <link rel="stylesheet" href="../../css/common.css" />
  <style>
    html, body { height: 100%; overflow: hidden; }
    body { background: linear-gradient(160deg, #ffe066, #f77f00); }
    #hud {
      position: fixed; top: max(14px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
      display: flex; gap: 8px; z-index: 10; pointer-events: none; flex-wrap: wrap; justify-content: center; width: calc(100% - 180px);
    }
    .pill { background: #fff; border-radius: 999px; padding: 4px 14px; font-size: clamp(16px, 3.8vmin, 24px); box-shadow: var(--shadow); white-space: nowrap; }
    #arena { position: fixed; inset: 0; touch-action: none; }
    .item {
      position: absolute; transform: translate(-50%, -50%);
      width: var(--sz); height: var(--sz); border-radius: 50%;
      display: grid; place-items: center;
      font-size: calc(var(--sz) * 0.62); font-weight: bold;
      background: rgba(255,255,255,0.9); box-shadow: 0 6px 0 rgba(0,0,0,0.15);
      animation: pop-in 0.18s ease-out;
    }
    .item.balloon { border-radius: 50% 50% 48% 48% / 56% 56% 44% 44%; box-shadow: inset -8px -10px 0 rgba(0,0,0,0.15); }
    .item.digit { color: #3a0ca3; font-family: "Arial Rounded MT Bold", "Comic Sans MS", sans-serif; }
    @keyframes pop-in { from { transform: translate(-50%, -50%) scale(0.2); } }
    .item.hit { animation: hit 0.3s forwards; }
    @keyframes hit { to { transform: translate(-50%, -50%) scale(1.5); opacity: 0; } }
    .item.oops { background: #ff6b6b; animation: shake 0.3s; }
    .float { position: fixed; pointer-events: none; font-size: 26px; font-weight: bold; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.4); animation: up 0.9s forwards; z-index: 20; }
    @keyframes up { to { transform: translateY(-50px); opacity: 0; } }
    #overlay {
      position: fixed; inset: 0; z-index: 30; background: rgba(60, 20, 0, 0.45);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 20px; text-align: center; color: #fff;
      overflow-y: auto;
    }
    #overlay h2 { margin: 0; font-size: clamp(30px, 7vmin, 54px); }
    #overlay p { margin: 0; font-size: clamp(16px, 4vmin, 24px); }
    #rules { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-width: 700px; }
    #rules .big-btn { color: var(--ink); font-size: clamp(16px, 3.8vmin, 24px); }
    #overlay.hidden { display: none; }
    #ruleBanner { position: fixed; bottom: max(14px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); z-index: 10; pointer-events: none; }
  </style>
</head>
<body>
  <div id="arena"></div>
  <div id="hud"><div class="pill" id="time">⏱️ 30</div><div class="pill" id="score">⚡ 0</div><div class="pill" id="speed">🐆 –</div></div>
  <div class="pill" id="ruleBanner"></div>
  <div id="overlay">
    <h2 id="otitle">⚡ Réflexe Éclair</h2>
    <p id="otext">Touche vite ce qu'on te demande... mais pas le reste !</p>
    <div id="rules"></div>
  </div>

  <script src="../../js/common.js"></script>
  <script src="logic.js"></script>
  <script>
    Jeux.addHomeButton();
    const { sounds, say, confetti, bravo, pick } = Jeux;
    const R = ReflexeLogic;
    const arena = document.getElementById("arena");
    const overlay = document.getElementById("overlay");
    const BALLOON = { red: "#e63946", blue: "#1d70f5", green: "#2dc653", yellow: "#ffd60a" };
    let rule, score = 0, timeLeft = 30, running = false, items = [], times = [], hits = 0, spawnTimer = null, clock = null;

    // écran de choix des règles
    const rulesEl = document.getElementById("rules");
    R.RULES.forEach((r) => {
      const b = document.createElement("button");
      b.className = "big-btn";
      b.textContent = r.short;
      b.onclick = () => start(r);
      rulesEl.appendChild(b);
    });

    function best(id) { return parseInt(localStorage.getItem(`jeux.reflexe.${id}`) || "0", 10); }

    function start(r) {
      rule = r;
      score = 0; timeLeft = 30; hits = 0; times = [];
      items.forEach((it) => it.el.remove());
      items = [];
      overlay.classList.add("hidden");
      document.getElementById("ruleBanner").textContent = r.short;
      updateHud();
      say(r.say);
      // petit compte à rebours avant de commencer
      setTimeout(() => {
        running = true;
        spawn();
        clock = setInterval(() => {
          timeLeft--;
          updateHud();
          if (timeLeft <= 0) end();
        }, 1000);
      }, 2600);
    }

    function updateHud() {
      document.getElementById("time").textContent = "⏱️ " + timeLeft;
      document.getElementById("score").textContent = "⚡ " + score;
      const avg = R.average(times);
      document.getElementById("speed").textContent = "🐆 " + (avg ? (avg / 1000).toFixed(2).replace(".", ",") + " s" : "–");
    }

    function freeSpot(size) {
      // évite le haut (boutons) et le bas (consigne), et les autres objets
      const top = 110, bottom = innerHeight - 70;
      for (let k = 0; k < 30; k++) {
        const x = size / 2 + 10 + Math.random() * (innerWidth - size - 20);
        const y = top + size / 2 + Math.random() * Math.max(10, bottom - top - size);
        if (items.every((it) => Math.hypot(it.x - x, it.y - y) > size * 1.1)) return [x, y];
      }
      return null;
    }

    function spawn() {
      if (!running) return;
      const size = Math.max(70, Math.min(130, Math.min(innerWidth, innerHeight) * 0.17));
      const spot = freeSpot(size);
      if (spot) {
        const item = R.nextItem(rule);
        const el = document.createElement("button");
        el.className = "item";
        el.style.setProperty("--sz", size + "px");
        el.style.left = spot[0] + "px";
        el.style.top = spot[1] + "px";
        if (rule.balloons) { el.classList.add("balloon"); el.style.background = BALLOON[item.value]; }
        else if (rule.digits) { el.classList.add("digit"); el.textContent = item.value; }
        else el.textContent = item.value;
        const obj = { el, x: spot[0], y: spot[1], go: item.go, born: performance.now() };
        el.addEventListener("pointerdown", (e) => { e.preventDefault(); tap(obj, e); });
        arena.appendChild(el);
        items.push(obj);
        obj.timer = setTimeout(() => remove(obj), R.lifetime(hits));
      }
      // le rythme accélère un peu avec les points
      spawnTimer = setTimeout(spawn, Math.max(450, 900 - hits * 12));
    }

    function remove(obj) {
      clearTimeout(obj.timer);
      obj.el.remove();
      items = items.filter((o) => o !== obj);
    }

    function floatText(x, y, text) {
      const f = document.createElement("div");
      f.className = "float";
      f.textContent = text;
      f.style.left = x - 20 + "px";
      f.style.top = y - 40 + "px";
      document.body.appendChild(f);
      setTimeout(() => f.remove(), 900);
    }

    function tap(obj, e) {
      if (!running || obj.done) return;
      obj.done = true;
      score = R.score(score, obj.go);
      if (obj.go) {
        const ms = performance.now() - obj.born;
        times.push(ms);
        hits++;
        sounds.pop();
        floatText(e.clientX, e.clientY, (ms / 1000).toFixed(2).replace(".", ",") + " s");
        obj.el.classList.add("hit");
        setTimeout(() => remove(obj), 300);
      } else {
        sounds.wrong();
        floatText(e.clientX, e.clientY, "Oups !");
        obj.el.classList.add("oops");
        setTimeout(() => remove(obj), 350);
      }
      updateHud();
    }

    function end() {
      running = false;
      clearInterval(clock);
      clearTimeout(spawnTimer);
      items.forEach((o) => remove(o));
      const avg = R.average(times);
      const record = score > best(rule.id);
      if (record) localStorage.setItem(`jeux.reflexe.${rule.id}`, score);
      if (score >= 15) Jeux.addStars(1);
      sounds.win();
      if (record && score > 0) confetti(50, ["⚡", "⭐", "🎉"]);
      document.getElementById("otitle").textContent = `⚡ ${score} points !`;
      document.getElementById("otext").textContent =
        `${avg ? `Vitesse moyenne : ${(avg / 1000).toFixed(2).replace(".", ",")} seconde. ` : ""}Record : ${Math.max(score, best(rule.id))}. Choisis un autre jeu de réflexe :`;
      bravo(`${score} points !${record && score > 0 ? " C'est un nouveau record !" : ""}`);
      overlay.classList.remove("hidden");
    }
  </script>
</body>
</html>
