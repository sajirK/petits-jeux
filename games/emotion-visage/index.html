<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Devine l'émotion</title>
  <link rel="stylesheet" href="../../css/common.css" />
  <style>
    body { background: linear-gradient(160deg, #fff3bf, #ffd8a8); }
    #question { font-size: clamp(18px, 4.2vmin, 26px); text-align: center; margin-bottom: 6px; }
    #face {
      width: clamp(150px, 38vmin, 240px); aspect-ratio: 1; border-radius: 50%;
      display: grid; place-items: center; font-size: clamp(100px, 26vmin, 170px);
      background: #fff; box-shadow: 0 8px 0 rgba(0,0,0,0.1);
      animation: bounce-in 0.45s; transition: background 0.4s;
    }
    #body { min-height: 1.4em; font-size: clamp(16px, 3.8vmin, 22px); margin: 12px 0; text-align: center; max-width: 560px; }
    #options { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; max-width: 760px; }
    .opt {
      min-width: clamp(130px, 30vmin, 190px); padding: 14px 18px; border-radius: 22px;
      background: #fff; box-shadow: 0 6px 0 rgba(0,0,0,0.12);
      font-size: clamp(20px, 4.6vmin, 28px); font-weight: bold;
    }
    .opt:active { transform: scale(0.94); }
    .opt.good { background: #b7efc5; animation: bounce-in 0.4s; }
    .opt.bad { background: #ffe3e3; }
    #stars { font-size: clamp(20px, 4.5vmin, 28px); min-height: 1.3em; margin-top: 14px; }
  </style>
</head>
<body>
  <div class="brain">
    <h1 class="game-title">Devine l'émotion</h1>
    <div class="brain-bar" id="bar"></div>
    <div id="question">Comment se sent ce visage ? <button id="speak" style="background:#fff;border-radius:50%;width:44px;height:44px;font-size:22px;box-shadow:var(--shadow)">🔊</button></div>
    <div id="face"></div>
    <div id="body"></div>
    <div id="options"></div>
    <div id="stars"></div>
  </div>

  <script src="../../js/common.js"></script>
  <script src="../../js/emotions.js"></script>
  <script>
    Jeux.addHomeButton();
    const { sounds, say, bravo, confetti } = Jeux;
    const E = Emotions.EMOTIONS;
    const prog = Jeux.progress("emotion-visage", 3);
    const badge = Jeux.levelBadge(prog, () => next());
    document.getElementById("bar").appendChild(badge);
    const face = document.getElementById("face");
    const bodyEl = document.getElementById("body");
    const optionsEl = document.getElementById("options");
    const starsEl = document.getElementById("stars");
    let q, busy = false, wrongs = 0, stars = 0;

    document.getElementById("speak").onclick = () => say("Comment se sent ce visage ?");

    function next() {
      busy = false; wrongs = 0;
      q = Emotions.faceQuestion(prog.level, Math.random, q && q.answer);
      face.textContent = E[q.answer].emoji;
      face.style.background = "#fff";
      face.style.animation = "none"; void face.offsetWidth; face.style.animation = "";
      bodyEl.textContent = "";
      optionsEl.innerHTML = "";
      q.options.forEach((k) => {
        const b = document.createElement("button");
        b.className = "opt";
        b.textContent = E[k].label;
        b.onclick = () => answer(b, k);
        optionsEl.appendChild(b);
      });
      setTimeout(() => say("Comment se sent ce visage ?"), 400);
    }

    function answer(btn, k) {
      if (busy) return;
      const e = E[k];
      if (k === q.answer) {
        busy = true;
        btn.classList.add("good");
        face.style.background = e.color;
        bodyEl.textContent = e.body;
        sounds.success();
        if (wrongs === 0) {
          stars++;
          starsEl.textContent = "⭐".repeat(stars % 10 || 10);
          if (stars % 10 === 0) { confetti(40, ["💛", "⭐"]); sounds.win(); Jeux.addStars(1); }
        }
        const lv = wrongs === 0 ? prog.success() : null;
        badge.update();
        // le nom de l'émotion + comment on la reconnaît
        bravo(`C'est ${e.noun} ! ${e.body}`);
        if (lv === "up") setTimeout(() => { sounds.win(); say(`Niveau ${prog.level} ! Il y a de nouvelles émotions à découvrir.`); }, 4200);
        setTimeout(next, lv === "up" ? 7000 : 4500);
      } else {
        wrongs++;
        btn.classList.add("bad", "shake");
        setTimeout(() => btn.classList.remove("shake"), 400);
        sounds.wrong();
        if (prog.fail() === "down") badge.update();
        say("Regarde bien sa bouche et ses yeux. Essaie encore !");
      }
    }

    next();
  </script>
</body>
</html>
