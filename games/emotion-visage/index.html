<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Devine l'émotion</title>
  <link rel="stylesheet" href="../../css/common.css?v=2.0.0" />
  <link rel="stylesheet" href="../../css/tokens.css?v=2.0.0" />
  <link rel="stylesheet" href="../../css/kit.css?v=2.0.0" />
  <style>
    .k-choice.face { font-size: clamp(64px, 16vmin, 110px); min-width: clamp(110px, 24vmin, 160px); min-height: clamp(110px, 24vmin, 160px); }
    .k-choice.face small { opacity: 0; } .k-choice.face.k-good small { opacity: 1; }
    .body { font-size: var(--fs-md); text-align: center; min-height: 1.6em; margin-top: var(--s-3); color: var(--c-ink-soft); }
  </style>
</head>
<body>
  <script src="../../js/common.js?v=2.0.0"></script>
  <script src="../../js/kit/levels.js?v=2.0.0"></script>
  <script src="../../js/kit/kit.js?v=2.0.0"></script>
  <script src="../../js/emotions.js?v=2.0.0"></script>
  <script src="logic.js?v=2.0.0"></script>
  <script>
    const E = Emotions.EMOTIONS;
    let last = null;
    Kit.game({
      id: "emotion-visage", title: "Devine l'émotion", icon: "😊",
      bg: "linear-gradient(160deg, #fff3bf, #ffd8a8)",
      instruction: () => "Écoute l'émotion, et touche le bon visage !",
      levels: EmotionVisageLogic.LEVELS,
      start(round) {
        const q = EmotionVisageLogic.question(round.level, Math.random, last);
        last = q.answer;
        const e = E[q.answer];
        const ask = `Touche le visage de ${e.noun} !`;
        Kit.ui.prompt(round.stage, { visual: "👂❓", onTap: () => round.say(ask) });
        const body = Kit.ui.el("div", "body");
        const buttons = Kit.ui.choices(round.stage, q.options, {
          cls: "face",
          render(k, b) { b.innerHTML = `<span>${E[k].emoji}</span><small>${E[k].label}</small>`; },
          onPick(k, b) {
            if (k === q.answer) { body.textContent = e.body; round.win(b, `C'est ${e.noun} ! ${e.body}`, { praise: false, delay: 3800 }); }
            else round.miss(b, `Ça, c'est ${E[k].noun}. ${ask}`);
          },
        });
        round.stage.appendChild(body);
        round.setHintTarget(() => buttons[q.options.indexOf(q.answer)]);
        round.timeout(() => round.say(ask), round.index === 0 ? 2400 : 350);
      },
    });
  </script>
</body>
</html>
