<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Les Lettres</title>
  <link rel="stylesheet" href="../../css/common.css?v=2.0.0-dev" />
  <link rel="stylesheet" href="../../css/tokens.css?v=2.0.0-dev" />
  <link rel="stylesheet" href="../../css/kit.css?v=2.0.0-dev" />
  <style>
    .slots { display: flex; gap: clamp(6px, 2vmin, 12px); margin: -6px 0 var(--s-4); }
    .slot { width: clamp(50px, 12vmin, 86px); height: clamp(60px, 15vmin, 104px); border-radius: var(--r-md); background: rgba(255,255,255,0.55); border: 4px dashed rgba(47,37,69,0.3); display: grid; place-items: center; font-size: clamp(36px, 9vmin, 66px); font-weight: bold; color: rgba(47,37,69,0.22); }
    .slot.next { border-color: #ef476f; animation: pulse 1s infinite; }
    .slot.done { background: #fff; border: 4px solid var(--c-success); color: var(--c-ink); animation: k-good var(--t-slow) var(--ease-bounce); }
    @keyframes pulse { 50% { transform: scale(1.06); } }
    .k-choice.tile { color: #fff; text-shadow: 0 3px 0 rgba(0,0,0,0.2); min-width: clamp(64px, 15vmin, 100px); min-height: clamp(64px, 15vmin, 100px); }
    .k-choice.tile.used { visibility: hidden; }
  </style>
</head>
<body>
  <script src="../../js/common.js?v=2.0.0-dev"></script>
  <script src="../../js/kit/levels.js?v=2.0.0-dev"></script>
  <script src="../../js/kit/kit.js?v=2.0.0-dev"></script>
  <script src="logic.js?v=2.0.0-dev"></script>
  <script>
    const LT = LettresLogic;
    const COLORS = ["#ef476f", "#ff9f1c", "#06d6a0", "#118ab2", "#7b2cbf", "#f15bb5", "#00bbf9"];
    let list = [];
    Kit.game({
      id: "lettres", title: "Les Lettres", icon: "🔤",
      bg: "linear-gradient(160deg, #caf0f8, #a0c4ff)",
      instruction: () => "Écris le mot : touche les lettres dans l'ordre !",
      levels: LT.LEVELS,
      start(round) {
        if (round.index === 0) {
          list = LT.words(round.level);
          // le prénom de l'enfant en premier mot, s'il est de la bonne taille
          const nw = LT.nameWord(Jeux.NAME);
          if (nw && round.level <= 2) list[0] = [nw, Jeux.getAvatar(), Jeux.NAME];
        }
        const [word, emoji, spoken] = list[round.index];
        Kit.ui.prompt(round.stage, { visual: emoji, onTap: () => round.say(spoken) });
        const slots = Kit.ui.el("div", "slots");
        word.split("").forEach((l, i) => slots.appendChild(Kit.ui.el("div", "slot" + (i === 0 ? " next" : ""), l)));
        round.stage.appendChild(slots);
        const tiles = LT.tiles(word, round.level);
        let pos = 0;
        const buttons = Kit.ui.choices(round.stage, tiles, {
          cls: "tile",
          render(l, b) { b.textContent = l; b.style.background = COLORS[tiles.indexOf(l) % COLORS.length]; },
          onPick(l, b) {
            if (l === word[pos]) {
              const s = slots.children[pos]; s.classList.remove("next"); s.classList.add("done");
              b.classList.add("used");
              Jeux.sounds.step(pos);
              round.say(LT.LETTER_NAMES[l]);
              pos++;
              if (pos < word.length) slots.children[pos].classList.add("next");
              else round.win(null, `Tu as écrit ${spoken} !`, { delay: 2600 });
            } else round.miss(b, `Ça, c'est ${LT.LETTER_NAMES[l]}. Cherche le ${LT.LETTER_NAMES[word[pos]]}.`);
          },
        });
        round.setHintTarget(() => buttons.find((b, i) => !b.classList.contains("used") && tiles[i] === word[pos]));
        round.timeout(() => round.say(spoken === Jeux.NAME ? `On écrit ton prénom : ${spoken} !` : `On écrit ${spoken} !`), round.index === 0 ? 2400 : 350);
      },
    });
  </script>
</body>
</html>
