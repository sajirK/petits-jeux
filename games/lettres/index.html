<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Les Lettres</title>
  <link rel="stylesheet" href="../../css/common.css" />
  <style>
    html, body { height: 100%; overflow: hidden; }
    body {
      background: linear-gradient(160deg, #caf0f8, #a0c4ff);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #picture { font-size: clamp(70px, 18vw, 120px); line-height: 1; margin: 4px 0; animation: bounce-in 0.5s; }
    #word { display: flex; gap: clamp(6px, 2vw, 14px); margin: 10px 0 20px; }
    .slot {
      width: clamp(52px, 14vw, 96px);
      height: clamp(64px, 17vw, 116px);
      border-radius: 18px;
      background: rgba(255,255,255,0.55);
      border: 4px dashed rgba(59,42,77,0.35);
      display: grid; place-items: center;
      font-size: clamp(38px, 10vw, 74px);
      font-weight: bold;
      color: rgba(59,42,77,0.25);
    }
    .slot.next { border-color: #ef476f; animation: pulse 1s infinite; }
    .slot.done { background: #fff; border: 4px solid #06d6a0; color: var(--ink); animation: bounce-in 0.3s; }
    @keyframes pulse { 50% { transform: scale(1.06); } }
    #tiles {
      display: flex; flex-wrap: wrap; justify-content: center;
      gap: clamp(10px, 3vw, 20px);
      width: min(94vw, 760px);
      padding-bottom: max(16px, env(safe-area-inset-bottom));
    }
    .tile {
      width: clamp(64px, 17vw, 110px);
      height: clamp(64px, 17vw, 110px);
      border-radius: 22px;
      font-size: clamp(40px, 11vw, 70px);
      font-weight: bold;
      box-shadow: 0 7px 0 rgba(0,0,0,0.18);
      color: #fff;
      text-shadow: 0 3px 0 rgba(0,0,0,0.2);
      transition: transform 0.1s, opacity 0.3s;
    }
    .tile:active { transform: scale(0.9) translateY(5px); }
    .tile.used { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <h1 class="game-title">Les lettres</h1>
  <div id="picture"></div>
  <div id="word"></div>
  <div id="tiles"></div>

  <script src="../../js/common.js"></script>
  <script>
    Jeux.addHomeButton();
    const { sounds, say, shuffle, pick, confetti, bravo, NAME } = Jeux;
    // Le prénom de l'enfant d'abord (s'il est court et sans tiret), puis des petits mots faciles
    const NAME_WORD = NAME.toUpperCase().replace(/[^A-ZÀ-ÖØ-Ý]/g, "");
    const WORDS = [
      ["PAPA", "👨", "papa"], ["MAMAN", "👩", "maman"], ["CHAT", "🐱", "chat"],
      ["LION", "🦁", "lion"], ["SOLEIL", "☀️", "soleil"], ["AUTO", "🚗", "auto"],
      ["LUNE", "🌙", "lune"], ["VACHE", "🐮", "vache"], ["ROBOT", "🤖", "robot"],
      ["POMME", "🍎", "pomme"], ["BEBE", "👶", "bébé"], ["ARBRE", "🌳", "arbre"],
      ["OURS", "🐻", "ours"], ["DINO", "🦖", "dino"], ["COEUR", "❤️", "cœur"],
    ];
    if (NAME_WORD.length >= 2 && NAME_WORD.length <= 8) WORDS.unshift([NAME_WORD, Jeux.getAvatar(), NAME]);
    const LETTER_NAMES = { A:"a",B:"bé",C:"cé",D:"dé",E:"e",F:"effe",G:"gé",H:"hache",I:"i",J:"ji",K:"ka",L:"elle",M:"emme",N:"enne",O:"o",P:"pé",Q:"ku",R:"erre",S:"esse",T:"té",U:"u",V:"vé",W:"double vé",X:"ixe",Y:"i grec",Z:"zède" };
    const TILE_COLORS = ["#ef476f", "#ff9f1c", "#06d6a0", "#118ab2", "#7b2cbf", "#f15bb5", "#00bbf9"];
    const picEl = document.getElementById("picture");
    const wordEl = document.getElementById("word");
    const tilesEl = document.getElementById("tiles");
    let index = 0, word, pos;

    function round() {
      const [w, emoji, spoken] = WORDS[index % WORDS.length];
      word = w; pos = 0;
      picEl.textContent = emoji;
      picEl.style.animation = "none"; void picEl.offsetWidth; picEl.style.animation = "";
      wordEl.innerHTML = "";
      [...w].forEach((l, i) => {
        const s = document.createElement("div");
        s.className = "slot" + (i === 0 ? " next" : "");
        s.textContent = l; // lettre en "fantôme" pour aider
        wordEl.appendChild(s);
      });
      tilesEl.innerHTML = "";
      // Les lettres du mot + 1 ou 2 lettres en plus pour corser un peu
      const extras = shuffle([..."ABCDEFGILMNOPRSTU"].filter((l) => !w.includes(l))).slice(0, w.length > 4 ? 1 : 2);
      shuffle([...w, ...extras]).forEach((l, i) => {
        const t = document.createElement("button");
        t.className = "tile";
        t.textContent = l;
        t.style.background = TILE_COLORS[i % TILE_COLORS.length];
        t.onclick = () => tap(t, l);
        tilesEl.appendChild(t);
      });
      setTimeout(() => say(spoken === NAME ? `On écrit ton prénom : ${NAME} !` : `On écrit ${spoken} !`), 400);
    }

    function tap(t, l) {
      if (l === word[pos]) {
        const slot = wordEl.children[pos];
        slot.classList.remove("next");
        slot.classList.add("done");
        t.classList.add("used");
        sounds.step(pos);
        say(LETTER_NAMES[l] || l);
        pos++;
        if (pos < word.length) {
          wordEl.children[pos].classList.add("next");
        } else {
          setTimeout(() => {
            sounds.win();
            confetti(45, ["🎉", "⭐", picEl.textContent]);
            Jeux.addStars(1);
            const spoken = WORDS[index % WORDS.length][2];
            bravo(`Tu as écrit ${spoken} !`);
            index++;
            setTimeout(round, 3000);
          }, 500);
        }
      } else {
        sounds.wrong();
        t.classList.remove("shake"); void t.offsetWidth; t.classList.add("shake");
        say(`Non, ça c'est ${LETTER_NAMES[l] || l}. Cherche le ${LETTER_NAMES[word[pos]] || word[pos]}.`);
      }
    }
    round();
  </script>
</body>
</html>
