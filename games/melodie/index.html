<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>La Mémoire Musicale</title>
  <link rel="stylesheet" href="../../css/common.css?v=2.1.0" />
  <link rel="stylesheet" href="../../css/tokens.css?v=2.1.0" />
  <link rel="stylesheet" href="../../css/kit.css?v=2.1.0" />
  <style>
    .k-bar .k-title { color: #fff; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: clamp(12px, 3vmin, 24px); width: min(94vw, 62vh, 600px); aspect-ratio: 1; }
    .grid.three { grid-template-columns: repeat(3, 1fr); aspect-ratio: 3 / 1.2; width: min(94vw, 90vh, 760px); }
    .pad { border-radius: 30px; font-size: clamp(56px, 13vmin, 112px); box-shadow: 0 8px 0 rgba(0,0,0,0.35), inset 0 -10px 0 rgba(0,0,0,0.15); filter: brightness(0.75) saturate(0.85); transition: filter 0.08s, transform 0.08s; touch-action: none; }
    .pad.lit { filter: brightness(1.25) saturate(1.2); transform: scale(1.04); box-shadow: 0 0 40px 10px rgba(255,255,255,0.6), 0 8px 0 rgba(0,0,0,0.35); }
    .ear { font-size: clamp(40px, 9vmin, 64px); min-height: 1.3em; text-align: center; }
    .wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; width: 100%; }
    .dots { display: flex; gap: 8px; }
    .dots i { width: 18px; height: 18px; border-radius: 50%; background: rgba(255,255,255,0.25); }
    .dots i.on { background: #ffd166; }
  </style>
</head>
<body>
  <script src="../../js/common.js?v=2.1.0"></script>
  <script src="../../js/kit/levels.js?v=2.1.0"></script>
  <script src="../../js/kit/kit.js?v=2.1.0"></script>
  <script src="logic.js?v=2.1.0"></script>
  <script>
    const ML = MelodieLogic;

    function start(round) {
      const cfg = round.cfg, el = Kit.ui.el;
      const len = cfg.lengths[round.index];
      const seq = ML.melody(len, cfg.pads);
      let pos = 0, listening = false, replays = 0;
      const wait = (ms) => new Promise((r) => round.timeout(r, ms));
      const wrap = el("div", "wrap"), ear = el("button", "ear", "👂"), dots = el("div", "dots"), grid = el("div", "grid" + (cfg.pads === 3 ? " three" : ""));
      ear.setAttribute("aria-label", "Réécouter la mélodie");
      wrap.append(ear, dots, grid);
      round.stage.appendChild(wrap);
      const showDots = () => { dots.innerHTML = seq.map((_, i) => `<i class="${i < pos ? "on" : ""}"></i>`).join(""); };
      showDots();
      const pads = ML.PADS.slice(0, cfg.pads).map((p, i) => {
        const b = el("button", "pad", p.e);
        b.style.background = p.c;
        b.addEventListener("pointerdown", (e) => { e.preventDefault(); press(i); });
        grid.appendChild(b);
        return b;
      });
      function light(i, ms = 380) { pads[i].classList.add("lit"); Jeux.sounds.bell(ML.PADS[i].f, 0, 0.25, ms / 600); round.timeout(() => pads[i].classList.remove("lit"), ms); }
      async function play() {
        listening = false; ear.textContent = "👂";
        await wait(700);
        const sp = ML.speed(len) * (cfg.fast ? 0.8 : 1);
        for (const i of seq) { light(i, sp * 0.75); await wait(sp); }
        pos = 0; showDots(); listening = true; ear.textContent = "🎹";
      }
      ear.onclick = () => { if (listening) { replays++; play(); } };
      function press(i) {
        if (!listening) return;
        light(i, 250);
        if (i === seq[pos]) {
          pos++; showDots();
          if (pos === seq.length) { listening = false; round.win(grid, len >= 5 ? `${len} notes ! Quelle mémoire !` : "", { delay: 1600 }); }
        } else {
          listening = false;
          round.miss(pads[i], "Écoute encore une fois.");
          round.timeout(play, 1800);
        }
      }
      round.setHintTarget(() => (listening ? pads[seq[pos]] : null));
      round.timeout(() => { if (round.index === 0) round.say("Écoute bien, puis rejoue la mélodie !"); play(); }, round.index === 0 ? 3000 : 600);
    }

    Kit.game({
      id: "melodie", title: "Mémoire Musicale", icon: "🎵",
      bg: "radial-gradient(circle at 50% 30%, #3a0ca3, #10002b)",
      instruction: () => "Écoute la mélodie des animaux, puis rejoue-la dans le même ordre !",
      levels: ML.LEVELS,
      start,
    });
  </script>
</body>
</html>
