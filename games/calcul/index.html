<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Les Calculs malins</title>
  <link rel="stylesheet" href="../../css/common.css?v=2.0.0" />
  <link rel="stylesheet" href="../../css/tokens.css?v=2.0.0" />
  <link rel="stylesheet" href="../../css/kit.css?v=2.0.0" />
  <style>
    .eq { font-size: clamp(42px, 11vmin, 84px); font-weight: bold; background: #fff; border-radius: var(--r-lg); padding: 6px 28px; box-shadow: var(--sh-2); margin-bottom: var(--s-3); letter-spacing: 2px; cursor: pointer; }
    .eq .q { color: var(--c-primary); } .eq .ok { color: var(--c-success); }
    .scene { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 10px; margin-bottom: var(--s-4); max-width: 900px; }
    .grp { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; background: rgba(255,255,255,0.65); border-radius: var(--r-md); padding: 8px 10px; max-width: 44vw; }
    .grp.add { background: rgba(255, 212, 59, 0.45); }
    .obj { font-size: clamp(30px, 7.5vmin, 54px); line-height: 1.1; cursor: pointer; transition: transform var(--t-med), opacity 0.6s, filter 0.6s; }
    .obj.counted { transform: scale(1.22); }
    .obj.gone { opacity: 0.25; filter: grayscale(1); transform: translateY(-14px) rotate(15deg); }
    .op { font-size: clamp(34px, 8vmin, 60px); font-weight: bold; }
  </style>
</head>
<body>
  <script src="../../js/common.js?v=2.0.0"></script>
  <script src="../../js/kit/levels.js?v=2.0.0"></script>
  <script src="../../js/kit/kit.js?v=2.0.0"></script>
  <script src="logic.js?v=2.0.0"></script>
  <script>
const stepOf = (round) => { const a = round.cfg.internal; return a[Math.min(a.length - 1, Math.floor((round.index * a.length) / round.rounds))]; };
    const CL = CalculLogic;
    const NUMS = ["zéro","un","deux","trois","quatre","cinq","six","sept","huit","neuf","dix","onze","douze","treize","quatorze","quinze","seize","dix-sept","dix-huit","dix-neuf","vingt"];
    let lastText = "";
    function eqHTML(q, done) {
      const a = done ? `<span class="ok">${q.answer}</span>` : `<span class="q">?</span>`;
      return q.op === "c10" ? `${q.a} + ${a} = 10` : `${q.a} ${q.op === "-" ? "−" : q.op === "×" ? "×" : "+"} ${q.b} = ${a}`;
    }
    Kit.game({
      id: "calcul", title: "Les Calculs malins", icon: "➕",
      bg: "linear-gradient(160deg, #d3f9d8, #c5f6fa)",
      instruction: () => "Écoute bien le calcul, et touche la bonne réponse !",
      levels: CL.LEVELS,
      start(round) {
        let q, k = 0;
        do { q = CL.generate(stepOf(round)); } while (q.text === lastText && k++ < 10);
        lastText = q.text;
        const eq = Kit.ui.el("button", "eq"); eq.innerHTML = eqHTML(q, false);
        eq.onclick = () => round.say(q.speech);
        round.stage.appendChild(eq);
        if (q.withObjects) {
          const scene = Kit.ui.el("div", "scene");
          let counted = 0;
          const obj = (gone) => {
            const s = Kit.ui.el("span", "obj" + (gone ? " gone" : ""), q.object.e);
            s.onclick = () => { if (s.classList.contains("counted") || s.classList.contains("gone")) return; s.classList.add("counted"); counted++; Jeux.sounds.step(Math.min(11, counted - 1)); round.say(NUMS[counted] || String(counted)); };
            return s;
          };
          if (q.op === "+") {
            const g1 = Kit.ui.el("div", "grp"), g2 = Kit.ui.el("div", "grp add");
            for (let i = 0; i < q.a; i++) g1.appendChild(obj());
            for (let i = 0; i < q.b; i++) g2.appendChild(obj());
            scene.append(g1, Kit.ui.el("span", "op", "+"), g2);
          } else {
            const g = Kit.ui.el("div", "grp"); const all = [];
            for (let i = 0; i < q.a; i++) { const o = obj(); all.push(o); g.appendChild(o); }
            scene.appendChild(g);
            // ceux qui "partent" disparaissent sous ses yeux
            round.timeout(() => all.slice(q.a - q.b).forEach((o, i) => round.timeout(() => { o.classList.add("gone"); Jeux.sounds.slide(600, 300, 0.1, 0.12); }, i * 260)), 1200);
          }
          round.stage.appendChild(scene);
        }
        const buttons = Kit.ui.choices(round.stage, q.options, {
          onPick(v, b) {
            if (CL.check(q, v)) {
              eq.innerHTML = eqHTML(q, true);
              const s = q.op === "c10" ? `${q.a} plus ${q.answer} égale 10 !` : `${q.a} ${q.op === "-" ? "moins" : q.op === "×" ? "fois" : "plus"} ${q.b} égale ${q.answer} !`;
              round.win(b, s, { delay: 2400 });
            } else round.miss(b, CL.hint(q));
          },
        });
        round.setHintTarget(() => buttons[q.options.indexOf(q.answer)]);
        round.timeout(() => round.say(q.speech), round.index === 0 ? 2600 : 350);
      },
    });
  </script>
</body>
</html>
