<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Respire avec moi</title>
  <link rel="stylesheet" href="../../css/common.css" />
  <style>
    html, body { height: 100%; overflow: hidden; }
    body { background: linear-gradient(180deg, #a5d8ff, #e7f5ff); transition: background 4s; }
    body.out { background: linear-gradient(180deg, #d0bfff, #f3f0ff); }
    .brain { height: 100%; }
    #modes { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-bottom: 6px; }
    #modes .big-btn { font-size: clamp(16px, 3.8vmin, 24px); padding: 10px 16px; }
    #modes .big-btn.sel { background: #ffd166; }
    #stage { flex: 1; min-height: 0; width: 100%; display: grid; place-items: center; position: relative; }
    /* ballon */
    #balloon {
      width: 34vmin; height: 40vmin; max-width: 220px; max-height: 260px;
      border-radius: 50% 50% 46% 46% / 55% 55% 45% 45%;
      background: radial-gradient(circle at 35% 30%, #ffc9c9, #ff6b6b 60%, #e03131);
      box-shadow: inset -14px -18px 0 rgba(0,0,0,0.12);
      transform: scale(0.55); transition: transform 4s ease-in-out;
      position: relative;
    }
    #balloon::after { content: ""; position: absolute; left: 50%; bottom: -60px; width: 2px; height: 60px; background: #868e96; }
    /* fleur et bougie */
    #flowerCandle { display: none; gap: 12vmin; align-items: flex-end; }
    .flower, .candle { font-size: clamp(80px, 22vmin, 150px); line-height: 1; transition: transform 1s, opacity 1s, filter 1s; text-align: center; }
    .flower.active { transform: scale(1.3); filter: drop-shadow(0 0 20px #fff); }
    .candle { position: relative; }
    .flame { position: absolute; left: 50%; top: -0.38em; transform: translateX(-50%); font-size: 0.45em; transition: transform 5s ease-in, opacity 5s; animation: flicker 0.25s infinite alternate; }
    .flame.out { transform: translateX(-50%) scale(0.15) rotate(25deg); opacity: 0.1; }
    @keyframes flicker { to { margin-top: -3px; } }
    .mode-fleur #balloon { display: none; }
    .mode-fleur #flowerCandle { display: flex; }
    #cue { font-size: clamp(26px, 6.5vmin, 46px); font-weight: bold; text-align: center; min-height: 1.4em; margin: 8px 0; color: #364fc7; }
    #dots { display: flex; gap: 10px; margin-bottom: 12px; }
    #dots i { width: 18px; height: 18px; border-radius: 50%; background: rgba(0,0,0,0.12); transition: background 0.4s; }
    #dots i.on { background: #4dabf7; }
    #start { margin-bottom: max(16px, env(safe-area-inset-bottom)); }
    #after { display: none; gap: 12px; flex-wrap: wrap; justify-content: center; margin-bottom: max(16px, env(safe-area-inset-bottom)); }
    #after a, #after button { text-decoration: none; }
  </style>
</head>
<body>
  <div class="brain">
    <h1 class="game-title">Respire avec moi</h1>
    <div id="modes">
      <button class="big-btn sel" data-mode="ballon">🎈 Le ballon</button>
      <button class="big-btn" data-mode="fleur">🌸 Fleur et bougie 🕯️</button>
    </div>
    <div id="stage">
      <div id="balloon"></div>
      <div id="flowerCandle"><div class="flower">🌸</div><div class="candle">🕯️<span class="flame">🔥</span></div></div>
    </div>
    <div id="cue">Installe-toi bien, puis appuie sur Commencer</div>
    <div id="dots"></div>
    <button class="big-btn" id="start">▶️ Commencer</button>
    <div id="after">
      <button class="big-btn" id="again">🔁 Encore</button>
      <a class="big-btn" href="../meteo/index.html">🌤️ Comment je me sens ?</a>
    </div>
  </div>

  <script src="../../js/common.js"></script>
  <script>
    Jeux.addHomeButton();
    const { say, sounds, confetti } = Jeux;
    const CYCLES = 5, IN = 4000, HOLD = 1000, OUT = 5000; // inspirer 4 s, expirer 5 s : plus long pour se calmer
    let mode = "ballon", running = false, timers = [];
    const balloon = document.getElementById("balloon");
    const flower = document.querySelector(".flower");
    const flame = document.querySelector(".flame");
    const cue = document.getElementById("cue");
    const dots = document.getElementById("dots");
    const startBtn = document.getElementById("start");
    const after = document.getElementById("after");

    document.querySelectorAll("#modes button").forEach((b) => {
      b.onclick = () => {
        if (running) return;
        mode = b.dataset.mode;
        document.querySelectorAll("#modes button").forEach((x) => x.classList.toggle("sel", x === b));
        document.body.classList.toggle("mode-fleur", mode === "fleur");
        sounds.click();
      };
    });

    function later(fn, ms) { timers.push(setTimeout(fn, ms)); }

    function breathIn(i) {
      document.body.classList.remove("out");
      cue.textContent = mode === "ballon" ? "Inspire par le nez… le ballon se gonfle" : "Sens la fleur… inspire par le nez";
      say(mode === "ballon" ? "Inspire" : "Sens la fleur", { rate: 0.8 });
      balloon.style.transition = `transform ${IN}ms ease-in-out`;
      balloon.style.transform = "scale(1)";
      flower.classList.add("active");
      flame.classList.remove("out");
      sounds.noise(IN / 1000, { from: 300, to: 700, q: 0.6, volume: 0.05 });
      later(() => { cue.textContent = "Garde l'air un petit peu…"; }, IN);
      later(() => breathOut(i), IN + HOLD);
    }

    function breathOut(i) {
      document.body.classList.add("out");
      cue.textContent = mode === "ballon" ? "Souffle doucement par la bouche…" : "Souffle tout doucement sur la bougie…";
      say(mode === "ballon" ? "Souffle doucement" : "Souffle la bougie", { rate: 0.8 });
      balloon.style.transition = `transform ${OUT}ms ease-in-out`;
      balloon.style.transform = "scale(0.55)";
      flower.classList.remove("active");
      flame.classList.add("out");
      sounds.noise(OUT / 1000, { from: 700, to: 250, q: 0.6, volume: 0.05 });
      dots.children[i].classList.add("on");
      later(() => (i + 1 < CYCLES ? breathIn(i + 1) : finish()), OUT + 600);
    }

    function start() {
      running = true;
      startBtn.style.display = "none";
      after.style.display = "none";
      dots.innerHTML = "<i></i>".repeat(CYCLES);
      cue.textContent = "On respire ensemble, 5 fois.";
      say("On respire ensemble, cinq fois. Installe-toi bien.", { rate: 0.85 });
      later(() => breathIn(0), 3500);
    }

    function finish() {
      running = false;
      document.body.classList.remove("out");
      flame.classList.remove("out");
      cue.textContent = "Bravo ! Tu as respiré 5 fois. 💛";
      say(`Bravo ${Jeux.NAME} ! Tu as très bien respiré. Comment tu te sens maintenant ?`);
      sounds.bell(784, 0, 0.2, 1.5);
      confetti(20, ["💛", "🫧", "✨"]);
      Jeux.addStars(1);
      after.style.display = "flex";
    }

    startBtn.onclick = start;
    document.getElementById("again").onclick = start;
  </script>
</body>
</html>
