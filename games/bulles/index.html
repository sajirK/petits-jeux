<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Les bulles</title>
  <link rel="stylesheet" href="../../css/common.css?v=2.0.0-dev" />
  <link rel="stylesheet" href="../../css/tokens.css?v=2.0.0-dev" />
  <link rel="stylesheet" href="../../css/kit.css?v=2.0.0-dev" />
  <style>
    .arena { position: absolute; inset: 0; overflow: hidden; }
    .bubble { position: absolute; left: 0; top: 0; border-radius: 50%; border: 3px solid rgba(255, 255, 255, 0.85); display: grid; place-items: center; will-change: transform; touch-action: none; }
    .bubble span { pointer-events: none; }
    .bubble.wrong { animation: wob .35s; }
    @keyframes wob { 25% { margin-left: -8px; } 75% { margin-left: 8px; } }
    .pop-text { position: absolute; pointer-events: none; font-size: 44px; animation: rise 0.9s ease-out forwards; z-index: 3; }
    @keyframes rise { from { transform: translate(-50%, -50%) scale(0.6); opacity: 1; } to { transform: translate(-50%, -160%) scale(1.4); opacity: 0; } }
    .goal { position: absolute; left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 4; display: flex; align-items: center; gap: 10px; background: #fff; border-radius: 999px; padding: 6px 16px 6px 8px; box-shadow: var(--sh-2); font-size: 30px; pointer-events: auto; min-height: var(--tap-min); }
    .goal i { width: 52px; height: 52px; border-radius: 50%; display: block; border: 3px solid #fff; box-shadow: 0 0 0 3px rgba(0,0,0,0.08); }
    .goal.change { animation: k-in 0.5s var(--ease-bounce); }
  </style>
</head>
<body>
  <script src="../../js/common.js?v=2.0.0-dev"></script>
  <script src="../../js/kit/levels.js?v=2.0.0-dev"></script>
  <script src="../../js/kit/kit.js?v=2.0.0-dev"></script>
  <script src="logic.js?v=2.0.0-dev"></script>
  <script>
    const BL = BullesLogic;
    const pick = (a) => a[Math.floor(Math.random() * a.length)];

    function start(round) {
      const cfg = round.cfg, el = Kit.ui.el;
      const meter = round.meter("🫧", cfg.goal);
      const arena = el("div", "arena");
      round.stage.appendChild(arena);
      const bubbles = [];
      let score = 0, target = null, sinceChange = 0, spawnT = 0;
      let goal = null;
      const sayTarget = () => round.say(`Éclate les bulles ${target} !`);
      if (cfg.color) {
        goal = el("button", "goal");
        goal.innerHTML = `🎯 <i></i>`;
        goal.onclick = sayTarget;
        arena.appendChild(goal);
      }
      function newTarget() {
        target = BL.nextTarget(target);
        goal.querySelector("i").style.background = BL.COLORS[target];
        goal.classList.remove("change"); void goal.offsetWidth; goal.classList.add("change");
        sayTarget();
      }
      function spawn() {
        const W = arena.clientWidth, H = arena.clientHeight;
        const size = cfg.size[0] + Math.random() * (cfg.size[1] - cfg.size[0]);
        const color = BL.bubbleColor(cfg, target);
        const c = BL.COLORS[color];
        const b = { size, color, x: Math.random() * Math.max(10, W - size), y: H + 10, speed: cfg.speed * (0.8 + Math.random() * 0.5), phase: Math.random() * 6.28 };
        const e = el("div", "bubble");
        e.style.width = e.style.height = size + "px";
        e.style.background = `radial-gradient(circle at 30% 30%, rgba(255,255,255,.98) 0 12%, ${c}66 13% 56%, ${c}bb 100%)`;
        e.style.boxShadow = `inset -6px -8px 18px ${c}55, inset 6px 6px 14px #ffffff66`;
        if (Math.random() < 0.45) e.innerHTML = `<span style="font-size:${size * 0.45}px">${pick(BL.SURPRISES)}</span>`;
        e.addEventListener("pointerdown", (ev) => { ev.preventDefault(); pop(b); });
        b.el = e;
        arena.appendChild(e); bubbles.push(b);
      }
      function pop(b) {
        if (round.ended || !bubbles.includes(b)) return;
        if (!BL.isGood(cfg, b.color, target)) {
          b.el.classList.remove("wrong"); void b.el.offsetWidth; b.el.classList.add("wrong");
          round.oops(); Jeux.sounds.wrong(); sayTarget();
          return;
        }
        bubbles.splice(bubbles.indexOf(b), 1);
        const r = b.el.getBoundingClientRect();
        round.burstAt(r.left + r.width / 2, r.top + r.height / 2, { colors: [BL.COLORS[b.color], "#fff"] });
        const item = b.el.textContent;
        b.el.remove();
        Jeux.sounds.pop();
        if (item) { const t = el("div", "pop-text", item); t.style.left = b.x + b.size / 2 + "px"; t.style.top = b.y + b.size / 2 + "px"; arena.appendChild(t); round.timeout(() => t.remove(), 1000); }
        score++; meter.set(score);
        if (score >= cfg.goal) { round.timeout(() => round.end({ text: "Bravo ! Toutes les bulles ont éclaté !" }), 400); return; }
        if (cfg.color && ++sinceChange >= cfg.every) { sinceChange = 0; newTarget(); }
      }
      round.loop((dt) => {
        spawnT -= dt;
        if (spawnT <= 0 && bubbles.length < cfg.max) { spawn(); spawnT = 0.45 + Math.random() * 0.6; }
        for (let i = bubbles.length - 1; i >= 0; i--) {
          const b = bubbles[i];
          b.y -= b.speed * 100 * dt;
          b.phase += 1.8 * dt;
          b.el.style.transform = `translate(${b.x + Math.sin(b.phase) * 20}px, ${b.y}px)`;
          if (b.y < -b.size - 20) { b.el.remove(); bubbles.splice(i, 1); }
        }
      });
      round.setHintTarget(() => {
        const H = arena.clientHeight;
        const ok = bubbles.filter((b) => BL.isGood(cfg, b.color, target) && b.y > -b.size / 3 && b.y < H - b.size / 2);
        return ok.length ? ok[0].el : null;
      });
      if (cfg.color) round.timeout(newTarget, 2600);
    }

    Kit.game({
      id: "bulles", title: "Les bulles", icon: "🫧", mode: "arcade",
      bg: "linear-gradient(180deg, #8ad7ff, #c9f0ff 60%, #e6fbff)",
      instruction: (cfg) => cfg.color ? "Éclate seulement les bulles de la bonne couleur ! Regarde la cible en bas." : "Touche les bulles pour les faire éclater !",
      levels: BL.LEVELS,
      start,
    });
  </script>
</body>
</html>
